[package]
name = "hide-ai"
version = "0.1.0"
edition = "2024"
publish = false
description = "Provider boundary for Hide's background AI features: transport, availability, timeouts, cancellation, structured errors and dedup"

[lib]
name = "hide_ai"

[dependencies]
hide-platform = { path = "../hide-platform" }
jsonschema = { version = "=0.58.6", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.190"

[dev-dependencies]
tempfile = "=3.27.0"
