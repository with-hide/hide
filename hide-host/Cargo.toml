[package]
name = "hide-host"
version = "0.1.0"
edition = "2024"
publish = false

# The file host contract: operations on an opened checkout root that Hide
# performs on the machine that owns the files. hided and the core call it in
# process for this machine; `hided node serve` serves the same functions over
# an SSH exec channel on a registered device (PRD S5.5 D-05, D-20; PRD
# core-host-node D-02).

[dependencies]
ureq = { version = "=3.4.2", default-features = false, features = ["rustls"] }
hide-agent-adapter = { path = "../hide-agent-adapter" }
base64 = "=0.23.1"
cap-std = "=4.0.3"
hide-project = { path = "../hide-project" }
hide-herdr-client = { path = "../hide-herdr-client" }
hide-agent-hooks = { path = "../hide-agent-hooks" }
hide-ai = { path = "../hide-ai" }
hide-kit = { path = "../hide-kit" }
hide-node-link = { path = "../hide-node-link" }
hide-platform = { path = "../hide-platform" }
hide-session = { path = "../hide-session" }
ignore = "=0.4.33"
libc = "=0.2.191"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
tempfile = "=3.27.0"
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
rusqlite = { version = "=0.32.1", features = ["bundled"] }
