# portable-pty 0.9.0 from crates.io, as Herdr v0.9.5 vendors it with its four
# patches, plus Hide's own changes; vendor/portable-pty/PATCHES.md lists both.
# The workspace reaches it through `[patch.crates-io]` in the root manifest,
# so it is not a workspace member and keeps its upstream edition.
[package]
edition = "2018"
name = "portable-pty"
version = "0.9.0"
authors = ["Wez Furlong"]
description = "Cross platform pty interface"
documentation = "https://docs.rs/portable-pty"
license = "MIT"
repository = "https://github.com/wezterm/wezterm"
publish = false
autoexamples = false
autotests = false
autobenches = false

[lib]
name = "portable_pty"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
downcast-rs = "1.0"
filedescriptor = "0.8.3"
libc = "0.2"
log = "0.4"
nix = { version = "0.28", features = ["term", "fs"] }
serde = { version = "1.0", optional = true }
serde_derive = { version = "1.0", optional = true }
serial2 = "0.2"
shell-words = "1.1"

[features]
default = []
serde_support = ["serde", "serde_derive"]

[target."cfg(windows)".dependencies]
bitflags = "1.3"
sha2 = "0.10"
winapi = { version = "0.3", features = [
    "winuser",
    "consoleapi",
    "handleapi",
    "fileapi",
    "jobapi2",
    "libloaderapi",
    "namedpipeapi",
    "synchapi",
] }
winreg = "0.10"
