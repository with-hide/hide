[package]
name = "hide-platform"
version = "0.1.0"
edition = "2024"
publish = false

# The operating-system layer under every other crate: what differs between
# macOS, Linux and Windows is written here once and checked by the contract
# tests in `tests/` on all three. The crate has no hide dependencies and no
# state, so those tests build in seconds on a runner that has no workspace.

[dependencies]
interprocess = "=2.4.4"
trash = { version = "=5.2.9", default-features = false }

[target.'cfg(unix)'.dependencies]
# Runs a tied child's supervisor before `main` when this program is started
# as one (`process::spawn_tied`).
ctor = { version = "=1.0.13", default-features = false, features = ["std", "proc_macro"] }
libc = "=0.2.190"
notify = "=8.2.0"

[target.'cfg(windows)'.dependencies]
junction = "=2.1.0"
# trash refuses to compile on Windows unless one COM apartment mode is chosen
# (it is deliberately a compile error). Apartment-threaded is its own default.
trash = { version = "=5.2.9", default-features = false, features = ["coinit_apartmentthreaded"] }
widestring = "=1.2.1"
windows-sys = { version = "=0.61.2", features = [
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Wdk_System_SystemInformation",
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Time",
] }

[dev-dependencies]
tempfile = "=3.27.0"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
