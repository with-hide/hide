[package]
name = "hide-node"
version = "0.1.0"
edition = "2024"
publish = false

# The machine side of Hide (PRD core-host-node D-21): the work a node does on
# the machine it runs on, answered through `hide_node_link::NodeLink`.

[dependencies]
anyhow = "=1.0.104"
base64 = "=0.23.1"
cap-std = "=4.0.3"
futures-util = "=0.3.34"
hide-herdr-client = { path = "../hide-herdr-client" }
hide-host = { path = "../hide-host" }
hide-kit = { path = "../hide-kit" }
hide-node-link = { path = "../hide-node-link" }
hide-platform = { path = "../hide-platform" }
russh = { version = "=0.64.1", default-features = false, features = ["ring", "rsa"] }
russh-config = "=0.58.0"
russh-sftp = "=2.4.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["raw_value"] }
sha2 = "=0.10.9"
tokio = { version = "=1.53.3", features = ["fs", "io-util", "net", "process", "rt", "rt-multi-thread", "sync", "time", "macros"] }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
tempfile = "=3.27.0"
vt100 = "=0.16.2"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.190"
