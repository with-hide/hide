# Version updates for cargo, GitHub Actions and the Rust toolchain. Cargo and
# Actions wait seven days after a release before proposing it, so a version
# that is yanked or patched within its first week never reaches a pull request
# here; Dependabot has no cooldown for the toolchain (see its entry).
# Each proposal's title carries the type prefix CONTRIBUTING.md asks of every
# commit subject and pull request title.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    commit-message:
      prefix: build
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    commit-message:
      prefix: ci
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
  # `channel` in rust-toolchain.toml. The proposal's CI lists what the new
  # compiler and Clippy ask of the code, and the fixes land on that pull
  # request (docs/BUILD.md, "One toolchain version"). Dependabot offers no
  # cooldown for this ecosystem, so a release is proposed the Monday after it
  # ships, and a point release that follows within weeks is proposed again.
  - package-ecosystem: rust-toolchain
    directory: /
    commit-message:
      prefix: build
    schedule:
      interval: weekly
      day: monday
