# Throwaway: measures where the first-wave Windows web unit tests spend their time
# (with-hide/hide-private issue 354) under three variants. Never merged.
name: diag windows unit stall
on:
  push:
    branches: [diag/windows-unit-stall]
permissions:
  contents: read
jobs:
  web-unit:
    name: ${{ matrix.variant }} ${{ matrix.attempt }}
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        variant: [base, exe, trace]
        attempt: [1, 2, 3, 4]
    defaults:
      run:
        shell: bash
    env:
      DIAG_VARIANT: ${{ matrix.variant }}
      DIAG_DIR: ${{ github.workspace }}/diag-out
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: bash scripts/verify-web.sh install --ignore-scripts
      - name: Web shell unit suite, as windows check runs it, with the machine's disk and paging each second
        run: |
          mkdir -p diag-out
          typeperf "\Processor(_Total)\% Processor Time" "\Memory\Pages Input/sec" "\Memory\Page Reads/sec" "\PhysicalDisk(*)\Disk Reads/sec" "\PhysicalDisk(*)\Disk Read Bytes/sec" "\PhysicalDisk(*)\Avg. Disk sec/Read" "\PhysicalDisk(*)\Current Disk Queue Length" -si 1 -sc 600 -f CSV -o diag-out/perf.csv -y > /dev/null 2>&1 &
          if [ "$DIAG_VARIANT" = trace ]; then
            logman start "NT Kernel Logger" -p "Windows Kernel Trace" "(process,img,disk,file,hf)" -o "$RUNNER_TEMP/kernel.etl" -ets -bs 1024 -nb 64 512
          fi
          status=0
          if [ "$DIAG_VARIANT" = trace ]; then DIAG_VARIANT=base bash scripts/verify-web.sh web test || status=$?; else bash scripts/verify-web.sh web test || status=$?; fi
          taskkill //IM typeperf.exe //F || true
          if [ "$DIAG_VARIANT" = trace ]; then
            logman stop "NT Kernel Logger" -ets
            tracerpt "$RUNNER_TEMP/kernel.etl" -o "$RUNNER_TEMP/events.csv" -of CSV -summary diag-out/summary.txt -report diag-out/report.xml -f XML -y > /dev/null
            ls -la "$RUNNER_TEMP"
          fi
          exit $status
      - name: Diagnosis lines
        if: ${{ !cancelled() }}
        run: cat diag-out/*.log | sort; head -3 diag-out/perf.csv
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: diag-${{ matrix.variant }}-${{ matrix.attempt }}
          path: diag-out
          retention-days: 3
