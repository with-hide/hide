# The agent journey (docs/VERIFICATION.md, Agent journey) in CI mode: each
# agent spawned through `hide agent spawn` on an isolated candidate, judged
# from what Hide reports (PRD agent-journey-check D-31, D-46).
#
# `fixture` runs the compiled stand-ins of `web/e2e/shims` in place of Claude
# Code and Codex, with no key, and proves the journey's isolation, spawn,
# verdicts, report and cleanup; it passes only when every cell a stand-in
# imitates passed. It runs on Linux and macOS only (docs/INSTALL.md, What
# each system supports).
# `windows-forms` runs the journey's Windows process jobs, private files and
# pane shell commands on Windows itself. `pr.yml` runs both when the
# journey's code or the shims change, `nightly.yml` and `release.yml` every time.
#
# With `fake`, the `fake` job runs the real CLIs at the versions
# contracts/agent-clis.json pins, with Hide's real kit, answered by the
# journey's fake model (scripts/agent_journey/fake_model.py) and no key, on
# every system named; its report is marked apart from a signed-in one and
# proves no provider. It passes only when every built cell passes for Claude
# Code and Codex, the agents the stand-ins imitate, and no agent's cell fails.
#
# A real login is not measured on CI (operator decision, 2026-10-27): what
# only a login proves, the provider's sign-in, quota and billing, is the
# provider's, and a release measures it with the signed-in agents on the
# operator's Mac (CONTRIBUTING.md, Releases).
# A CLI that answers another version than the pin fails the install and the lane.
# Its report is never a release's agent evidence when it came from the
# stand-ins (CONTRIBUTING.md, Releases).
name: agent journey

on:
  # By hand, the journey alone (docs/VERIFICATION.md, The CI lanes).
  workflow_dispatch:
    inputs:
      systems:
        description: The systems to run, as a JSON array of `linux`, `macos` and `windows`.
        type: string
        default: '["linux","macos","windows"]'
      fake:
        description: Also run the real CLIs against the journey's fake model, with no key.
        type: boolean
        default: false
  workflow_call:
    inputs:
      source-sha:
        description: Explicit public source commit, or the caller commit when omitted.
        type: string
        default: ''
      systems:
        description: The systems to run, as a JSON array of `linux`, `macos` and `windows`.
        type: string
        required: true
      fake:
        description: Also run the real CLIs against the journey's fake model, with no key.
        type: boolean
        default: false
      stand-ins:
        description: Run the stand-ins and the Windows forms, which measure Hide and no agent CLI.
        type: boolean
        default: true
      clis-table:
        description: >-
          A table of contracts/agent-clis.json's shape for the fake lane to install and measure instead
          of the pins; the daily agent canary passes each CLI's latest release (agent-canary.yml).
        type: string
        default: ''

permissions:
  contents: read

env:
  # The journey reads UTF-8 (scripts/agent-journey-check.py); Windows's
  # default encoding is its ANSI code page.
  PYTHONUTF8: "1"

jobs:
  fixture:
    name: agent journey stand-ins (${{ matrix.system }})
    # A Windows-only run leaves no system for the stand-ins.
    if: ${{ inputs.stand-ins != false && inputs.systems != '["windows"]' }}
    runs-on: ${{ fromJSON('{"linux":"ubuntu-latest","macos":"macos-15"}')[matrix.system] }}
    # Every job's cap is at least the sum of its steps' caps, so a step that
    # times out still leaves the report's upload its time
    # (scripts/tests/test_agent_journey_workflow.py).
    timeout-minutes: 95
    strategy:
      fail-fast: false
      matrix:
        system: ${{ fromJSON(inputs.systems) }}
        exclude:
          - system: windows
    defaults:
      run:
        shell: bash
    env:
      HERDR_PLATFORM: ${{ fromJSON('{"linux":"linux-x86_64","macos":"macos-aarch64"}')[matrix.system] }}
      RUN_DIR: agents/runs/agent-journey-fixture-${{ matrix.system }}
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 5
        with:
          ref: ${{ inputs.source-sha || github.sha }}
      # Reads the workspace set another lane saves (docs/BUILD.md, "CI's Rust caches").
      - uses: ./.github/actions/rust-cache
        timeout-minutes: 10
        with:
          set: workspace
          save: false
      - name: Install zsh on Linux
        # Every private pane starts from SHELL=/bin/zsh, and the Herdr fetch
        # script is zsh; the Linux image has neither.
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: sudo apt-get install -y --no-install-recommends zsh
      - name: Build hided, hide, the hooks, Hide's conversation reader and the composer judge
        timeout-minutes: 25
        run: |
          bash scripts/verify-cargo.sh cli
          bash scripts/verify-cargo.sh build -p hide-session --example journey_conversation
          bash scripts/verify-cargo.sh build -p hide-memory --example journey_memory
          bash scripts/verify-cargo.sh build -p hide-agent-adapter --example journey_composer
      - name: Fetch the pinned Herdr runtime
        id: herdr
        timeout-minutes: 5
        run: echo "bin=$(zsh scripts/fetch-herdr-runtime.sh --platform "$HERDR_PLATFORM")" >> "$GITHUB_OUTPUT"
      - name: Build the Claude and Codex stand-ins and the controller's spawn provider
        timeout-minutes: 5
        run: |
          mkdir -p "$RUNNER_TEMP/journey-shims" "$RUNNER_TEMP/journey-controller"
          cc -O1 -o "$RUNNER_TEMP/journey-shims/claude" web/e2e/shims/claude-shim.c
          cp "$RUNNER_TEMP/journey-shims/claude" "$RUNNER_TEMP/journey-shims/codex"
          cc -O2 -o "$RUNNER_TEMP/journey-controller/claude" web/e2e/shims/spawn-provider.c
      - name: The journey on the stand-ins
        id: journey
        # Above the journey's own cap for two agents (25 minutes, cli.py).
        timeout-minutes: 30
        run: |
          set +e
          python3 scripts/agent-journey-check.py --mode ci \
            --fixture-bin "$RUNNER_TEMP/journey-shims" --controller-provider "$RUNNER_TEMP/journey-controller/claude" \
            --herdr-bin "${{ steps.herdr.outputs.bin }}" --run-dir "$RUN_DIR"
          echo "exit=$?" >> "$GITHUB_OUTPUT"
      - name: The lane's verdict
        timeout-minutes: 2
        run: python3 scripts/agent-journey-lane.py "$RUN_DIR/report.json" --lane fixture
      - name: Keep the report
        timeout-minutes: 5
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: agent-journey-fixture-${{ matrix.system }}
          # The report and each cell's evidence; the probe, which held the
          # private daemon, is gone by now.
          path: |
            ${{ env.RUN_DIR }}/report.*
            ${{ env.RUN_DIR }}/*.json
            ${{ env.RUN_DIR }}/*.txt
            ${{ env.RUN_DIR }}/*.log
          if-no-files-found: warn

  windows-forms:
    name: agent journey Windows forms
    if: ${{ inputs.stand-ins != false && contains(fromJSON(inputs.systems), 'windows') }}
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep line endings as committed
        timeout-minutes: 1
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        timeout-minutes: 5
        with:
          ref: ${{ inputs.source-sha || github.sha }}
      - uses: actions/setup-python@v7
        timeout-minutes: 5
        with:
          python-version: "3.12"
      - name: Process jobs, private files and pane shell commands on Windows
        # scripts/tests/test_agent_live_windows.py: an owner that dies takes
        # its children's trees with it, each cap is the Unix guardian's and a
        # crossed one is named, and the files and commands the journey
        # writes work on Windows itself.
        timeout-minutes: 10
        run: python -m unittest scripts/tests/test_agent_live_windows.py -v

  fake:
    name: agent journey fake model (${{ matrix.system }})
    if: ${{ inputs.fake }}
    runs-on: ${{ fromJSON('{"linux":"ubuntu-latest","macos":"macos-15","windows":"windows-latest"}')[matrix.system] }}
    # Seven agents of eleven cells each, about 4 to 7 minutes an agent on
    # macOS and up to 9 on Windows (2026-10-18), inside the journey step's 85;
    # the job's cap is its steps' caps summed.
    timeout-minutes: 170
    strategy:
      fail-fast: false
      matrix:
        system: ${{ fromJSON(inputs.systems) }}
    defaults:
      run:
        shell: bash
    env:
      HERDR_PLATFORM: ${{ fromJSON('{"linux":"linux-x86_64","macos":"macos-aarch64","windows":"windows-x86_64"}')[matrix.system] }}
      RUN_DIR: agents/runs/agent-journey-fake-${{ matrix.system }}
      # The journey needs Python 3.12; Windows names it python.
      PYTHON: ${{ matrix.system == 'windows' && 'python' || 'python3' }}
    steps:
      - name: Keep line endings as committed
        timeout-minutes: 1
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        timeout-minutes: 5
        with:
          ref: ${{ inputs.source-sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/rust-cache
        timeout-minutes: 10
        with:
          set: workspace
          save: false
      - uses: actions/setup-node@v4
        timeout-minutes: 5
        with:
          node-version: 22
      - uses: actions/setup-python@v7
        timeout-minutes: 5
        if: runner.os == 'Windows'
        with:
          python-version: "3.12"
      - name: Install zsh on Linux
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: sudo apt-get install -y --no-install-recommends zsh
      - name: Measure the CLI versions the caller named
        # The install, the report's version check and the lane's verdict all
        # read this table instead of the pins (scripts/agent_journey/clis.py).
        if: ${{ inputs.clis-table != '' }}
        timeout-minutes: 1
        env:
          TABLE: ${{ inputs.clis-table }}
        run: |
          printf '%s\n' "$TABLE" > "$RUNNER_TEMP/agent-clis.json"
          echo "HIDE_AGENT_CLIS_TABLE=$RUNNER_TEMP/agent-clis.json" >> "$GITHUB_ENV"
      - name: Install the pinned agent CLIs
        timeout-minutes: 10
        run: '"$PYTHON" scripts/install-agent-clis.py --all'
      - name: Build hided, hide, the hooks, Hide's conversation reader and the composer judge
        timeout-minutes: 25
        run: |
          bash scripts/verify-cargo.sh cli
          bash scripts/verify-cargo.sh build -p hide-session --example journey_conversation
          bash scripts/verify-cargo.sh build -p hide-memory --example journey_memory
          bash scripts/verify-cargo.sh build -p hide-agent-adapter --example journey_composer
      - name: Fetch the pinned Herdr runtime
        id: herdr
        timeout-minutes: 5
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then
            bin=$(pwsh -NoProfile -File scripts/fetch-herdr-runtime.ps1 | tr -d '\r')
          else
            bin=$(zsh scripts/fetch-herdr-runtime.sh --platform "$HERDR_PLATFORM")
          fi
          echo "bin=$bin" >> "$GITHUB_OUTPUT"
      - name: Build the controller's spawn provider
        timeout-minutes: 5
        # Before the run, as the stand-ins are: a Windows link can outlast the
        # run's 15-second command cap.
        id: controller
        run: |
          provider="$RUNNER_TEMP/journey-controller/claude"
          mkdir -p "${provider%/*}"
          if [[ "$RUNNER_OS" == Windows ]]; then
            provider+=.exe
            clang -O2 -o "$provider" web/e2e/shims/spawn-provider.c
          else
            cc -O2 -o "$provider" web/e2e/shims/spawn-provider.c
          fi
          echo "provider=$provider" >> "$GITHUB_OUTPUT"
      - name: The journey against the fake model
        timeout-minutes: 85
        run: |
          set +e
          "$PYTHON" scripts/agent-journey-check.py --mode ci --fake-model \
            --controller-provider "${{ steps.controller.outputs.provider }}" \
            --herdr-bin "${{ steps.herdr.outputs.bin }}" --run-dir "$RUN_DIR"
          echo "journey exit $?"
      - name: The lane's verdict
        timeout-minutes: 2
        run: '"$PYTHON" scripts/agent-journey-lane.py "$RUN_DIR/report.json" --lane fake'
      - name: Keep the report
        timeout-minutes: 5
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: agent-journey-fake-${{ matrix.system }}
          path: |
            ${{ env.RUN_DIR }}/report.*
            ${{ env.RUN_DIR }}/*.json
            ${{ env.RUN_DIR }}/*.jsonl
            ${{ env.RUN_DIR }}/*.txt
            ${{ env.RUN_DIR }}/*.log
          if-no-files-found: warn

