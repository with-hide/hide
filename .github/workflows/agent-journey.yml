# The agent journey (docs/VERIFICATION.md, Agent journey) in CI mode: each
# agent spawned through `hide agent spawn` on an isolated candidate, judged
# from what Hide reports (PRD agent-journey-check D-31, D-46).
#
# `fixture` runs the compiled stand-ins of `web/e2e/shims` in place of Claude
# Code and Codex, with no key, and proves the journey's isolation, spawn,
# verdicts, report and cleanup; it passes only when every cell a stand-in
# imitates passed. It runs on Linux and macOS only (docs/INSTALL.md, What
# each system supports).
# `windows-forms` runs the journey's Windows process jobs, private files and
# pane shell commands on Windows itself. `pr.yml` runs both when the
# journey's code or the shims change, `nightly.yml` and `release.yml` every time.
#
# With `fake`, the `fake` job runs the real CLIs at the versions
# contracts/agent-clis.json pins, with Hide's real kit, answered by the
# journey's fake model (scripts/agent_journey/fake_model.py) and no key, on
# every system named; its report is marked apart from a signed-in one and
# proves no provider. It passes only when every built cell passes for Claude
# Code and Codex, the agents the stand-ins imitate, and no agent's cell fails.
#
# With `live`, the `login` job runs the real CLIs, pinned the same way, in the
# runner's disposable HOME, signed in with the CI account's keys
# (`HIDE_CLAUDE_API_KEY`, `HIDE_CODEX_API_KEY`, `HIDE_AGY_API_KEY`,
# `HIDE_GROK_API_KEY`, `HIDE_OPENCODE_API_KEY`, `HIDE_PI_API_KEY`,
# `HIDE_OMP_API_KEY`). An agent without its key reads "not configured" and
# leaves a notice, a provider quota refusal leaves a warning; neither fails
# the job. A failed cell, an isolation or cleanup failure, a request budget
# overrun, or a refused login or missing CLI with the key set does. agy's key has 20 requests a day for
# its model across the CI account (agy-contract.yml spends 4 of them a
# night), so agy is measured only on the system `agy` names, or the night's
# system of its rotation, and reads "not measured" with that reason
# elsewhere (docs/VERIFICATION.md, Agent journey). A leg with no agent to
# sign in builds and starts nothing and leaves a notice.
# A CLI that answers another version than the pin fails the install and the lane.
# Its report is never a release's agent evidence when it came from the
# stand-ins (`skills/release/SKILL.md`).
name: agent journey

on:
  # By hand, the journey alone, with the repository's secrets
  # (docs/VERIFICATION.md, The CI lanes).
  workflow_dispatch:
    inputs:
      systems:
        description: The systems to run, as a JSON array of `linux`, `macos` and `windows`.
        type: string
        default: '["linux","macos","windows"]'
      live:
        description: Also run the signed-in journey for each agent whose key is set.
        type: boolean
        default: false
      fake:
        description: Also run the real CLIs against the journey's fake model, with no key.
        type: boolean
        default: false
      agy:
        description: >-
          Where the signed-in journey measures agy: `rotation`, one system's name, or `none`.
        type: string
        default: none
  workflow_call:
    inputs:
      systems:
        description: The systems to run, as a JSON array of `linux`, `macos` and `windows`.
        type: string
        required: true
      live:
        description: Also run the signed-in journey for each agent whose key is set.
        type: boolean
        default: false
      fake:
        description: Also run the real CLIs against the journey's fake model, with no key.
        type: boolean
        default: false
      agy:
        description: >-
          Where the signed-in journey measures agy, whose key has a daily request quota: `rotation` (one
          system a day, by the UTC day of the year, through linux, macos and windows), one system's name, or `none`.
        type: string
        default: none
    secrets:
      HIDE_CLAUDE_API_KEY:
        required: false
      HIDE_CODEX_API_KEY:
        required: false
      HIDE_AGY_API_KEY:
        required: false
      HIDE_GROK_API_KEY:
        required: false
      HIDE_OPENCODE_API_KEY:
        required: false
      HIDE_PI_API_KEY:
        required: false
      HIDE_OMP_API_KEY:
        required: false

permissions:
  contents: read

env:
  # The journey reads UTF-8 (scripts/agent-journey-check.py); Windows's
  # default encoding is its ANSI code page.
  PYTHONUTF8: "1"

jobs:
  fixture:
    name: agent journey stand-ins (${{ matrix.system }})
    # A Windows-only run leaves no system for the stand-ins.
    if: ${{ inputs.systems != '["windows"]' }}
    runs-on: ${{ fromJSON('{"linux":"ubuntu-latest","macos":"macos-15"}')[matrix.system] }}
    # Every job's cap is at least the sum of its steps' caps, so a step that
    # times out still leaves the report's upload its time
    # (scripts/tests/test_agent_journey_workflow.py).
    timeout-minutes: 95
    strategy:
      fail-fast: false
      matrix:
        system: ${{ fromJSON(inputs.systems) }}
        exclude:
          - system: windows
    defaults:
      run:
        shell: bash
    env:
      HERDR_PLATFORM: ${{ fromJSON('{"linux":"linux-x86_64","macos":"macos-aarch64"}')[matrix.system] }}
      RUN_DIR: agents/runs/agent-journey-fixture-${{ matrix.system }}
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 5
      - uses: Swatinem/rust-cache@v2
        timeout-minutes: 10
        with:
          workspaces: ". -> target"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install zsh on Linux
        # Every private pane starts from SHELL=/bin/zsh, and the Herdr fetch
        # script is zsh; the Linux image has neither.
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: sudo apt-get install -y --no-install-recommends zsh
      - name: Build hided, hide, the hooks and Hide's conversation reader
        timeout-minutes: 25
        run: |
          bash scripts/verify-cargo.sh cli
          bash scripts/verify-cargo.sh build -p hide-session --example journey_conversation
          bash scripts/verify-cargo.sh build -p hide-memory --example journey_memory
      - name: Fetch the pinned Herdr runtime
        id: herdr
        timeout-minutes: 5
        run: echo "bin=$(zsh scripts/fetch-herdr-runtime.sh --platform "$HERDR_PLATFORM")" >> "$GITHUB_OUTPUT"
      - name: Build the Claude and Codex stand-ins and the controller's spawn provider
        timeout-minutes: 5
        run: |
          mkdir -p "$RUNNER_TEMP/journey-shims" "$RUNNER_TEMP/journey-controller"
          cc -O1 -o "$RUNNER_TEMP/journey-shims/claude" web/e2e/shims/claude-shim.c
          cp "$RUNNER_TEMP/journey-shims/claude" "$RUNNER_TEMP/journey-shims/codex"
          cc -O2 -o "$RUNNER_TEMP/journey-controller/claude" web/e2e/shims/spawn-provider.c
      - name: The journey on the stand-ins
        id: journey
        # Above the journey's own cap for two agents (25 minutes, cli.py).
        timeout-minutes: 30
        run: |
          set +e
          python3 scripts/agent-journey-check.py --mode ci \
            --fixture-bin "$RUNNER_TEMP/journey-shims" --controller-provider "$RUNNER_TEMP/journey-controller/claude" \
            --herdr-bin "${{ steps.herdr.outputs.bin }}" --run-dir "$RUN_DIR"
          echo "exit=$?" >> "$GITHUB_OUTPUT"
      - name: The lane's verdict
        timeout-minutes: 2
        run: python3 scripts/agent-journey-lane.py "$RUN_DIR/report.json" --lane fixture
      - name: Keep the report
        timeout-minutes: 5
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: agent-journey-fixture-${{ matrix.system }}
          # The report and each cell's evidence; the probe, which held the
          # private daemon, is gone by now.
          path: |
            ${{ env.RUN_DIR }}/report.*
            ${{ env.RUN_DIR }}/*.json
            ${{ env.RUN_DIR }}/*.txt
            ${{ env.RUN_DIR }}/*.log
          if-no-files-found: warn

  windows-forms:
    name: agent journey Windows forms
    if: ${{ contains(fromJSON(inputs.systems), 'windows') }}
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep line endings as committed
        timeout-minutes: 1
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        timeout-minutes: 5
      - uses: actions/setup-python@v5
        timeout-minutes: 5
        with:
          python-version: "3.12"
      - name: Process jobs, private files and pane shell commands on Windows
        # scripts/tests/test_agent_live_windows.py: an owner that dies takes
        # its children's trees with it, each cap is the Unix guardian's and a
        # crossed one is named, and the files and commands the journey
        # writes work on Windows itself.
        timeout-minutes: 10
        run: python -m unittest scripts/tests/test_agent_live_windows.py -v

  fake:
    name: agent journey fake model (${{ matrix.system }})
    if: ${{ inputs.fake }}
    runs-on: ${{ fromJSON('{"linux":"ubuntu-latest","macos":"macos-15","windows":"windows-latest"}')[matrix.system] }}
    # Seven agents of eleven cells each, about 4 to 7 minutes an agent on
    # macOS and up to 9 on Windows (2026-10-18), inside the journey step's 85;
    # the job's cap is its steps' caps summed.
    timeout-minutes: 170
    strategy:
      fail-fast: false
      matrix:
        system: ${{ fromJSON(inputs.systems) }}
    defaults:
      run:
        shell: bash
    env:
      HERDR_PLATFORM: ${{ fromJSON('{"linux":"linux-x86_64","macos":"macos-aarch64","windows":"windows-x86_64"}')[matrix.system] }}
      RUN_DIR: agents/runs/agent-journey-fake-${{ matrix.system }}
      # The journey needs Python 3.12; Windows names it python.
      PYTHON: ${{ matrix.system == 'windows' && 'python' || 'python3' }}
    steps:
      - name: Keep line endings as committed
        timeout-minutes: 1
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        timeout-minutes: 5
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
        timeout-minutes: 10
        with:
          workspaces: ". -> target"
          save-if: false
      - uses: actions/setup-node@v4
        timeout-minutes: 5
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        timeout-minutes: 5
        if: runner.os == 'Windows'
        with:
          python-version: "3.12"
      - name: Install zsh on Linux
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: sudo apt-get install -y --no-install-recommends zsh
      - name: Install the pinned agent CLIs
        timeout-minutes: 10
        run: '"$PYTHON" scripts/install-agent-clis.py claude codex grok opencode pi omp agy'
      - name: Build hided, hide, the hooks and Hide's conversation reader
        timeout-minutes: 25
        run: |
          bash scripts/verify-cargo.sh cli
          bash scripts/verify-cargo.sh build -p hide-session --example journey_conversation
          bash scripts/verify-cargo.sh build -p hide-memory --example journey_memory
      - name: Fetch the pinned Herdr runtime
        id: herdr
        timeout-minutes: 5
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then
            bin=$(pwsh -NoProfile -File scripts/fetch-herdr-runtime.ps1 | tr -d '\r')
          else
            bin=$(zsh scripts/fetch-herdr-runtime.sh --platform "$HERDR_PLATFORM")
          fi
          echo "bin=$bin" >> "$GITHUB_OUTPUT"
      - name: Build the controller's spawn provider
        timeout-minutes: 5
        # Before the run, as the stand-ins are: a Windows link can outlast the
        # run's 15-second command cap.
        id: controller
        run: |
          provider="$RUNNER_TEMP/journey-controller/claude"
          mkdir -p "${provider%/*}"
          if [[ "$RUNNER_OS" == Windows ]]; then
            provider+=.exe
            clang -O2 -o "$provider" web/e2e/shims/spawn-provider.c
          else
            cc -O2 -o "$provider" web/e2e/shims/spawn-provider.c
          fi
          echo "provider=$provider" >> "$GITHUB_OUTPUT"
      - name: The journey against the fake model
        timeout-minutes: 85
        run: |
          set +e
          "$PYTHON" scripts/agent-journey-check.py --mode ci --fake-model --agents grok \
            --controller-provider "${{ steps.controller.outputs.provider }}" \
            --herdr-bin "${{ steps.herdr.outputs.bin }}" --run-dir "$RUN_DIR"
          echo "journey exit $?"
      - name: The lane's verdict
        timeout-minutes: 2
        run: '"$PYTHON" scripts/agent-journey-lane.py "$RUN_DIR/report.json" --lane fake'
      - name: Keep the report
        timeout-minutes: 5
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: agent-journey-fake-${{ matrix.system }}
          path: |
            ${{ env.RUN_DIR }}/report.*
            ${{ env.RUN_DIR }}/*.json
            ${{ env.RUN_DIR }}/*.jsonl
            ${{ env.RUN_DIR }}/*.txt
            ${{ env.RUN_DIR }}/*.log
          if-no-files-found: warn

  login:
    name: agent journey signed in (${{ matrix.system }})
    if: ${{ inputs.live }}
    runs-on: ${{ fromJSON('{"linux":"ubuntu-latest","macos":"macos-15","windows":"windows-latest"}')[matrix.system] }}
    # Every agent whose key is set may run, each with a provider's cap
    # (cli.py), inside the journey step's 115; the job's cap is its steps'
    # caps summed.
    timeout-minutes: 200
    strategy:
      fail-fast: false
      matrix:
        system: ${{ fromJSON(inputs.systems) }}
    defaults:
      run:
        shell: bash
    env:
      HERDR_PLATFORM: ${{ fromJSON('{"linux":"linux-x86_64","macos":"macos-aarch64","windows":"windows-x86_64"}')[matrix.system] }}
      RUN_DIR: agents/runs/agent-journey-login-${{ matrix.system }}
      # The journey needs Python 3.12; Windows names it python.
      PYTHON: ${{ matrix.system == 'windows' && 'python' || 'python3' }}
      HAS_KEYS: ${{ secrets.HIDE_CLAUDE_API_KEY != '' || secrets.HIDE_CODEX_API_KEY != '' || secrets.HIDE_AGY_API_KEY != '' || secrets.HIDE_GROK_API_KEY != '' || secrets.HIDE_OPENCODE_API_KEY != '' || secrets.HIDE_PI_API_KEY != '' || secrets.HIDE_OMP_API_KEY != '' }}
    steps:
      - name: Not configured without the CI account's keys
        timeout-minutes: 1
        if: ${{ env.HAS_KEYS != 'true' }}
        run: echo "::notice title=agent journey signed in::not configured (no HIDE_CLAUDE_API_KEY, HIDE_CODEX_API_KEY, HIDE_AGY_API_KEY, HIDE_GROK_API_KEY, HIDE_OPENCODE_API_KEY, HIDE_PI_API_KEY or HIDE_OMP_API_KEY secret); the signed-in journey stays unproven"
      - name: Choose the agents this leg signs in
        timeout-minutes: 1
        # Each agent whose key is set, at its pinned version; agy only on the
        # systems its daily quota measures tonight.
        if: ${{ env.HAS_KEYS == 'true' }}
        id: agents
        env:
          HAS_CLAUDE: ${{ secrets.HIDE_CLAUDE_API_KEY != '' }}
          HAS_CODEX: ${{ secrets.HIDE_CODEX_API_KEY != '' }}
          HAS_AGY: ${{ secrets.HIDE_AGY_API_KEY != '' }}
          HAS_GROK: ${{ secrets.HIDE_GROK_API_KEY != '' }}
          HAS_OPENCODE: ${{ secrets.HIDE_OPENCODE_API_KEY != '' }}
          HAS_PI: ${{ secrets.HIDE_PI_API_KEY != '' }}
          HAS_OMP: ${{ secrets.HIDE_OMP_API_KEY != '' }}
          AGY_PLAN: ${{ inputs.agy }}
          SYSTEM: ${{ matrix.system }}
        run: |
          kinds=()
          for pair in claude:$HAS_CLAUDE codex:$HAS_CODEX grok:$HAS_GROK opencode:$HAS_OPENCODE pi:$HAS_PI omp:$HAS_OMP; do
            [[ "${pair#*:}" == true ]] && kinds+=("${pair%%:*}")
          done
          rotation=(linux macos windows)
          case "$AGY_PLAN" in
            rotation)
              agy_system=${rotation[$(( 10#$(date -u +%j) % ${#rotation[@]} ))]}
              why="the key's 20 requests a day measure it on $agy_system tonight (the rotation through linux, macos and windows; agy-contract.yml takes 4 a night)" ;;
            none) agy_system=""; why="this run does not spend the key's daily requests on agy" ;;
            *) agy_system=$AGY_PLAN
              why="this run measures it on $agy_system only, so the night's and this run's requests stay within the key's 20 a day" ;;
          esac
          agy=""
          if [[ "$HAS_AGY" == true && "$agy_system" == "$SYSTEM" ]]; then
            kinds+=(agy)
          elif [[ "$HAS_AGY" == true ]]; then
            agy=$why
          fi
          if (( ${#kinds[@]} == 0 )); then
            # Nothing to sign in here tonight, so the leg builds and starts nothing.
            echo "::notice title=agent journey signed in (${SYSTEM})::no agent to sign in on this leg: $agy"
          fi
          echo "kinds=${kinds[*]}" >> "$GITHUB_OUTPUT"
          echo "agy=$agy" >> "$GITHUB_OUTPUT"
      - name: Keep line endings as committed
        timeout-minutes: 1
        if: ${{ steps.agents.outputs.kinds != '' && runner.os == 'Windows' }}
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        timeout-minutes: 5
        if: ${{ steps.agents.outputs.kinds != '' }}
        with:
          # The keyed steps never need the repository token.
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
        timeout-minutes: 10
        if: ${{ steps.agents.outputs.kinds != '' }}
        with:
          workspaces: ". -> target"
          save-if: false
      - uses: actions/setup-node@v4
        timeout-minutes: 5
        if: ${{ steps.agents.outputs.kinds != '' }}
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        timeout-minutes: 5
        if: ${{ steps.agents.outputs.kinds != '' && runner.os == 'Windows' }}
        with:
          python-version: "3.12"
      - name: Install zsh on Linux
        timeout-minutes: 5
        if: ${{ steps.agents.outputs.kinds != '' && runner.os == 'Linux' }}
        run: sudo apt-get install -y --no-install-recommends zsh
      - name: Install the pinned agent CLIs
        # contracts/agent-clis.json, so a night measures the versions the
        # adapters were verified against; the step and the report name the
        # version each answered with, so a red night says which CLI changed.
        if: ${{ steps.agents.outputs.kinds != '' }}
        timeout-minutes: 10
        run: '"$PYTHON" scripts/install-agent-clis.py ${{ steps.agents.outputs.kinds }}'
      - name: Build hided, hide, the hooks and Hide's conversation reader
        if: ${{ steps.agents.outputs.kinds != '' }}
        timeout-minutes: 25
        run: |
          bash scripts/verify-cargo.sh cli
          bash scripts/verify-cargo.sh build -p hide-session --example journey_conversation
          bash scripts/verify-cargo.sh build -p hide-memory --example journey_memory
      - name: Fetch the pinned Herdr runtime
        if: ${{ steps.agents.outputs.kinds != '' }}
        id: herdr
        timeout-minutes: 5
        # Assigned first, so a failed fetch fails this step rather than
        # handing the next one an empty path.
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then
            bin=$(pwsh -NoProfile -File scripts/fetch-herdr-runtime.ps1 | tr -d '\r')
          else
            bin=$(zsh scripts/fetch-herdr-runtime.sh --platform "$HERDR_PLATFORM")
          fi
          echo "bin=$bin" >> "$GITHUB_OUTPUT"
      - name: Build the controller's spawn provider
        timeout-minutes: 5
        # Before the run, as the stand-ins are: a Windows link can outlast the
        # run's 15-second command cap.
        if: ${{ steps.agents.outputs.kinds != '' }}
        id: controller
        run: |
          provider="$RUNNER_TEMP/journey-controller/claude"
          mkdir -p "${provider%/*}"
          if [[ "$RUNNER_OS" == Windows ]]; then
            provider+=.exe
            clang -O2 -o "$provider" web/e2e/shims/spawn-provider.c
          else
            cc -O2 -o "$provider" web/e2e/shims/spawn-provider.c
          fi
          echo "provider=$provider" >> "$GITHUB_OUTPUT"
      - name: The journey, signed in with the CI keys
        # The keys reach only this step; the journey keeps each one under the
        # run's probe, which its cleanup removes, and the report names them only.
        if: ${{ steps.agents.outputs.kinds != '' }}
        timeout-minutes: 115
        env:
          HIDE_CLAUDE_API_KEY: ${{ secrets.HIDE_CLAUDE_API_KEY }}
          HIDE_CODEX_API_KEY: ${{ secrets.HIDE_CODEX_API_KEY }}
          HIDE_AGY_API_KEY: ${{ secrets.HIDE_AGY_API_KEY }}
          HIDE_GROK_API_KEY: ${{ secrets.HIDE_GROK_API_KEY }}
          HIDE_OPENCODE_API_KEY: ${{ secrets.HIDE_OPENCODE_API_KEY }}
          HIDE_PI_API_KEY: ${{ secrets.HIDE_PI_API_KEY }}
          HIDE_OMP_API_KEY: ${{ secrets.HIDE_OMP_API_KEY }}
          AGY_UNMEASURED: ${{ steps.agents.outputs.agy }}
        run: |
          set +e
          # The model agy-contract.yml signs agy in with, so both spend one quota.
          args=(--model antigravity=gemini-3.8-flash-medium)
          [[ -n "$AGY_UNMEASURED" ]] && args+=(--unmeasured "antigravity=$AGY_UNMEASURED")
          "$PYTHON" scripts/agent-journey-check.py --mode ci "${args[@]}" \
            --controller-provider "${{ steps.controller.outputs.provider }}" \
            --herdr-bin "${{ steps.herdr.outputs.bin }}" --run-dir "$RUN_DIR"
          echo "journey exit $?"
      - name: The lane's verdict
        timeout-minutes: 2
        if: ${{ steps.agents.outputs.kinds != '' }}
        run: '"$PYTHON" scripts/agent-journey-lane.py "$RUN_DIR/report.json" --lane login'
      - name: Keep the report
        timeout-minutes: 5
        if: ${{ steps.agents.outputs.kinds != '' && !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: agent-journey-login-${{ matrix.system }}
          path: |
            ${{ env.RUN_DIR }}/report.*
            ${{ env.RUN_DIR }}/*.json
            ${{ env.RUN_DIR }}/*.txt
            ${{ env.RUN_DIR }}/*.log
          if-no-files-found: warn
