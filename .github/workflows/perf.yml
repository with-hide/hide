name: Release profile measurement (temporary branch only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  measure:
    name: profile (${{ matrix.os }}, repeat ${{ matrix.repeat }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        os: [ubuntu-latest, windows-latest]
        repeat: [1, 2, 3]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          path: harness
      - uses: actions/checkout@v7
        with:
          ref: 4164c701ca4a2b785a7f1fffe59f225f1846c6c2
          path: source
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install psutil==7.2.2
      - name: Build the pinned source web assets
        working-directory: source
        run: |
          bash scripts/verify-web.sh install
          bash scripts/verify-web.sh web build
      - name: Observe Defender configuration
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force results | Out-Null
          Get-MpComputerStatus | Select-Object AntivirusEnabled,RealTimeProtectionEnabled,AntivirusSignatureVersion | ConvertTo-Json | Out-File results/defender-status.json
      - name: Measure three clean release profiles
        env:
          REPEAT: ${{ matrix.repeat }}
        run: |
          cd source
          source scripts/toolchain-env.sh
          rustc --version
          cargo --version
          python ../harness/scripts/profile-measure.py --source . --output ../results --repeat "$REPEAT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: profile-${{ matrix.os }}-${{ matrix.repeat }}-attempt-${{ github.run_attempt }}
          path: results
          retention-days: 7
