# The daily agent canary (docs/VERIFICATION.md, The agent canary): each agent
# CLI's latest release, read where its own installer reads it
# (scripts/agent-cli-latest.py), measured by the agent journey on the fake
# model on every system, with no key. Every other lane measures the pins in
# contracts/agent-clis.json, so a vendor release that breaks Hide is seen
# here before an operator who updated meets it, and no pull request is opened
# for a release that changes nothing.
#
# A day on which no version moved since the record's last run starts no
# journey. An agent whose latest release misses a cell is measured again at
# its pin on the same commit (`reruns`, `pinned`), so a break of Hide's own
# is not filed against the releases that met it (with-hide/hide-private#358:
# #1816's Memory aging failed `guidance_memory` for every agent, and five
# releases were blamed). The `record` job keeps one issue, "Agent CLI support
# record", with each agent's latest version checked and the last one that
# passed; it opens an issue for an agent whose latest release misses what its
# pin does not, comments on it when a later release still fails, and closes it
# when one passes, and keeps one issue against Hide for what the pins miss too
# (scripts/agent-canary-record.py). These issues live in
# with-hide/hide-private with the development issues, read and written with
# that App's token (docs/TESTING.md). A fix moves the pin in its own pull
# request, whose CI proves it on that version.
name: agent canary

on:
  schedule:
    # With the nightly (nightly.yml, 17:17 UTC, 02:17 in Korea), so its
    # journeys use the runners while no pull request does. It stays its own
    # workflow: the nightly's report job would file each failing agent again
    # as a nightly-failure issue beside the agent's own.
    - cron: "17 17 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Measure even when no version moved since the record's last run.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: agent-canary
  cancel-in-progress: false

jobs:
  latest:
    name: latest releases
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      table: ${{ steps.latest.outputs.table }}
      versions: ${{ steps.latest.outputs.versions }}
      changed: ${{ steps.decide.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 5
        with:
          persist-credentials: false
      - name: Read each agent CLI's latest release
        id: latest
        timeout-minutes: 3
        run: |
          versions=$(python3 scripts/agent-cli-latest.py "$RUNNER_TEMP/agent-clis.json")
          echo "::notice title=agent canary::latest releases $versions"
          echo "versions=$versions" >> "$GITHUB_OUTPUT"
          {
            echo 'table<<TABLE_END'
            cat "$RUNNER_TEMP/agent-clis.json"
            echo 'TABLE_END'
          } >> "$GITHUB_OUTPUT"
      - name: Mint the development issues token
        id: issues-token
        if: ${{ inputs.force != true }}
        timeout-minutes: 2
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.HIDE_ISSUES_APP_CLIENT_ID }}
          private-key: ${{ secrets.HIDE_ISSUES_APP_KEY }}
          owner: with-hide
          repositories: hide-private
      - name: Whether a version moved since the record's last run
        id: decide
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ steps.issues-token.outputs.token }}
          FORCE: ${{ inputs.force == true }}
          VERSIONS: ${{ steps.latest.outputs.versions }}
        run: |
          if [[ "$FORCE" == true ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s\n' "$VERSIONS" > "$RUNNER_TEMP/versions.json"
          python3 scripts/agent-canary-record.py decide --versions "$RUNNER_TEMP/versions.json" >> "$GITHUB_OUTPUT"

  journey:
    name: agent journey
    needs: latest
    if: ${{ needs.latest.outputs.changed == 'true' }}
    uses: ./.github/workflows/agent-journey.yml
    permissions:
      contents: read
    with:
      # The pinned rerun measures this same commit.
      source-sha: ${{ github.sha }}
      systems: '["linux","macos","windows"]'
      fake: true
      stand-ins: false
      clis-table: ${{ needs.latest.outputs.table }}

  reruns:
    name: agents to measure at their pins
    needs: [latest, journey]
    if: ${{ always() && needs.latest.result == 'success' && (needs.journey.result == 'success' || needs.journey.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      agents: ${{ steps.reruns.outputs.agents }}
      systems: ${{ steps.reruns.outputs.systems }}
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        timeout-minutes: 3
        with:
          pattern: agent-journey-fake-*
          path: ${{ runner.temp }}/reports
      - name: Each agent whose latest release missed a cell, unless that release is its pin
        id: reruns
        timeout-minutes: 2
        env:
          VERSIONS: ${{ needs.latest.outputs.versions }}
        run: |
          set -o pipefail
          printf '%s\n' "$VERSIONS" > "$RUNNER_TEMP/versions.json"
          python3 scripts/agent-canary-record.py reruns --versions "$RUNNER_TEMP/versions.json" \
            --reports "$RUNNER_TEMP/reports" | tee -a "$GITHUB_OUTPUT"

  pinned:
    name: agent journey at the pins
    needs: reruns
    if: ${{ needs.reruns.outputs.agents != '' }}
    uses: ./.github/workflows/agent-journey.yml
    permissions:
      contents: read
    with:
      source-sha: ${{ github.sha }}
      systems: ${{ needs.reruns.outputs.systems }}
      fake: true
      stand-ins: false
      agents: ${{ needs.reruns.outputs.agents }}
      report-name: agent-journey-pinned

  record:
    name: support record
    needs: [latest, journey, reruns, pinned]
    # A failed journey is what the record is for; a skipped one measured
    # nothing, and a cancelled one is no verdict. A failed or skipped pinned
    # rerun leaves the misses it was to judge `unknown`, blaming no one.
    if: ${{ always() && needs.latest.result == 'success' && (needs.journey.result == 'success' || needs.journey.result == 'failure') && needs.pinned.result != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        timeout-minutes: 3
        with:
          # The latest releases' reports and the pinned rerun's.
          pattern: agent-journey-*
          path: ${{ runner.temp }}/reports
      - name: Mint the development issues token
        id: issues-token
        timeout-minutes: 2
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.HIDE_ISSUES_APP_CLIENT_ID }}
          private-key: ${{ secrets.HIDE_ISSUES_APP_KEY }}
          owner: with-hide
          repositories: hide-private
      - name: Rewrite the support record and each failing agent's issue
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ steps.issues-token.outputs.token }}
          VERSIONS: ${{ needs.latest.outputs.versions }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          printf '%s\n' "$VERSIONS" > "$RUNNER_TEMP/versions.json"
          python3 scripts/agent-canary-record.py record --versions "$RUNNER_TEMP/versions.json" \
            --reports "$RUNNER_TEMP/reports" --run-url "$RUN_URL" --commit "$GITHUB_SHA"
