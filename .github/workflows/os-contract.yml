# What differs between operating systems, checked on the systems that differ.
#
# `hide-platform` holds the code whose behaviour depends on the OS (today the
# local stream, a Unix socket or a Windows named pipe); its tests under
# `hide-platform/tests/` state each contract as what a caller observes and run
# unchanged on every system. The crates are small, so this lane builds in
# minutes and does not wait for the workspace. The caller names the systems:
# `pr.yml` runs Linux and Windows for a change to anything that differs by
# system, and macOS, whose runners are the scarce ones, in a pull request only
# for a change to these two crates that is also a macOS path
# (`os-contract-macos`; `scripts/ci-plan.py`, MACOS_CODE); main's push run and
# the nightly's call of `pr.yml` plan every lane, so they run all three.
name: os contract

on:
  workflow_call:
    inputs:
      systems:
        description: The systems to run, as a JSON array of `linux`, `macos` and `windows`.
        type: string
        required: true
    # The development issues App's key (docs/TESTING.md, Flaky tests). A run
    # without it, such as a fork's, files no issue and passes as before.
    secrets:
      HIDE_ISSUES_APP_KEY:
        required: false

permissions:
  contents: read

jobs:
  contract:
    name: os contract (${{ matrix.system }})
    runs-on: ${{ fromJSON('{"linux":"ubuntu-latest","macos":"macos-15","windows":"windows-latest"}')[matrix.system] }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        system: ${{ fromJSON(inputs.systems) }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      # hide-platform alone, outside the shared feature set, is a dependency
      # set of its own, which only this lane builds.
      - uses: ./.github/actions/rust-cache
        with:
          set: platform
          save: ${{ github.ref == 'refs/heads/main' }}
      - name: Install cargo-nextest
        # The Rust tests run under nextest's `ci` profile (one retry).
        timeout-minutes: 3
        run: bash scripts/install-nextest.sh
      - name: Contract tests
        # Usually a minute or two; a contract test that hangs fails here
        # rather than holding the runner until the job's timeout.
        timeout-minutes: 10
        run: bash scripts/verify-cargo.sh nextest --profile ci -p hide-platform
      - name: A login agent on the runner's real launchd
        # hide-platform/tests/it/user_agents.rs (PRD core-host-node-move
        # D-16, B3): the core machine's login item, installed, killed, exited
        # and removed, and the one-shot job a move's checks run in, on this
        # disposable runner's own GUI session, which no other machine's test
        # may reach.
        if: matrix.system == 'macos'
        timeout-minutes: 5
        run: bash scripts/verify-cargo.sh nextest --profile ci -p hide-platform --test it -E 'test(/^user_agents::(a_login_agent_restarts|a_one_shot_job_runs_once)/)' --run-ignored only --no-capture
      - name: Lint the platform crate
        run: bash scripts/verify-cargo.sh clippy -p hide-platform --all-targets -- -D warnings
      - name: Mint the development issues token
        # Development issues live in with-hide/hide-private (docs/TESTING.md,
        # Flaky tests); one App token reads this run here and files there. A run
        # without the App's key, such as a fork's, files nothing and stays green.
        id: issues-token
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.HIDE_ISSUES_APP_CLIENT_ID }}
          private-key: ${{ secrets.HIDE_ISSUES_APP_KEY }}
          owner: with-hide
          repositories: hide,hide-private
      - name: Report flaky and failed tests
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ steps.issues-token.outputs.token }}
        run: python3 scripts/ci-flaky-report.py --suite rust --junit target/nextest/ci/junit*.xml
