# What differs between operating systems, checked on the systems that differ.
#
# `hide-platform` holds the code whose behaviour depends on the OS (today the
# local stream, a Unix socket or a Windows named pipe); its tests under
# `hide-platform/tests/` state each contract as what a caller observes and run
# unchanged on every system. Each leg then runs `hide-herdr-client` against the
# pinned Herdr for that system, the one place the pinned Windows asset runs.
# The crates are small, so this lane builds in minutes and does not wait for
# the workspace. The caller names the systems: `pr.yml` runs Linux and Windows
# for a change to anything that differs by system and macOS, whose runners are
# the scarce ones, only for a change to these two crates (`os-contract-macos`);
# the nightly's call of `pr.yml` plans every lane, so it runs all three.
name: os contract

on:
  workflow_call:
    inputs:
      systems:
        description: The systems to run, as a JSON array of `linux`, `macos` and `windows`.
        type: string
        required: true

# `issues: write` files a flaky test; a caller must grant it.
permissions:
  contents: read
  issues: write

jobs:
  contract:
    name: os contract (${{ matrix.system }})
    runs-on: ${{ fromJSON('{"linux":"ubuntu-latest","macos":"macos-15","windows":"windows-latest"}')[matrix.system] }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        system: ${{ fromJSON(inputs.systems) }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      # hide-platform and hide-herdr-client alone, outside the shared feature
      # set, are a dependency set of their own, which only this lane builds.
      - uses: ./.github/actions/rust-cache
        with:
          set: platform
          save: ${{ github.ref == 'refs/heads/main' }}
      - name: Install cargo-nextest
        # The Rust tests run under nextest's `ci` profile (one retry).
        timeout-minutes: 3
        run: bash scripts/install-nextest.sh
      - name: Contract tests and the client's own tests
        # Usually a minute or two; a contract test that hangs fails here
        # rather than holding the runner until the job's timeout.
        timeout-minutes: 10
        run: bash scripts/verify-cargo.sh nextest --profile ci -p hide-platform -p hide-herdr-client
      - name: A login agent on the runner's real launchd
        # hide-platform/tests/it/user_agents.rs (PRD core-host-node-move
        # D-16, B3): the core machine's login item, installed, killed, exited
        # and removed, and the one-shot job a move's checks run in, on this
        # disposable runner's own GUI session, which no other machine's test
        # may reach.
        if: matrix.system == 'macos'
        timeout-minutes: 5
        run: bash scripts/verify-cargo.sh nextest --profile ci -p hide-platform --test it -E 'test(/^user_agents::(a_login_agent_restarts|a_one_shot_job_runs_once)/)' --run-ignored only --no-capture
      - name: Lint the platform crates
        run: bash scripts/verify-cargo.sh clippy -p hide-platform -p hide-herdr-client --all-targets -- -D warnings
      - name: Install zsh for the Herdr fetch
        if: matrix.system == 'linux'
        run: sudo apt-get install -y --no-install-recommends zsh
      - name: Fetch the pinned Herdr runtime
        id: herdr
        # The manifest is the pin; both scripts verify the download against
        # its digest before the binary answers anything.
        run: |
          case "${{ matrix.system }}" in
            linux) bin=$(zsh scripts/fetch-herdr-runtime.sh --platform linux-x86_64) ;;
            macos) bin=$(zsh scripts/fetch-herdr-runtime.sh --platform macos-aarch64) ;;
            windows) bin=$(pwsh -NoProfile -File scripts/fetch-herdr-runtime.ps1 | tr -d '\r') ;;
            *) echo "unknown system: ${{ matrix.system }}" >&2; exit 1 ;;
          esac
          echo "bin=$bin" >> "$GITHUB_OUTPUT"
      - name: Compare the binary schema and version with the pin
        run: python3 scripts/check-herdr-schema.py --herdr-bin "${{ steps.herdr.outputs.bin }}"
      - name: The client against the pinned Herdr
        timeout-minutes: 10
        env:
          HIDE_E2E_HERDR_BIN: ${{ steps.herdr.outputs.bin }}
        run: bash scripts/verify-cargo.sh nextest --profile ci -p hide-herdr-client --test it --run-ignored only --no-capture
      - name: Report flaky and failed tests
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci-flaky-report.py --suite rust --junit target/nextest/ci/junit*.xml
