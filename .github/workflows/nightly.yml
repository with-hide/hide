# Temporary mission verification; reverted before delivery.
name: shell draw repetition
on:
  workflow_dispatch:
    inputs:
      lane:
        type: choice
        options: [all]
        default: all
permissions:
  contents: read
jobs:
  web:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {lane: shell-draw-linux, runner: ubuntu-24.04}
          - {lane: shell-draw-macos, runner: macos-15}
          - {lane: shell-draw-windows, runner: windows-latest}
    uses: ./.github/workflows/web-e2e.yml
    secrets:
      HIDE_ISSUES_APP_KEY: ${{ secrets.HIDE_ISSUES_APP_KEY }}
    with:
      lane: ${{ matrix.lane }}
      runner: ${{ matrix.runner }}
      shards: 1
      grep: "a checkout's pull request:|expand takes the whole body|a right-click focuses its pane|Overview restores its exact current session|test browser startup preserves defaults"
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {lane: shell-draw-macos, runner: macos-15}
          - {lane: shell-draw-windows, runner: windows-latest}
    uses: ./.github/workflows/desktop-e2e.yml
    secrets:
      HIDE_ISSUES_APP_KEY: ${{ secrets.HIDE_ISSUES_APP_KEY }}
    with:
      lane: ${{ matrix.lane }}
      runner: ${{ matrix.runner }}
      shards: 1
      grep: "failure: a missing CLI|lifetime: a second launch"
      keep-screenshots: true
