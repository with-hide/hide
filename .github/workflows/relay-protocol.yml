name: relay protocol
on:
  workflow_call:
    inputs:
      include-macos:
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  contract:
    name: relay protocol (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: ${{ inputs.include-macos && fromJSON('["ubuntu-latest","windows-latest","macos-15"]') || fromJSON('["ubuntu-latest","windows-latest"]') }}
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - name: Native and WASM vectors and TypeScript cross-decryption
        timeout-minutes: 15
        run: bash scripts/check-relay-protocol.sh
      - name: TypeScript API types
        run: |
          bash scripts/verify-web.sh install --ignore-scripts
          bash scripts/verify-web.sh relay-protocol typecheck
