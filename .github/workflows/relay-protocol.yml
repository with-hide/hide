name: relay protocol
on:
  workflow_call:
    inputs:
      include-macos:
        type: boolean
        default: true
    secrets:
      HIDE_ISSUES_APP_KEY:
        required: false
permissions:
  contents: read
jobs:
  contract:
    name: relay protocol (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: ${{ inputs.include-macos && fromJSON('["ubuntu-latest","windows-latest","macos-15"]') || fromJSON('["ubuntu-latest","windows-latest"]') }}
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust-cache
        with:
          set: workspace
          save: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      # The relay WebAssembly's binding tool, restored never saved here (`.github/actions/relay-tools`).
      - uses: ./.github/actions/relay-tools
        with:
          save: false
      - name: Native and WASM vectors and TypeScript cross-decryption
        timeout-minutes: 15
        run: bash scripts/check-relay-protocol.sh
      - name: TypeScript API types
        run: |
          bash scripts/verify-web.sh install --ignore-scripts
          bash scripts/verify-web.sh relay-protocol typecheck
      - name: Install cargo-nextest
        run: bash scripts/install-nextest.sh
      - name: Real relay sockets, caps and endpoint integrity
        run: |
          bash scripts/verify-cargo.sh nextest --profile ci -p hide-relay
          bash scripts/verify-cargo.sh clippy -p hide-relay --all-targets -- -D warnings
      - name: Mint the development issues token
        id: issues-token
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.HIDE_ISSUES_APP_CLIENT_ID }}
          private-key: ${{ secrets.HIDE_ISSUES_APP_KEY }}
          owner: with-hide
          repositories: hide,hide-private
      - name: Report flaky and failed tests
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ steps.issues-token.outputs.token }}
        run: python3 scripts/ci-flaky-report.py --suite rust --junit target/nextest/ci/junit*.xml
