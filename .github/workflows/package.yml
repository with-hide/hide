# The unsigned Windows x64 installer and Linux x64 deb and rpm (operator
# decision 2026-10-03, PRD auto-update D-07), each built on its own runner by
# `bash scripts/verify-web.sh desktop package` with the update files and
# blockmaps beside them, and each installed and started there (D-32), because
# no machine of either system is at hand to try a package on: the Windows
# installer installs for the user, survives a reinstall while a Herdr server
# runs from the build's runtime copy and uninstalls
# (`desktop/scripts/smoke-windows-installer.mjs`); the deb installs on Ubuntu
# and the rpm in a Fedora container; each installed app then starts without a
# window (`desktop/scripts/smoke-package.mjs`). The installed Windows app is
# then opened with its window (`desktop/e2e/packaged-window.spec.ts`), and the
# shell it draws is kept. Last, on both systems, a release-numbered build of
# the same package is installed and updates itself to the next number from a
# local feed through Help's Restart (`desktop/e2e/packaged-update.spec.ts`).
#
# A release calls this workflow and attaches what it uploads, and the nightly
# calls it on main. A pull request runs it as `pr.yml`'s `package` lane, which
# `scripts/ci-plan.py` plans only for a change to what goes into a package
# (PACKAGE_PATHS, the one list of those paths); a cold release build of the
# workspace takes several times the `windows check` job, and a pull request
# that touches none of those paths changes no package that `verify`'s other
# lanes would not already catch (the workspace compiling and `hide connect`
# starting its daemon on Windows).
#
# `include-macos` adds the macOS dmg and zip and runs the packaged app's own
# specs on the app the zip holds, which is what the updater installs: the
# signed bundle with its own host, daemon and Herdr, which no other lane
# starts; the dmg is mounted and its app's signature checked. A release asks
# for `macos-signing: developer-id`, so what it ships is what those specs
# started: signed with the Developer ID certificate and notarized, dmg
# included, with the secrets of the `release` environment, which only a `v*`
# tag can use (docs/BUILD.md). Pull requests and the nightly keep the ad-hoc
# signature and reach no secret.
name: package

on:
  workflow_call:
    inputs:
      version:
        description: The version the packages report, a release tag with or without its v
        type: string
        required: true
      source-sha:
        description: Explicit public source commit, or the caller commit when omitted.
        type: string
        default: ''
      build-order:
        description: Explicit positive build order, or main history order when omitted.
        type: string
        default: ''
      include-macos:
        description: Also build the macOS dmg and zip and test their packaged app.
        type: boolean
        required: false
        default: false
      macos-signing:
        description: How the macOS app is signed, adhoc or developer-id (HIDE_MACOS_SIGNING; a release only).
        type: string
        required: false
        default: adhoc
    # The `release` environment's signing secrets. A called workflow sees an
    # environment secret only when its caller passes it by name, even though
    # the job below names the environment; one not passed reaches the job as an
    # empty string, without an error. Only release.yml passes them; pull
    # requests and the nightly sign ad-hoc and pass none.
    secrets:
      MACOS_DEVELOPER_ID_P12:
        required: false
      MACOS_DEVELOPER_ID_P12_PASSWORD:
        required: false
      APPLE_NOTARY_KEY_P8:
        required: false
      APPLE_NOTARY_KEY_ID:
        required: false
      APPLE_NOTARY_ISSUER_ID:
        required: false

permissions:
  contents: read

jobs:
  package:
    name: package (${{ matrix.system }})
    runs-on: ${{ matrix.runner }}
    # Nothing is cached: release artifacts share nothing with the debug
    # caches main keeps, so every run is a cold release build.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: windows
            runner: windows-latest
          - system: linux
            runner: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source-sha || github.sha }}
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install zsh for the Herdr fetch, rpmbuild for the rpm and a display for the update test
        if: matrix.system == 'linux'
        run: sudo apt-get install -y --no-install-recommends zsh rpm xvfb
      - name: Name the version
        env:
          REQUESTED: ${{ inputs.version }}
          REQUESTED_ORDER: ${{ inputs.build-order }}
        run: |
          version="${REQUESTED#v}"
          echo "HIDE_VERSION=$version" >> "$GITHUB_ENV"
          # A build's order is its place in main's history
          # (desktop/scripts/package.mjs), which a shallow checkout cannot
          # count: a version no release uses is never ordered against another
          # build, and a release fetches main's history.
          if [ -n "$REQUESTED_ORDER" ]; then
            node -e 'const n = process.env.REQUESTED_ORDER; if (!/^[1-9][0-9]*$/.test(n) || !Number.isSafeInteger(Number(n))) throw new Error("build-order must be a positive safe decimal integer")'
            echo "HIDE_BUILD_ORDER=$REQUESTED_ORDER" >> "$GITHUB_ENV"
          else
            case "$version" in
              0.0.0-*) echo "HIDE_BUILD_ORDER=0" >> "$GITHUB_ENV" ;;
              *) git fetch --quiet --unshallow origin +refs/heads/main:refs/remotes/origin/main ;;
            esac
          fi
      - run: bash scripts/verify-web.sh install
      - name: Package the unsigned app, its installers and update files
        # The packager builds the web shell and the release binaries,
        # fetches the pinned Herdr and refuses when any of them cannot run;
        # electron-builder then wraps the app in desktop/out/release.
        timeout-minutes: 50
        run: bash scripts/verify-web.sh desktop package | tee "$RUNNER_TEMP/package.out"
      - name: Check each installer against its checksum
        working-directory: desktop/out/release
        run: for checksum in *.sha256; do sha256sum -c "$checksum"; done
      - name: Install, install again while Herdr runs, and uninstall
        if: matrix.system == 'windows'
        timeout-minutes: 15
        run: node desktop/scripts/smoke-windows-installer.mjs "desktop/out/release/hide-v${HIDE_VERSION}-windows-x64-setup.exe"
      - name: Install the package
        id: installed
        timeout-minutes: 10
        run: |
          if [ "${{ matrix.system }}" = windows ]; then
            # Git Bash would rewrite /S into a path.
            MSYS_NO_PATHCONV=1 "desktop/out/release/hide-v${HIDE_VERSION}-windows-x64-setup.exe" /S
            app="$(cygpath -m "$LOCALAPPDATA")/Programs/hide"
          else
            sudo apt-get install -y "./desktop/out/release/hide-v${HIDE_VERSION}-linux-x64.deb"
            app=/opt/hide
            # Every account can reach the app; a new terminal's `hide` is the CLI, the app menu has the window, and no sandbox step was asked of anyone.
            [ "$(stat -c %a /opt/hide)" = 755 ] || { echo "::error::/opt/hide is $(stat -c %a /opt/hide), not 755"; exit 1; }
            cli="$(command -v hide || true)"
            [ -n "$cli" ] && [ "$(readlink -f "$cli")" = /opt/hide/resources/hide ] || { echo "::error::a new terminal's hide is '$cli', not the CLI"; ls -l /usr/bin/hide /etc/alternatives/hide || true; exit 1; }
            grep -qx 'Exec=/opt/hide/hide %U' /usr/share/applications/hide.desktop || { echo "::error::the menu entry does not open /opt/hide/hide"; dpkg -L hide | grep -v '^/opt/hide/' || true; cat /usr/share/applications/hide.desktop || true; exit 1; }
            stat -c '%a %U' /opt/hide/chrome-sandbox
          fi
          test -x "$app/resources/hide${{ matrix.system == 'windows' && '.exe' || '' }}"
          echo "app=$app" >> "$GITHUB_OUTPUT"
      - name: Start the installed package without a window
        timeout-minutes: 5
        run: node desktop/scripts/smoke-package.mjs "${{ steps.installed.outputs.app }}"
      - name: Install the rpm in Fedora and start it without a window
        if: matrix.system == 'linux'
        timeout-minutes: 15
        run: |
          docker run --rm -v "$PWD:/w" -w /w fedora:42 bash -euo pipefail -c '
            dnf install -y --setopt=install_weak_deps=False nodejs util-linux shadow-utils "/w/desktop/out/release/hide-v'"$HIDE_VERSION"'-linux-x64.rpm"
            [ "$(stat -c %a /opt/hide)" = 755 ] || { echo "::error::/opt/hide is $(stat -c %a /opt/hide), not 755"; exit 1; }
            test -f /usr/share/applications/hide.desktop
            # The image ships an empty machine id, which systemd writes on a real
            # system at first boot and hided refuses to run without.
            [ -s /etc/machine-id ] || tr -d - </proc/sys/kernel/random/uuid >/etc/machine-id
            # What an ordinary account sees, not root: the container runs as root.
            useradd -m person
            runuser -u person -- bash -euo pipefail -s <<"CHECK"
            cli="$(command -v hide || true)"
            [ -n "$cli" ] && [ "$(readlink -f "$cli")" = /opt/hide/resources/hide ] || { echo "::error::hide in a new terminal is [$cli], not the CLI"; exit 1; }
            node desktop/scripts/smoke-package.mjs /opt/hide
          CHECK
          '
      - name: Name the installed package's binaries for the window and update fixtures
        run: |
          # The fixture's own `hide status` and `hide stop` read target/debug;
          # these are the package's binaries, so no workspace is built twice.
          mkdir -p target/debug
          exe="${{ matrix.system == 'windows' && '.exe' || '' }}"
          cp "${{ steps.installed.outputs.app }}/resources/hide$exe" "${{ steps.installed.outputs.app }}/resources/hided$exe" target/debug/
      - name: The packaged app's window
        # The installed hide.exe with its window, against a private HOME, state
        # and Herdr (desktop/e2e/packaged-window.spec.ts); the shell it draws
        # is kept below.
        id: window
        if: matrix.system == 'windows'
        timeout-minutes: 10
        env:
          HIDE_E2E_PACKAGED_APP: ${{ steps.installed.outputs.app }}/hide.exe
          HIDE_E2E_HERDR_BIN: ${{ steps.installed.outputs.app }}/resources/herdr.exe
          HIDE_E2E_SCREENSHOT_DIR: ${{ runner.temp }}/hide-e2e
        run: |
          mkdir -p "$HIDE_E2E_SCREENSHOT_DIR"
          bash scripts/verify-web.sh desktop e2e packaged-window.spec.ts status-page.spec.ts
      - name: Build two release versions of the same app for the update test
        # N is installed, N+1 is served from a local feed (PRD auto-update
        # D-29); both are the package above with another version, so the
        # update changes nothing but the version.
        timeout-minutes: 15
        run: |
          bundle="$(sed -n 's/^bundle=//p' "$RUNNER_TEMP/package.out")"
          test -d "$bundle"
          node desktop/scripts/installers.mjs "$bundle" 0.0.1 "$RUNNER_TEMP/update-n"
          node desktop/scripts/installers.mjs "$bundle" 0.0.2 "$RUNNER_TEMP/update-next"
          if [ "${{ matrix.system }}" = windows ]; then
            MSYS_NO_PATHCONV=1 "$RUNNER_TEMP/update-n/hide-v0.0.1-windows-x64-setup.exe" /S
          else
            sudo apt-get install -y --allow-downgrades "$RUNNER_TEMP/update-n/hide-v0.0.1-linux-x64.deb"
          fi
      - name: Update the installed app to the next version
        # The installed N finds N+1, downloads it, and Restart in the Help
        # menu installs it while the Herdr server and the daemon keep running
        # (desktop/e2e/packaged-update.spec.ts).
        id: update
        timeout-minutes: 15
        env:
          HIDE_E2E_UPDATE_APP: ${{ steps.installed.outputs.app }}/hide${{ matrix.system == 'windows' && '.exe' || '' }}
          HIDE_E2E_UPDATE_FEED: ${{ runner.temp }}/update-next
          HIDE_E2E_UPDATE_VERSION: 0.0.2
          HIDE_E2E_HERDR_BIN: ${{ steps.installed.outputs.app }}/resources/herdr${{ matrix.system == 'windows' && '.exe' || '' }}
          HIDE_E2E_SCREENSHOT_DIR: ${{ runner.temp }}/hide-e2e
        run: |
          mkdir -p "$HIDE_E2E_SCREENSHOT_DIR"
          if [ "${{ matrix.system }}" = windows ]; then
            # The installer stops every program under the install folder, and
            # the app runs its Herdr server from the build's runtime copy, so
            # the test's server runs from the packaged folder, not the install.
            HIDE_E2E_HERDR_BIN="$(sed -n 's/^bundle=//p' "$RUNNER_TEMP/package.out")/resources/herdr.exe"
            export HIDE_E2E_HERDR_BIN
            test -f "$HIDE_E2E_HERDR_BIN"
            bash scripts/verify-web.sh desktop e2e packaged-update.spec.ts
          else
            xvfb-run -a bash scripts/verify-web.sh desktop e2e packaged-update.spec.ts
          fi
      - name: Report flaky and failed window tests
        # See the macOS job below: this workflow has no `issues: write`.
        id: flaky
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci-flaky-report.py --suite desktop --playwright desktop/e2e-report.json
      - name: Keep the packaged window
        if: ${{ matrix.system == 'windows' && steps.window.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: hide-package-window-windows
          path: ${{ runner.temp }}/hide-e2e/*.png
          if-no-files-found: error
      - name: Keep the failed window run
        if: ${{ failure() || steps.flaky.outputs.flaky == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: hide-package-window-logs-${{ matrix.system }}
          path: |
            ${{ runner.temp }}/hide-e2e
            desktop/test-results
          if-no-files-found: ignore
      - name: Keep the package
        # Exactly the system's release files (installers.mjs leaves nothing else there); kept
        # from a failed run too, so a package that did not install can be looked at.
        if: ${{ !cancelled() && hashFiles('desktop/out/release/*') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: hide-package-${{ matrix.system }}
          path: desktop/out/release/*
          if-no-files-found: error
          # A release attaches it within the same run; a pull request's copy
          # is there to be tried on a real machine within the week.
          retention-days: 7

  macos-package:
    name: package (macos)
    if: ${{ inputs.include-macos }}
    runs-on: macos-15
    # Notarization waits on Apple, which takes minutes and now and then longer.
    timeout-minutes: 100
    # An empty name is no environment: the ad-hoc runs reach no secret.
    environment: ${{ inputs.macos-signing == 'developer-id' && 'release' || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source-sha || github.sha }}
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Name the version
        env:
          REQUESTED: ${{ inputs.version }}
          REQUESTED_ORDER: ${{ inputs.build-order }}
        run: |
          version="${REQUESTED#v}"
          echo "HIDE_VERSION=$version" >> "$GITHUB_ENV"
          # A build's order is its place in main's history
          # (desktop/scripts/package.mjs), which a shallow checkout cannot
          # count: a version no release uses is never ordered against another
          # build, and a release fetches main's history.
          if [ -n "$REQUESTED_ORDER" ]; then
            node -e 'const n = process.env.REQUESTED_ORDER; if (!/^[1-9][0-9]*$/.test(n) || !Number.isSafeInteger(Number(n))) throw new Error("build-order must be a positive safe decimal integer")'
            echo "HIDE_BUILD_ORDER=$REQUESTED_ORDER" >> "$GITHUB_ENV"
          else
            case "$version" in
              0.0.0-*) echo "HIDE_BUILD_ORDER=0" >> "$GITHUB_ENV" ;;
              *) git fetch --quiet --unshallow origin +refs/heads/main:refs/remotes/origin/main ;;
            esac
          fi
      - name: Install dependencies
        timeout-minutes: 5
        run: bash scripts/verify-web.sh install
      - name: Install the Developer ID certificate and the notary key
        # The certificate goes into a keychain of this job's own, put on the
        # search list so codesign finds it; the step names the one Developer
        # ID Application identity in it rather than trusting a typed name.
        if: ${{ inputs.macos-signing == 'developer-id' }}
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_DEVELOPER_ID_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          # An empty secret was not passed or not set; say which, rather than
          # let `security import` fail on an empty certificate.
          missing=()
          [ -n "$CERTIFICATE_P12" ] || missing+=(MACOS_DEVELOPER_ID_P12)
          [ -n "$CERTIFICATE_PASSWORD" ] || missing+=(MACOS_DEVELOPER_ID_P12_PASSWORD)
          [ -n "$NOTARY_KEY_P8" ] || missing+=(APPLE_NOTARY_KEY_P8)
          [ -n "$NOTARY_KEY_ID" ] || missing+=(APPLE_NOTARY_KEY_ID)
          [ -n "$NOTARY_ISSUER" ] || missing+=(APPLE_NOTARY_ISSUER_ID)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::developer-id signing needs the release environment secrets ${missing[*]}, which reached this job empty: the caller must pass each by name (release.yml) and the release environment must hold it"
            exit 1
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -hex 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/^ *[0-9]*) [0-9A-F]* "\(Developer ID Application: .*\)"$/\1/p')"
          if [ "$(printf '%s' "$identity" | grep -c '^')" != 1 ]; then
            echo "::error::the certificate must hold exactly one Developer ID Application identity"
            exit 1
          fi
          printf '%s' "$NOTARY_KEY_P8" > "$RUNNER_TEMP/notary-key.p8"
          echo "HIDE_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "HIDE_NOTARY_KEY_PATH=$RUNNER_TEMP/notary-key.p8" >> "$GITHUB_ENV"
      - name: Package the app, its dmg, zip and update files
        # With developer-id the packager also signs, notarizes and staples the
        # app and the dmg, and fails unless Gatekeeper accepts both as notarized.
        timeout-minutes: 80
        env:
          HIDE_MACOS_SIGNING: ${{ inputs.macos-signing }}
          HIDE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          HIDE_NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: bash scripts/verify-web.sh desktop package
      - name: Verify the dmg, the zip and the app the zip holds
        id: bundle
        run: |
          release=desktop/out/release
          (cd "$release" && for checksum in *.sha256; do shasum -a 256 -c "$checksum"; done)
          # The dmg a person opens: hide and the Applications link, the app signed.
          volume="$RUNNER_TEMP/hide-dmg"
          hdiutil attach -nobrowse -readonly -mountpoint "$volume" "$release/hide-v${HIDE_VERSION}-macos-arm64.dmg"
          test "$(readlink "$volume/Applications")" = /Applications
          codesign --verify --deep --strict --verbose=2 "$volume/hide.app"
          hdiutil detach "$volume"
          # The zip the updater installs holds the app the specs below start.
          mkdir desktop/out/extracted
          ditto -x -k "$release/hide-v${HIDE_VERSION}-macos-arm64.zip" desktop/out/extracted
          app="$PWD/desktop/out/extracted/hide.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          echo "app=$app" >> "$GITHUB_OUTPUT"
          # The existing fixtures locate the CLI in target/debug. These exact
          # packaged release binaries avoid building a second workspace.
          mkdir -p target/debug
          cp "$app/Contents/Resources/hide" "$app/Contents/Resources/hided" target/debug/
      - name: Install the pinned Electron runtime for the package fixtures
        timeout-minutes: 5
        run: bash scripts/verify-web.sh desktop electron-install
      - name: Packaged app launch, session search, and isolated install kit
        timeout-minutes: 10
        env:
          HIDE_E2E_APP: ${{ steps.bundle.outputs.app }}
          HIDE_E2E_PACKAGED_APP: ${{ steps.bundle.outputs.app }}/Contents/MacOS/hide
          HIDE_E2E_HERDR_BIN: ${{ steps.bundle.outputs.app }}/Contents/Resources/herdr
          HIDE_E2E_SCREENSHOT_DIR: ${{ runner.temp }}/hide-e2e
        run: |
          mkdir -p "$HIDE_E2E_SCREENSHOT_DIR"
          bash scripts/verify-web.sh desktop e2e local-kit.spec.ts server-picker.spec.ts status-page.spec.ts --project background
      - name: Report flaky and failed tests
        # A test that fails its retry too becomes a `Failed test` annotation,
        # which the run's summary shows and the nightly report files; see
        # nightly.yml. Writing an annotation needs no permission, and this
        # workflow has no `issues: write` (pr.yml and release.yml call it
        # with `contents: read`), so a flaky test here is listed in the job
        # summary as not filed.
        id: flaky
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci-flaky-report.py --suite desktop --playwright desktop/e2e-report.json
      - name: Keep the failed package run
        # A flaky run keeps it as a failed one does; see web-e2e.yml.
        if: ${{ failure() || steps.flaky.outputs.flaky == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: hide-macos-package-logs
          path: |
            ${{ runner.temp }}/hide-e2e
            desktop/test-results
          if-no-files-found: ignore
      - name: Keep the package
        uses: actions/upload-artifact@v7
        with:
          name: hide-package-macos
          path: desktop/out/release/*
          if-no-files-found: error
          retention-days: 7
      - name: Remove the signing keychain and the notary key
        if: ${{ always() && inputs.macos-signing == 'developer-id' }}
        run: |
          if [ -f "$RUNNER_TEMP/signing.keychain-db" ]; then security delete-keychain "$RUNNER_TEMP/signing.keychain-db"; fi
          rm -f "$RUNNER_TEMP/notary-key.p8"
