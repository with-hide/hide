# After a run of main's head, deletes main's Rust dependency caches that head
# replaced (scripts/prune-rust-caches.py; docs/BUILD.md, "CI's Rust caches").
# GitHub keeps every saved key until the 10 GB limit evicts one, and it evicted
# the entries main's runs read while older copies stayed.
name: rust cache prune

on:
  workflow_run:
    # The runs that build main's head and save its sets: a push's verify run
    # and the nightly. A release candidate may build an older commit.
    workflows: [verify, nightly]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: rust-cache-prune
  cancel-in-progress: false

jobs:
  prune:
    # `branches` matches a branch name, which a fork's pull request can also
    # call main; only this repository's own push, schedule or hand run on main.
    if: >-
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      contains(fromJSON('["push", "schedule", "workflow_dispatch"]'), github.event.workflow_run.event)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # Deleting a cache entry.
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Delete main's replaced Rust caches
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          # The dependency hash `.github/actions/rust-cache` puts in the key.
          DEPS: ${{ hashFiles('Cargo.lock', 'Cargo.toml', '*/Cargo.toml', 'rust-toolchain.toml') }}
        run: python3 scripts/prune-rust-caches.py --repo "$GITHUB_REPOSITORY" --head "$HEAD_SHA" --deps "$DEPS"
