# TEMPORARY (removed before review): 20 Windows runs of hide-agent-hooks `it`
# and hide-node's bootstrap windows_tests, five fresh runners of four rounds,
# with no retry. Even rounds run the bootstrap tests under an empty module
# analysis cache, the state that stalled their first PowerShell starts.
name: tmp ps repeat
on:
  push:
    branches: [fix/flaky-win-ps-start]
permissions:
  contents: read
jobs:
  repeat:
    name: repeat ${{ matrix.runner }}
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        runner: [1, 2, 3, 4, 5]
    defaults:
      run:
        shell: bash
    env:
      TEST_TARGETS: >-
        -p hided -p hide-host -p hide-node -p hide-kit -p hide-agent-hooks -p herdr-core -p hide-ai
        -p hide-agent-adapter -p hide-desk -p hide-shell
        --lib --bin hide-agent-hooks --test it
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust-cache
        with:
          set: workspace
          save: false
      - uses: ./.github/actions/vt-cache
        with:
          save: false
      - name: Install cargo-nextest
        timeout-minutes: 3
        run: bash scripts/install-nextest.sh
      - name: Build the Windows test binaries
        timeout-minutes: 40
        run: bash scripts/verify-cargo.sh nextest --profile ci $TEST_TARGETS --no-run
      - name: Four rounds, no retry
        run: |
          set +e
          failed=0
          for round in 1 2 3 4; do
            bash scripts/verify-cargo.sh nextest --profile ci --retries 0 --no-fail-fast $TEST_TARGETS -E 'binary_id(hide-agent-hooks::it)'
            hooks=$?
            if [ $((round % 2)) -eq 0 ]; then
              export PSModuleAnalysisCachePath="$(cygpath -w "$RUNNER_TEMP")\\cold-$round\\ModuleAnalysisCache"
              cache=empty
            else
              cache=runner
            fi
            bash scripts/verify-cargo.sh nextest --profile ci --retries 0 --no-fail-fast $TEST_TARGETS -E 'package(hide-node) & kind(lib) & test(/bootstrap::windows_tests::/)'
            bootstrap=$?
            unset PSModuleAnalysisCachePath
            echo "ROUND runner=${{ matrix.runner }} round=$round hooks=$hooks bootstrap=$bootstrap cache=$cache"
            [ $hooks -eq 0 ] && [ $bootstrap -eq 0 ] || failed=$((failed + 1))
          done
          echo "ROUNDS FAILED runner=${{ matrix.runner }}: $failed of 4"
          exit $failed
      - name: Processor time contract
        if: ${{ !cancelled() && matrix.runner == 1 }}
        run: bash scripts/verify-cargo.sh nextest --profile ci --retries 0 -p hide-platform --test it -E 'test(processor_time_counts)'
