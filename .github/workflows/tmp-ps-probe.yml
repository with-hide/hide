# TEMPORARY (removed before review): measures Windows PowerShell's first
# start on a fresh windows-latest runner.
name: tmp ps probe
on:
  push:
    branches: [fix/flaky-win-ps-start]
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Time PowerShell starts
        run: |
          set +e
          PS='C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe'
          T=$(cygpath -w "$RUNNER_TEMP")
          ms() { python -c 'import time; print(int(time.time()*1000))'; }
          t() { local name=$1; shift; local s=$(ms); "$@" >"$RUNNER_TEMP/$name.out" 2>"$RUNNER_TEMP/$name.err"; local rc=$?; local e=$(ms); printf '%-30s rc=%s %6sms stderr=%s\n' "$name" "$rc" "$((e - s))" "$(head -c 200 "$RUNNER_TEMP/$name.err" | tr '\r\n' '  ')"; }
          echo "PSModuleAnalysisCachePath=$PSModuleAnalysisCachePath"
          echo "LOCALAPPDATA=$LOCALAPPDATA USERPROFILE=$USERPROFILE"
          ls -la "$(cygpath "$PSModuleAnalysisCachePath" 2>/dev/null)" 2>&1 | head -3
          t default-exit0 "$PS" -NoProfile -NonInteractive -Command 'exit 0'
          t default-write-output "$PS" -NoProfile -NonInteractive -Command '$null = Write-Output x'
          mkdir -p "$RUNNER_TEMP/prof"
          USERPROFILE="$T\\prof" t userprofile-write-output "$PS" -NoProfile -NonInteractive -Command '$null = Write-Output x'
          env -u PSModuleAnalysisCachePath bash -c "$(declare -f ms t); PS='$PS'; RUNNER_TEMP='$RUNNER_TEMP'; t unset-write-output \"\$PS\" -NoProfile -NonInteractive -Command '\$null = Write-Output x'; t unset-write-output-again \"\$PS\" -NoProfile -NonInteractive -Command '\$null = Write-Output x'"
          echo "--- cold, with module auto-loading off and explicit imports"
          PSModuleAnalysisCachePath="$T\\n1" t cold-noautoload-import "$PS" -NoProfile -NonInteractive -Command '$PSModuleAutoLoadingPreference = "None"; Import-Module Microsoft.PowerShell.Utility; $null = Write-Output x; $null = New-Object IO.MemoryStream; Add-Type -TypeDefinition "public static class P2 { public static int X() { return 1; } }"'
          PSModuleAnalysisCachePath="$T\\n2" t cold-noautoload-exec "$PS" -NoProfile -NonInteractive -Command '$PSModuleAutoLoadingPreference = "None"; exec sh'
          PSModuleAnalysisCachePath="$T\\n3" t cold-noautoload-missing "$PS" -NoProfile -NonInteractive -Command '$PSModuleAutoLoadingPreference = "None"; $null = Write-Output x'
          echo "--- is a cold start visible while it runs"
          (PSModuleAnalysisCachePath="$T\\v1" "$PS" -NoProfile -NonInteractive -Command '$null = Write-Output x' >"$RUNNER_TEMP/v1.out" 2>"$RUNNER_TEMP/v1.err") &
          sleep 8
          echo "stderr bytes at 8 s: $(wc -c < "$RUNNER_TEMP/v1.err")"
          "$PS" -NoProfile -NonInteractive -Command 'Import-Module Microsoft.PowerShell.Management; Get-CimInstance Win32_Process -Filter "Name=''powershell.exe''" | % { $p = Get-Process -Id $_.ProcessId; "{0} cpu={1:n1}s threads={2} {3}" -f $_.ProcessId, $p.CPU, $p.Threads.Count, $_.CommandLine }'
          wait
          echo "stderr at end: $(head -c 400 "$RUNNER_TEMP/v1.err" | tr '\r\n' '  ')"
