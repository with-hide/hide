# Temporary: learns whether GitHub's Windows runner runs WSL2 before the
# WSL device lane is built on it. Removed before the pull request is ready.
name: wsl-probe

on:
  push:
    branches: [feat/wsl-device]

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - name: WSL before setup
        continue-on-error: true
        run: |
          wsl.exe --version
          wsl.exe --status
          wsl.exe --list --verbose
          Get-ChildItem HKCU:\Software\Microsoft\Windows\CurrentVersion\Lxss -ErrorAction SilentlyContinue | ForEach-Object { Get-ItemProperty $_.PSPath }
      - uses: Vampire/setup-wsl@v7
        id: wsl
        continue-on-error: true
        with:
          distribution: Ubuntu-24.04
          wsl-version: 2
      - name: WSL after setup
        if: always()
        run: |
          wsl.exe --version
          wsl.exe --list --verbose
          $env:WSL_UTF8 = ""
          [System.IO.File]::WriteAllBytes("$env:RUNNER_TEMP\lv.bin", [byte[]][char[]]"")
          $out = & wsl.exe --list --verbose
          "raw lines: $($out.Count)"
          & wsl.exe --list --running --quiet
          "running exit: $LASTEXITCODE"
          Get-ItemProperty HKCU:\Software\Microsoft\Windows\CurrentVersion\Lxss -ErrorAction SilentlyContinue
          Get-ChildItem HKCU:\Software\Microsoft\Windows\CurrentVersion\Lxss -ErrorAction SilentlyContinue | ForEach-Object { Get-ItemProperty $_.PSPath | Format-List * }
      - name: Inside the distribution
        if: always()
        run: |
          wsl.exe -d Ubuntu-24.04 -e uname -a
          wsl.exe -d Ubuntu-24.04 -e cat /proc/version
          wsl.exe -d Ubuntu-24.04 -e sh -c 'id; echo HOME=$HOME; cat /etc/machine-id; ls -la /run/systemd/system 2>&1 | head -2; ps -p 1 -o comm=; command -v sha256sum'
          wsl.exe --list --running --quiet
          "running exit: $LASTEXITCODE"
          wsl.exe --terminate Ubuntu-24.04
          Start-Sleep -Seconds 3
          wsl.exe --list --running --quiet
          "running exit after terminate: $LASTEXITCODE"
          $bytes = [System.Text.Encoding]::Unicode.GetBytes("")
          $p = Start-Process -FilePath wsl.exe -ArgumentList "--list","--running","--quiet" -NoNewWindow -Wait -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP\running.txt"
          "exit $($p.ExitCode)"
          Format-Hex -Path "$env:RUNNER_TEMP\running.txt" | Select-Object -First 4
          $p = Start-Process -FilePath wsl.exe -ArgumentList "--list","--verbose" -NoNewWindow -Wait -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP\verbose.txt"
          "exit $($p.ExitCode)"
          Format-Hex -Path "$env:RUNNER_TEMP\verbose.txt" | Select-Object -First 8
