# TEMPORARY (removed before review): when Windows PowerShell writes a module
# analysis cache it was pointed at, started again and again.
name: tmp ps cache
on:
  push:
    branches: [fix/flaky-win-ps-start]
permissions:
  contents: read
jobs:
  cache:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - run: |
          set +e
          PS='C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe'
          T=$(cygpath -w "$RUNNER_TEMP")
          ms() { python -c 'import time; print(int(time.time()*1000))'; }
          for n in 1 2 3 4 5 6; do
            s=$(ms); PSModuleAnalysisCachePath="$T\\c$n" "$PS" -NoProfile -NonInteractive -Command '$null = Test-Path -LiteralPath $env:SystemRoot -PathType Leaf; exit 0' </dev/null >/dev/null 2>&1; e=$(ms)
            echo "run=$n ms=$((e - s)) cache_at_exit=$(test -f "$RUNNER_TEMP/c$n" && wc -c < "$RUNNER_TEMP/c$n" || echo none)"
          done
          ls -la "$LOCALAPPDATA/Microsoft/Windows/PowerShell" "$LOCALAPPDATA/Microsoft/Windows/PowerShell/CommandAnalysis" 2>&1 | head -20
