name: hide release

# A `v*` tag on main publishes a release when every gate passed, with nothing
# for a person to do (operator decision 2026-10-12):
#   - the tagged commit's own `verify` push run on main passed, which ran every
#     lane: the workspace, the desktop and web end-to-end suites, Windows and
#     the packages;
#   - the workspace tests and the web and desktop checks pass again here;
#   - `package.yml` builds each system's installers and update files and
#     installs and starts each one: the macOS dmg and zip signed with the
#     Developer ID certificate and notarized, the app the zip holds opened by
#     its packaged-app specs; the Windows installer installed, installed again
#     while Herdr runs and uninstalled, and the installed app opened with its
#     window; the Linux deb installed on Ubuntu and the rpm in Fedora, and
#     every installed daemon started (PRD auto-update D-32);
#   - `agent-journey.yml` spawns the agents through Hide on the stand-ins
#     and against its fake model with the pinned CLIs (PRD agent-journey-check
#     B26).
# One job then drafts the release with exactly the files
# `expectedAssetNames` lists (the installers, their checksums, the three
# update files the app reads and the blockmaps; D-35), verifies each checksum
# and each update file's sha512 and size, and publishes it. The tag names the
# release's kind (`releaseKind` in scripts/check-release-assets.mjs, the one
# place it is read): `vX.Y.Z` is published as the latest, which
# withhide.dev's download links and the apps on the stable channel follow;
# `vX.Y.Z-rc.N` runs the same gates and is published as a pre-release that is
# never the latest, which those links ignore and only an app with preview
# releases turned on installs.
# Each upload is a workflow artifact first, so a failed gate drafts nothing and
# no two jobs race to create the same draft. Immutable releases make a
# published release final: a bad one is followed by a new version, not edited.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Require a release tag already on protected main
        run: |
          node --input-type=module -e 'import { releaseKind } from "./scripts/check-release-assets.mjs"; console.log(releaseKind(process.argv[1]));' "$GITHUB_REF_NAME"
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Test the workspace
        run: bash scripts/verify-cargo.sh test
      - name: Typecheck, lint, unit test and build the web shell and the desktop app
        run: bash scripts/verify-web.sh

  main-verified:
    # The tagged commit's push run is the full suite, so the release waits for
    # it rather than run it twice. A commit whose run was cancelled (a later
    # merge superseded it) or failed is not released: rerun that run, or tag a
    # later main commit whose run passed.
    runs-on: ubuntu-latest
    timeout-minutes: 100
    permissions:
      actions: read
    steps:
      - name: Wait for main's verify run of the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          query="repos/$GITHUB_REPOSITORY/actions/workflows/pr.yml/runs?event=push&branch=main&head_sha=$GITHUB_SHA&per_page=1"
          for minute in $(seq 1 90); do
            # A failed read is retried next minute; it is not an answer.
            if ! run="$(gh api "$query" --jq '.workflow_runs[0] // {} | "\(.id // "") \(.status // "") \(.conclusion // "")"')"; then
              sleep 60
              continue
            fi
            read -r id status conclusion <<< "$run"
            if [ -z "$id" ] && [ "$minute" -ge 10 ]; then
              echo "::error::main has no verify push run for $GITHUB_SHA; tag the head of a merge into main"
              exit 1
            fi
            if [ "$status" = completed ]; then
              if [ "$conclusion" = success ]; then
                echo "main's verify run $id passed for $GITHUB_SHA"
                exit 0
              fi
              echo "::error::main's verify run $id for $GITHUB_SHA ended $conclusion; rerun it, or tag a later main commit whose run passed"
              exit 1
            fi
            sleep 60
          done
          echo "::error::main's verify run for $GITHUB_SHA did not finish within 90 minutes"
          exit 1

  packages:
    # A tag builds a release only from a tree every gate passed.
    needs: [test, main-verified]
    uses: ./.github/workflows/package.yml
    with:
      version: ${{ github.ref_name }}
      include-macos: true
      macos-signing: developer-id
    # By name, not `secrets: inherit`: package.yml gets the five signing
    # secrets and the development issues App's key, and nothing else. The
    # signing secrets live only in the `release` environment, which
    # package.yml's macOS job names; a secret not passed here would reach that
    # job empty.
    secrets:
      MACOS_DEVELOPER_ID_P12: ${{ secrets.MACOS_DEVELOPER_ID_P12 }}
      MACOS_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
      APPLE_NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
      APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
      APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
      HIDE_ISSUES_APP_KEY: ${{ secrets.HIDE_ISSUES_APP_KEY }}

  # The agent journey on the release's commit: the stand-ins on Linux and
  # macOS, the Windows forms and the fake model on all three systems
  # (docs/VERIFICATION.md, Agent journey). A failed cell, isolation or cleanup
  # stops the release.
  agent-journey:
    needs: [test, main-verified]
    uses: ./.github/workflows/agent-journey.yml
    permissions:
      contents: read
    with:
      systems: '["linux","macos","windows"]'
      fake: true

  publish:
    needs: [packages, agent-journey]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The three systems' release files by name: package.yml uploads
      # screenshots and logs beside them, and the asset gate refuses any file
      # it does not expect.
      - uses: actions/download-artifact@v8
        with:
          name: hide-package-macos
          path: packages
      - uses: actions/download-artifact@v8
        with:
          name: hide-package-windows
          path: packages
      - uses: actions/download-artifact@v8
        with:
          name: hide-package-linux
          path: packages
      - name: Draft the release, verify it and publish it as its tag's kind
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-draft.mjs "$GITHUB_REF_NAME" "$GITHUB_SHA" packages --publish
