# The tests a pull request adds or changes, run many times with no retry, so a
# new test that fails one run in ten fails its own pull request (docs/TESTING.md,
# "Flaky tests"). `pr.yml` calls it from the `repeat` lane with what
# `scripts/ci-plan.py` selected (web specs, the packages' unit test files and
# Rust test modules, by file; `scripts/ci-repeat.py` owns what counts as a
# changed test and the budget of 200 test runs for the whole pull request),
# always on Linux. A hand run names the specs, unit test files or Rust modules,
# how many times, and the system, so a fix is shown on the system that failed
# without a temporary commit:
#
#   gh workflow run repeat.yml --ref <branch> -f runner=windows \
#     -f web='s3.spec.ts' -f repeat=10
#   gh workflow run repeat.yml --ref <branch> -f units='web/src/searchDetail.test.ts'
#   gh workflow run repeat.yml --ref <branch> \
#     -f rust='hided:it:handshake hided:lib:mobile::clear_tests hide-kit:lib:process::tests'
#
# The web specs run through `web-e2e.yml` (the same build, fixtures and runner
# setup as the suite), the unit test files under Vitest with no retry, and the
# Rust modules under nextest on the same dependency caches as the `rust` lane.
# None retries, and none files a flaky issue.
name: repeat changed tests

on:
  workflow_call:
    inputs:
      web:
        description: The changed web specs, a JSON list of paths.
        type: string
        default: '[]'
      units:
        description: The changed unit test files, a JSON list of paths.
        type: string
        default: '[]'
      rust:
        description: The changed Rust test modules, a JSON list of {package, test, module}.
        type: string
        default: '[]'
  workflow_dispatch:
    inputs:
      runner:
        description: The system to run on.
        type: choice
        options: [linux, macos, windows]
        default: linux
      web:
        description: Web spec files to repeat, space-separated (s3.spec.ts).
        type: string
        default: ''
      units:
        description: Unit test files of the web, desktop or mobile package, space-separated (web/src/searchDetail.test.ts).
        type: string
        default: ''
      rust:
        description: Rust test modules, space-separated as package:test:module, where test is it, lib or bin (hided:it:handshake, hide-kit:lib:process::tests).
        type: string
        default: ''
      grep:
        description: Playwright --grep filter, to repeat some tests of the named specs.
        type: string
        default: ''
      repeat:
        description: How many times each test runs, 1 to 100.
        type: string
        default: '10'

permissions:
  contents: read

jobs:
  # Validates what called the lane and, for a pull request, counts the changed
  # tests to choose the repeat; a hand run has named its own.
  count:
    name: choose the repeat
    runs-on: ubuntu-latest
    # The web install and listing (5 minutes each) or the Rust build and listing (25), whichever the pull request needs, with setup.
    timeout-minutes: 45
    outputs:
      web: ${{ steps.resolve.outputs.web }}
      units: ${{ steps.resolve.outputs.units }}
      rust: ${{ steps.resolve.outputs.rust }}
      runner: ${{ steps.resolve.outputs.runner }}
      os: ${{ steps.resolve.outputs.os }}
      repeat: ${{ steps.repeat.outputs.repeat }}
      run-web: ${{ steps.repeat.outputs.run-web }}
      run-units: ${{ steps.repeat.outputs.run-units }}
      run-rust: ${{ steps.repeat.outputs.run-rust }}
      rust-plan: ${{ steps.rust-count.outputs.rust-plan || steps.resolve.outputs.rust-plan }}
      units-plan: ${{ steps.units-count.outputs.units-plan }}
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 5
      - name: Resolve what was asked
        id: resolve
        timeout-minutes: 2
        env:
          EVENT: ${{ github.event_name }}
          WEB: ${{ inputs.web }}
          UNITS: ${{ inputs.units }}
          RUST: ${{ inputs.rust }}
          REPEAT: ${{ inputs.repeat }}
          RUNNER: ${{ inputs.runner || 'linux' }}
        run: python3 scripts/ci-repeat.py resolve --event "$EVENT" --web "$WEB" --units "$UNITS" --rust "$RUST" --repeat "$REPEAT" --runner "$RUNNER"
      - uses: pnpm/action-setup@v6
        if: steps.resolve.outputs.web-count-needed == 'true' || steps.resolve.outputs.units-count-needed == 'true'
        timeout-minutes: 5
        with:
          version: 10
      - uses: actions/setup-node@v4
        if: steps.resolve.outputs.web-count-needed == 'true' || steps.resolve.outputs.units-count-needed == 'true'
        timeout-minutes: 5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install web dependencies
        # The unit test files are listed by the packages' own Vitest, which
        # needs the workspace installed, so both kinds share this install.
        if: steps.resolve.outputs.web-count-needed == 'true' || steps.resolve.outputs.units-count-needed == 'true'
        timeout-minutes: 5
        run: bash scripts/verify-web.sh install
      - name: Count the web tests
        # The specs' own listing, so a loop that declares tests counts as many
        # as it runs. A listing that fails fails the lane.
        id: web-count
        if: steps.resolve.outputs.web-count-needed == 'true'
        timeout-minutes: 5
        env:
          SPECS: ${{ steps.resolve.outputs.web }}
        run: |
          # shellcheck disable=SC2086 # the spec paths hold no space or glob character
          python3 scripts/ci-repeat.py spec-patterns $SPECS > "$RUNNER_TEMP/specs.txt"
          args=()
          while IFS= read -r pattern; do args+=("$pattern"); done < "$RUNNER_TEMP/specs.txt"
          bash scripts/verify-web.sh web e2e-list --reporter=list "${args[@]}" > "$RUNNER_TEMP/list.txt"
          echo "web-count=$(python3 scripts/ci-repeat.py count-listed < "$RUNNER_TEMP/list.txt")" >> "$GITHUB_OUTPUT"
      # The relay WebAssembly the phone's unit tests import: listing a file
      # transforms its imports, so the listing needs it as the units job does.
      - uses: ./.github/actions/relay-tools
        if: steps.resolve.outputs.units-count-needed == 'true'
        with:
          save: false
      - name: Build the relay WebAssembly the unit tests import
        if: steps.resolve.outputs.units-count-needed == 'true'
        timeout-minutes: 10
        run: bash scripts/build-relay-wasm.sh
      - name: Count the unit tests
        # Each package's own Vitest lists the selected files' tests, so a table
        # that declares them counts as many as it runs. A file that lists none
        # fails the lane here.
        id: units-count
        if: steps.resolve.outputs.units-count-needed == 'true'
        timeout-minutes: 10
        env:
          UNITS: ${{ steps.resolve.outputs.units }}
        run: python3 scripts/ci-repeat.py units-plan --units "$UNITS"
      - name: Install cargo-nextest
        if: steps.resolve.outputs.rust-count-needed == 'true'
        timeout-minutes: 3
        run: bash scripts/install-nextest.sh
      - uses: ./.github/actions/rust-cache
        if: steps.resolve.outputs.rust-count-needed == 'true'
        timeout-minutes: 5
        with:
          set: workspace
          save: false
      - uses: ./.github/actions/vt-cache
        if: steps.resolve.outputs.rust-count-needed == 'true'
        timeout-minutes: 5
        with:
          save: false
      - name: Count the Rust tests
        # What nextest lists for the changed modules' filtersets, so N is the
        # tests that run. A package whose modules list none (a helper file)
        # runs its whole `it` binary instead, and a change to `support` or
        # `main.rs` selects that whole binary. An ignored test is counted too,
        # and the plan says what the job passes to run it, so the tests a
        # module marks ignored to run only where the holder is prepared are
        # proved by this lane as any other test is. The decision is `rust_plan`
        # in scripts/ci-repeat.py. This builds the changed crates' tests once,
        # and the Rust job builds them again on its own runner. A listing that
        # fails fails the lane.
        id: rust-count
        if: steps.resolve.outputs.rust-count-needed == 'true'
        timeout-minutes: 25
        env:
          RUST: ${{ steps.resolve.outputs.rust }}
        run: python3 scripts/ci-repeat.py rust-plan --rust "$RUST"
      - name: Choose the repeat
        id: repeat
        timeout-minutes: 2
        env:
          EVENT: ${{ github.event_name }}
          WEB_COUNT: ${{ steps.web-count.outputs.web-count }}
          UNITS_COUNT: ${{ steps.units-count.outputs.units-count }}
          RUST_COUNT: ${{ steps.rust-count.outputs.rust-count }}
          NAMED: ${{ steps.resolve.outputs.repeat }}
          WEB: ${{ steps.resolve.outputs.web }}
          UNITS: ${{ steps.resolve.outputs.units }}
          RUST: ${{ steps.resolve.outputs.rust }}
        run: |
          python3 scripts/ci-repeat.py choose --event "$EVENT" --web "$WEB" --units "$UNITS" --rust "$RUST" \
            --repeat "$NAMED" --web-count "$WEB_COUNT" --units-count "$UNITS_COUNT" --rust-count "$RUST_COUNT"

  web:
    name: repeat web specs
    needs: count
    if: needs.count.outputs.run-web == 'true'
    uses: ./.github/workflows/web-e2e.yml
    permissions:
      contents: read
    with:
      lane: repeat-${{ needs.count.outputs.os }}
      runner: ${{ needs.count.outputs.runner }}
      shards: 1
      grep: ${{ inputs.grep || '' }}
      specs: ${{ needs.count.outputs.web }}
      repeat: ${{ needs.count.outputs.repeat }}

  units:
    name: repeat unit tests (${{ needs.count.outputs.os }})
    needs: count
    if: needs.count.outputs.run-units == 'true'
    runs-on: ${{ needs.count.outputs.runner }}
    # 200 runs of a unit test file, after the install and the build.
    timeout-minutes: 40
    outputs:
      completed: ${{ steps.report.outputs.completed }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 5
      - uses: pnpm/action-setup@v6
        timeout-minutes: 5
        with:
          version: 10
      - uses: actions/setup-node@v4
        timeout-minutes: 5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      # The relay WebAssembly's binding tool, which the web scripts build with.
      - uses: ./.github/actions/relay-tools
        with:
          save: false
      - name: Install dependencies
        timeout-minutes: 10
        run: bash scripts/verify-web.sh install
      - name: Build the relay WebAssembly the unit tests import
        # `web`'s `test` script builds this too, through `prepare:relay`, but
        # every iteration would then pay for it again. Built once here, the
        # per-iteration runs find it up to date.
        timeout-minutes: 10
        run: bash scripts/build-relay-wasm.sh
      - name: Repeat the unit tests
        # `--retry=0` over the suites' one retry, so one failed run fails the
        # job. Each file runs `REPEAT` times, and the report below proves the
        # completed runs. The plan is what the count job listed, so a file
        # that lists no test fails here too.
        timeout-minutes: 30
        env:
          PLAN: ${{ needs.count.outputs.units-plan }}
          REPEAT: ${{ needs.count.outputs.repeat }}
        run: |
          set -euo pipefail
          case "$REPEAT" in ''|*[!0-9]*|0) echo "repeat must be a positive number, not '$REPEAT'" >&2; exit 1 ;; esac
          python3 scripts/ci-repeat.py units-lines --plan "$PLAN" > "$RUNNER_TEMP/units.txt"
          rm -f "$RUNNER_TEMP"/junit-*.xml "$RUNNER_TEMP/units-failed.txt"
          # Vitest has no `--repeat-each`: repetition is a `test()` option, not
          # a flag, so the file runs once per iteration and each run writes its
          # own report. `--retry=0` over any configured retry, so one failed
          # run fails.
          #
          # A failed run does not end the loop: every iteration still runs, so
          # the report below sees the whole repeat and names each failure.
          # This step's own exit status is not the verdict; the next one is,
          # and it reads the iterations that exited non-zero from a file, so
          # one that wrote no failing report (killed, or failing before any
          # test) still fails the job.
          while IFS=$'\t' read -r package file; do
            echo "::group::$file x $REPEAT"
            report="$RUNNER_TEMP/junit-$package-$(echo "$file" | tr '/.' '--')"
            # The package's Vitest matches a filter from its own folder, so the
            # file is spelled without the package's name.
            filter="${file#"$package"/}"
            for iteration in $(seq 1 "$REPEAT"); do
              echo "::group::$file, iteration $iteration of $REPEAT"
              # The package's own `test` script, which builds what the tests
              # import (the relay WebAssembly) before the file runs.
              bash scripts/verify-web.sh "$package" test --retry=0 "$filter" \
                --reporter=junit "--outputFile=$report.$iteration.xml" \
                || { echo "::error title=Failed run::$file failed on iteration $iteration of $REPEAT"
                     echo "$file iteration $iteration" >> "$RUNNER_TEMP/units-failed.txt"; }
              echo "::endgroup::"
            done
            echo "::endgroup::"
          done < "$RUNNER_TEMP/units.txt"
      - name: Report completed unit runs
        id: report
        timeout-minutes: 2
        # A run that failed fails here even when the loop above went on: the
        # reports name it, and a file that failed every iteration reports no
        # completed run at all.
        run: |
          python3 scripts/ci-repeat.py report --junit "$RUNNER_TEMP"/junit-*.*.xml
          python3 scripts/check-stress-report.py --junit "$RUNNER_TEMP"/junit-*.*.xml --repeat "${{ needs.count.outputs.repeat }}"
          if [ -s "$RUNNER_TEMP/units-failed.txt" ]; then
            echo "these iterations exited non-zero:" >&2
            cat "$RUNNER_TEMP/units-failed.txt" >&2
            exit 1
          fi

  rust:
    name: repeat Rust tests (${{ needs.count.outputs.os }})
    needs: count
    if: needs.count.outputs.run-rust == 'true'
    runs-on: ${{ needs.count.outputs.runner }}
    # The budget's 200 runs, after a build of the changed crates' tests.
    timeout-minutes: 90
    outputs:
      completed: ${{ steps.report.outputs.completed }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        timeout-minutes: 5
      # hide-agent-hooks runs Hide's OpenCode plugin under Node in its tests,
      # and the pane holder's screen tests draw on a headless xterm under Node.
      - uses: pnpm/action-setup@v6
        timeout-minutes: 5
        with:
          version: 10
      - uses: actions/setup-node@v4
        timeout-minutes: 5
        with:
          node-version: 22
      - name: Install the real shells
        # The same shells as the `rust` lane, from the cached packages
        # (.github/actions/apt-install); macOS has its own.
        if: runner.os == 'Linux'
        timeout-minutes: 7
        uses: ./.github/actions/apt-install
        with:
          packages: zsh fish tcsh csh
          minutes: 4
      - name: Install the holder tests' xterm
        timeout-minutes: 3
        run: bash scripts/verify-web.sh install holder
      - name: Fetch the pinned ConPTY runtime
        # A Windows holder runs on it, and the holder tests start one: without
        # it every `hide-holder::it` test stops in its fixture naming the
        # variable, before it reaches the test it was repeated for (run
        # 43658081062 failed all 15 of the `records` module this way). The
        # preparation step below does this for a plan that names an ignored
        # test; a hand run of an ordinary module never reaches it, so the
        # runtime is fetched here too, for every repeated module on Windows
        # and not for one crate's name. The package is 1.7 MB (a cache keyed
        # by its digest, `scripts/fetch-conpty.py`) and `wsl-device.yml` reads
        # it the same way.
        if: runner.os == 'Windows'
        timeout-minutes: 5
        env:
          HIDE_HOLDER_CONPTY: ${{ runner.temp }}\holder-conpty
        run: python scripts/fetch-conpty.py --out "$HIDE_HOLDER_CONPTY"
      # Reads the workspace set another lane saves (docs/BUILD.md, "CI's Rust caches").
      - uses: ./.github/actions/rust-cache
        timeout-minutes: 5
        with:
          set: workspace
          save: false
      - uses: ./.github/actions/vt-cache
        timeout-minutes: 5
        with:
          save: false
      - name: Install cargo-nextest
        timeout-minutes: 3
        run: bash scripts/install-nextest.sh
      - name: Repeat the Rust tests
        # `--retries 0` over the `ci` profile's one retry, so one failed run
        # fails the job. The count job expands a file under `src` that lists no
        # test of its own to its whole target, and a PR helper or all-ignored
        # module to its crate's whole `it` binary. Once chosen, a plan that
        # runs no test fails on a PR as on a hand run.
        #
        # A hand run of a module nobody changes - a test marked `#[ignore]`
        # that needs the built pane holder - is proved here too: the plan
        # names the flag that runs it and the holder it starts, and only that
        # selection pays for building the holder.
        timeout-minutes: 75
        env:
          PLAN: ${{ needs.count.outputs.rust-plan }}
          REPEAT: ${{ needs.count.outputs.repeat }}
          # The runtime the step above fetched, for the holder tests that
          # start a pane on it (`hide-holder/tests/it/support.rs`). An empty
          # value on another system is what those tests read there anyway.
          HIDE_HOLDER_CONPTY: ${{ runner.temp }}\holder-conpty
        run: |
          set -euo pipefail
          case "$REPEAT" in ''|*[!0-9]*|0) echo "repeat must be a positive number, not '$REPEAT'" >&2; exit 1 ;; esac
          # Only reports from this execution can prove completed work.
          rm -f target/nextest/ci/junit*.xml
          python3 scripts/ci-repeat.py plan-lines --plan "$PLAN" > "$RUNNER_TEMP/filters.txt"
          # `ci-repeat.py`'s UNIT_SEPARATOR, which `read` never folds as it
          # folds tabs, so an empty filterset keeps its field.
          while IFS=$'\x1f' read -r package test expression run_ignored; do
            echo "::group::$package $test ${expression:-whole target} x $REPEAT ${run_ignored:+($run_ignored)}"
            filter=()
            if [ -n "$expression" ]; then filter=(-E "$expression"); fi
            case "$test" in
              it) target=(--test it) ;;
              lib) target=(--lib) ;;
              bin) target=(--bins) ;;
              *) echo "unknown Rust target '$test'" >&2; exit 1 ;;
            esac
            # Only the plan's own decision adds the flag: an ignored test runs
            # only when it is asked for, and the plan asked only where every
            # test it counted is ignored (docs/TESTING.md, "The repeat lane").
            ignored=()
            if [ -n "$run_ignored" ]; then
              ignored=(--run-ignored "$run_ignored")
              # An ignored test is one that needs something prepared: the same
              # preparation `pr.yml`'s own ignored step makes, in one script so
              # the two cannot drift (the built pane holder and the shells
              # those tests start). It runs twice at most in a leg, and only
              # where the plan asked for an ignored test.
              . scripts/prepare-ignored-tests.sh
            fi
            # `--stress-count` exits 0 when the last iteration passed, so this
            # run's summary is kept and read below: an earlier iteration that
            # failed is a failed repeat the exit status does not show.
            #
            # nextest writes that summary to standard error, so both streams
            # are kept: teeing only standard output left the log without a
            # summary on a run where all 20 iterations passed, and the report
            # step below failed it as unproven (run 43658075817, "the log holds
            # no stress summary"). `remote-mailbox.yml` and `wsl-device.yml`
            # already read their repeated runs this way.
            bash scripts/verify-cargo.sh nextest --profile ci --retries 0 --stress-count "$REPEAT" --no-tests=fail -p "$package" "${target[@]}" ${filter[@]+"${filter[@]}"} ${ignored[@]+"${ignored[@]}"} \
              2>&1 | tee -a "$RUNNER_TEMP/nextest.log"
            echo "::endgroup::"
          done < "$RUNNER_TEMP/filters.txt"
      - name: Report completed Rust runs
        id: report
        timeout-minutes: 2
        # A failed iteration fails the lane here even when nextest's exit
        # status did not (`scripts/check-stress-report.py`).
        run: |
          python3 scripts/ci-repeat.py report --junit target/nextest/ci/junit*.xml
          python3 scripts/check-stress-report.py --junit target/nextest/ci/junit*.xml \
            --summary "$RUNNER_TEMP/nextest.log" --repeat "${{ needs.count.outputs.repeat }}"

  verdict:
    name: every chosen test ran
    needs: [count, web, units, rust]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 2
      - name: Require completed runs from every chosen leg
        timeout-minutes: 2
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci-repeat.py verdict
