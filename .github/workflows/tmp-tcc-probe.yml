# Temporary: removed before the pull request opens.
# Asks how tccd names a background program on each hosted macOS version, without a consent window:
# a preflight (never prompts) from a transient launchd job of the GUI session, with tccd's log beside it.
name: tmp-tcc-probe
on:
  push:
    branches: [fix/login-core-pane-permission]
    paths: [.github/workflows/tmp-tcc-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Build the probe
        run: |
          mkdir -p "$RUNNER_TEMP/kit" && cd "$RUNNER_TEMP/kit"
          cat > probe.c <<'C'
          #include <CoreFoundation/CoreFoundation.h>
          #include <dlfcn.h>
          #include <spawn.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <sys/wait.h>
          #include <unistd.h>
          extern char **environ;
          int main(int argc, char **argv) {
            if (argc > 2 && strcmp(argv[1], "--detach") == 0) {
              posix_spawnattr_t a; posix_spawnattr_init(&a); posix_spawnattr_setflags(&a, POSIX_SPAWN_SETSID);
              pid_t c; int r = posix_spawn(&c, argv[2], NULL, &a, argv + 2, environ);
              printf("detached spawn=%d child=%d parent=%d exits\n", r, c, getpid()); fflush(stdout);
              return 0;
            }
            if (argc > 2 && strcmp(argv[1], "--reexec-disclaim") == 0) {
              int (*setdisclaim)(posix_spawnattr_t *, int) = dlsym(RTLD_DEFAULT, "responsibility_spawnattrs_setdisclaim");
              posix_spawnattr_t a; posix_spawnattr_init(&a); posix_spawnattr_setflags(&a, POSIX_SPAWN_SETEXEC);
              if (!setdisclaim) { printf("no setdisclaim symbol\n"); fflush(stdout); return 3; }
              printf("reexec pid=%d setdisclaim=%d\n", getpid(), setdisclaim(&a, 1)); fflush(stdout);
              int r = posix_spawn(NULL, argv[2], NULL, &a, argv + 2, environ);
              printf("reexec failed %d\n", r); return 4;
            }
            if (argc > 2 && strcmp(argv[1], "--spawn") == 0) {
              pid_t c; int r = posix_spawn(&c, argv[2], NULL, NULL, argv + 2, environ);
              printf("plain spawn=%d child=%d\n", r, c); fflush(stdout);
              int st; waitpid(c, &st, 0); return 0;
            }
            if (getenv("PROBE_SLEEP")) sleep(atoi(getenv("PROBE_SLEEP")));
            void *h = dlopen("/System/Library/PrivateFrameworks/TCC.framework/TCC", RTLD_NOW);
            int (*preflight)(CFStringRef, CFDictionaryRef) = h ? dlsym(h, "TCCAccessPreflight") : NULL;
            pid_t (*resp)(pid_t) = dlsym(RTLD_DEFAULT, "responsibility_get_pid_responsible_for_pid");
            const char *svc = "kTCCServiceSystemPolicyDocumentsFolder";
            CFStringRef s = CFStringCreateWithCString(NULL, svc, kCFStringEncodingUTF8);
            int r = preflight ? preflight(s, NULL) : -99;
            printf("PROBE tag=%s pid=%d ppid=%d responsible=%d preflight=%d exe=%s\n",
                   getenv("PROBE_TAG") ? getenv("PROBE_TAG") : "-", getpid(), getppid(), resp ? resp(getpid()) : -1, r, argv[0]);
            fflush(stdout);
            return 0;
          }
          C
          clang -O1 -o src-probe probe.c -framework CoreFoundation
          bid=dev.withhide.candidate.m94probe
          plist() { printf '<?xml version="1.0" encoding="UTF-8"?>\n<plist version="1.0"><dict><key>CFBundleIdentifier</key><string>%s</string><key>CFBundleName</key><string>m94probe</string><key>CFBundleExecutable</key><string>%s</string><key>CFBundlePackageType</key><string>BNDL</string><key>CFBundleInfoDictionaryVersion</key><string>6.0</string></dict></plist>\n' "$bid" "$2" > "$1"; }
          mkdir -p m1bare m2late m3sealed m5/core m5/holder m5/prog
          cp src-probe m1bare/probe; codesign --force --sign - --identifier "$bid" m1bare/probe
          cp src-probe m2late/probe; codesign --force --sign - --identifier "$bid" m2late/probe; plist m2late/Info.plist probe
          cp src-probe m3sealed/probe; plist m3sealed/Info.plist probe; codesign --force --sign - --identifier "$bid" m3sealed/probe
          cp src-probe m5/core/hided; codesign --force --sign - --identifier hided m5/core/hided
          cp src-probe m5/holder/hide-holder; codesign --force --sign - --identifier "$bid" m5/holder/hide-holder; plist m5/holder/Info.plist hide-holder
          cp src-probe m5/prog/prog; codesign --force --sign - --identifier m94prog m5/prog/prog
          for c in m1bare m2late m3sealed; do echo "codesign -v $c: $(codesign -v --strict "$c/probe" 2>&1 | sed "s#$PWD#KIT#g" | tr '\n' ' ')"; done
      - name: Ask tccd how it names each case
        run: |
          cd "$RUNNER_TEMP/kit"; here=$PWD
          sw_vers | tr '\n' ' '; echo; uname -m
          one() {
            tag=$1; label="dev.withhide.candidate.m94probe.$tag"; pl="$here/$tag.plist"; out="$here/$tag.out"; logf="$here/$tag.tccd.log"; : > "$out"
            printf '<?xml version="1.0" encoding="UTF-8"?>\n<plist version="1.0"><dict><key>Label</key><string>%s</string><key>ProgramArguments</key><array>%s</array><key>EnvironmentVariables</key><dict><key>PROBE_TAG</key><string>%s</string>%s</dict><key>LimitLoadToSessionType</key><string>Aqua</string><key>RunAtLoad</key><true/><key>AbandonProcessGroup</key><true/><key>StandardOutPath</key><string>%s</string><key>StandardErrorPath</key><string>%s</string></dict></plist>\n' "$label" "$2" "$tag" "$3" "$out" "$out" > "$pl"
            sudo /usr/bin/log stream --info --debug --style compact --predicate 'process == "tccd" AND subsystem == "com.apple.TCC"' > "$logf" 2>&1 &
            sleep 2
            /bin/launchctl bootstrap "gui/$(id -u)" "$pl" || echo "bootstrap failed: $?"
            for i in $(seq 1 60); do grep -q PROBE "$out" && break; sleep 0.25; done; sleep 2
            /bin/launchctl bootout "gui/$(id -u)/$label" 2>/dev/null || true
            sudo pkill -f "log stream --info --debug --style compact" || true; sleep 0.5
            echo "== $tag"; sed "s#$here#KIT#g" "$out" | cut -c1-200
            grep -E "IDENTITY_ATTRIBUTION: identifier|BUNDLE_ATTRIBUTION|Handling access request to kTCCServiceSystemPolicyDocumentsFolder|matchesCodeRequirement|Failed" "$logf" | grep -E "KIT|m94|kit/" | sed -E 's/^[0-9-]+ ([0-9:.]+) [A-Za-z]+ +tccd\[[0-9]+:[0-9a-f]+\] \[com.apple.TCC:access\] /\1 /' | sed "s#$here#KIT#g" | cut -c1-430 | head -14
            grep -E "IDENTITY_ATTRIBUTION: identifier" "$logf" | sed -E 's/.*IDENTITY_ATTRIBUTION: /  attribution: /' | sort | uniq -c | head -6
            echo "tccd lines: $(wc -l < "$logf" | tr -d ' ')"
          }
          for c in m1bare m2late m3sealed; do one "$c" "<string>$here/$c/probe</string>" ""; done
          one m5holder "<string>$here/m5/core/hided</string><string>--detach</string><string>$here/m5/holder/hide-holder</string><string>--reexec-disclaim</string><string>$here/m5/holder/hide-holder</string><string>--spawn</string><string>$here/m5/prog/prog</string>" "<key>PROBE_SLEEP</key><string>4</string>"
          echo "jobs left: $(/bin/launchctl list | grep -c m94probe || true)"
