# Manual unsigned preparation, with the phone site deployed first. No tag,
# release or signing credential is written here; a consumer must verify this successful main run and receipt,
# and that the verify run the receipt names concluded success, which this
# workflow waits to start but not to finish.
name: release candidate
run-name: Candidate ${{ inputs.tag }} from ${{ inputs.public_sha }}

on:
  workflow_dispatch:
    inputs:
      public_sha:
        description: Full public main commit whose verify push run is pending, running or passed.
        required: true
        type: string
      tag:
        description: Candidate version, vX.Y.Z or vX.Y.Z-rc.N (no tag is created).
        required: true
        type: string
      verification_run_id:
        description: The pr.yml push/main run of exactly public_sha, pending, running or passed.
        required: true
        type: string
      build_order:
        description: Positive safe integer used by every package of this candidate.
        required: true
        type: string
      macos_runner:
        description: Where the Mac binaries compile; hosted is GitHub's macos-15, for when the Mac mini does not answer.
        type: choice
        options: [mini, hosted]
        default: mini

permissions:
  contents: read
  actions: read

concurrency:
  group: release-candidate-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    # Up to 45 minutes waiting for a pending verify run to start, and the checks.
    timeout-minutes: 50
    outputs:
      receipt: ${{ steps.source.outputs.receipt }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require the exact main source and its started verify run
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLIC_SHA: ${{ inputs.public_sha }}
        run: |
          # Reads the verify run named by the inputs, waiting while it is
          # pending behind another main run, and checks every input before it
          # reaches a build.
          node scripts/release-candidate.mjs source > "$RUNNER_TEMP/candidate.json"
          git merge-base --is-ancestor "$PUBLIC_SHA" origin/main
          echo "receipt=$(cat "$RUNNER_TEMP/candidate.json")" >> "$GITHUB_OUTPUT"
      - name: Require the build steps the source was verified with
        env:
          PUBLIC_SHA: ${{ inputs.public_sha }}
        run: |
          # The called workflows' steps come from this dispatch revision but
          # run on public_sha's checkout, so a step added after public_sha
          # would reach files the source does not have.
          if ! git diff --quiet "$PUBLIC_SHA" HEAD -- .github/workflows/package.yml .github/workflows/device-helpers.yml .github/workflows/agent-journey.yml scripts/phone-release.mjs; then
            echo "::error::candidate build or phone deployment steps changed on main after $PUBLIC_SHA; choose a newer public_sha"
            exit 1
          fi

  phone:
    name: publish phone bundle
    needs: validate
    if: ${{ github.repository == 'with-hide/hide' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: phone-production
    # All versions share the read/retain/upload boundary. Never cancel an upload.
    concurrency:
      group: phone-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.public_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Require main CI and the phone deployment secrets
        env:
          PHONE_VERCEL_TOKEN: ${{ secrets.PHONE_VERCEL_TOKEN }}
          PHONE_VERCEL_ORG_ID: ${{ secrets.PHONE_VERCEL_ORG_ID }}
          PHONE_VERCEL_PROJECT_ID: ${{ secrets.PHONE_VERCEL_PROJECT_ID }}
        run: node scripts/phone-release.mjs check
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10
      - name: Build this source's phone bundle
        run: |
          bash scripts/verify-web.sh install
          bash scripts/verify-web.sh web build:phone
      - name: Retain every published protocol and stage the new bundle
        env:
          PUBLIC_SHA: ${{ inputs.public_sha }}
          PHONE_VERCEL_TOKEN: ${{ secrets.PHONE_VERCEL_TOKEN }}
          PHONE_VERCEL_ORG_ID: ${{ secrets.PHONE_VERCEL_ORG_ID }}
          PHONE_VERCEL_PROJECT_ID: ${{ secrets.PHONE_VERCEL_PROJECT_ID }}
        run: node scripts/phone-release.mjs prepare "$PUBLIC_SHA" web/phone-dist agents/runs/phone-release
      - name: Upload only the CI-built static site
        timeout-minutes: 10
        env:
          PHONE_VERCEL_TOKEN: ${{ secrets.PHONE_VERCEL_TOKEN }}
        run: npx --yes vercel@65.10.0 deploy --prebuilt --prod --yes --cwd agents/runs/phone-release --token "$PHONE_VERCEL_TOKEN"
      - name: Require the production bytes and security policy before releasing
        run: node scripts/phone-release.mjs confirm agents/runs/phone-release

  packages:
    needs: [validate, phone]
    uses: ./.github/workflows/package.yml
    with:
      version: ${{ inputs.tag }}
      source-sha: ${{ inputs.public_sha }}
      build-order: ${{ inputs.build_order }}
      web-typechecked: true
      include-macos: false
      macos-signing: adhoc

  # The Mac release binaries the private publisher assembles, signs and
  # notarizes (docs/BUILD.md, The candidate's Mac build). The Mac mini runs
  # them under an account of its own, and its job-started hook refuses every
  # job but this workflow's dispatched on main, so no pull request, fork or
  # branch reaches it; nothing else names its label. Either runner builds the
  # same binaries, which the receipt checks the same way.
  macos-binaries:
    name: compile (macos)
    needs: [validate, phone]
    runs-on: ${{ inputs.macos_runner == 'hosted' && fromJSON('["macos-15"]') || fromJSON('["self-hosted","macOS","ARM64","hide-candidate"]') }}
    timeout-minutes: 60
    env:
      HIDE_POSTHOG_PROJECT_TOKEN: ${{ vars.HIDE_POSTHOG_PROJECT_TOKEN }}
      HIDE_VERSION: ${{ inputs.tag }}
      HIDE_BUILD_ORDER: ${{ inputs.build_order }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.public_sha }}
          persist-credentials: false
      # Node first: the Mac mini's account has no Node of its own, and
      # pnpm/action-setup installs pnpm with npm.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v6
        with:
          version: 10
          # pnpm keeps its store beside itself (PNPM_HOME), so both stay in
          # the work folder the Mac mini empties after every job.
          dest: ${{ runner.tool_cache }}/setup-pnpm
      # tomllib needs Python >=3.11. setup-python's macOS distribution needs
      # a fixed path outside this runner's cleanup boundary; use managed Python.
      - name: Prepare Python for the relay WASM build
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        timeout-minutes: 5
        env:
          UV_PYTHON_INSTALL_DIR: ${{ runner.temp }}/candidate-python
          UV_CACHE_DIR: ${{ runner.temp }}/candidate-uv-cache
          UV_PYTHON_PREFERENCE: only-managed
        with:
          # Keep a version whose download checksums are embedded in this action.
          version: "0.10.10"
          python-version: "3.12"
          enable-cache: false
          activate-environment: true
          venv-path: ${{ runner.temp }}/candidate-python-venv
          tool-bin-dir: ${{ runner.temp }}/candidate-uv-bin
      - name: Require Python with standard TOML support
        run: python3 -c 'import sys, tomllib; assert sys.version_info >= (3, 11)'
      # The relay WebAssembly's binding tool, restored never saved here (`.github/actions/relay-tools`).
      - uses: ./.github/actions/relay-tools
        with:
          save: false
      - name: Install dependencies
        timeout-minutes: 5
        run: |
          echo "pnpm store: $(pnpm store path)"
          bash scripts/verify-web.sh install
      # hide-vt's Zig inputs and caches for the pane holder, which the vt
      # lane saves.
      - uses: ./.github/actions/vt-cache
        with:
          save: false
      - name: Build the web shell and the release binaries
        timeout-minutes: 50
        run: bash scripts/verify-web.sh desktop package compile
      - uses: actions/upload-artifact@v7
        with:
          name: hide-macos-release-binaries
          path: |
            target/release/hided
            target/release/hide
            target/release/hide-agent-hooks
            target/release/hide-holder
            desktop/out/release-binaries.json
          if-no-files-found: error
          retention-days: 7

  agent-journey:
    needs: validate
    uses: ./.github/workflows/agent-journey.yml
    permissions:
      contents: read
    with:
      source-sha: ${{ inputs.public_sha }}
      systems: '["linux","macos","windows"]'
      fake: true

  # The receipt records the builds and does not wait for the journey, which
  # uploads none of the artifacts a release takes: a journey-only failure is
  # retried with "Re-run failed jobs" without making this receipt or any
  # build again, so every artifact the publisher takes stays one attempt's.
  # The run, which the publisher requires to succeed, still needs the journey.
  receipt:
    needs: [validate, phone, packages, macos-binaries]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The dispatch revision, as in validate: the receipt is written by main's
      # checker, never by the source it describes.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The kits `device bundles` made, and the builds it made them from, at
      # the paths it read them (desktop/scripts/device-helpers.mjs,
      # candidateKitSources), so every kit program is checked against the
      # build recorded for this source, version and order.
      - uses: actions/download-artifact@v8
        with:
          name: hide-device-bundles
          path: agents/runs/release-candidate/kits/device-bundles
          digest-mismatch: error
      - uses: actions/download-artifact@v8
        with:
          name: hide-device-helper-linux-x86_64
          path: agents/runs/release-candidate/kits/device-helpers/linux-x86_64
          digest-mismatch: error
      - uses: actions/download-artifact@v8
        with:
          name: hide-device-helper-linux-aarch64
          path: agents/runs/release-candidate/kits/device-helpers/linux-aarch64
          digest-mismatch: error
      - uses: actions/download-artifact@v8
        with:
          name: hide-windows-release-binaries
          path: agents/runs/release-candidate/kits/windows-compile
          digest-mismatch: error
      - uses: actions/download-artifact@v8
        with:
          name: hide-macos-release-binaries
          path: agents/runs/release-candidate/macos-binaries
          digest-mismatch: error
      - name: Record the candidate's source, its device kits and its Mac binaries
        env:
          RECEIPT: ${{ needs.validate.outputs.receipt }}
        run: |
          printf '%s\n' "$RECEIPT" > "$RUNNER_TEMP/source.json"
          node scripts/release-candidate.mjs builds "$RUNNER_TEMP/source.json" agents/runs/release-candidate/kits agents/runs/release-candidate/macos-binaries > agents/runs/release-candidate/candidate.json
          echo 'Signed-in providers: not measured on CI; the release measures them on the Mac. Fixture and fake-model checks run beside this receipt, and the run succeeds only when they pass.' >> "$GITHUB_STEP_SUMMARY"
          echo 'The verify run this receipt names was not awaited; the publish requires that it concluded success.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: hide-release-candidate
          path: agents/runs/release-candidate/candidate.json
          if-no-files-found: error
          retention-days: 7
