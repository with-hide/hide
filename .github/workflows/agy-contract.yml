# agy (the Antigravity CLI) on the systems Hide supports it on (PRD
# antigravity-first-class B34, B36).
#
# Each leg runs the agy tests of the crates that write agy's files, read its
# conversations and drive it for Hide AI against stand-ins and fixtures, then
# installs the agy `contracts/agent-clis.json` pins into the runner and checks
# that the real binary reads the `hide` block Hide writes, in the runner's
# throwaway home; the daily agent canary measures agy's latest release.
# A pull request runs Windows (`pr.yml`, the `agy-contract` lane), where the
# hook commands and the install folder differ; `rust` runs the same tests on
# Linux, and `nightly.yml` runs the whole contract on all three systems.
#
# A signed-in agy is not measured on CI (operator decision, 2026-10-27): a
# login proves the provider's sign-in and quota, not Hide's code.
name: agy contract

on:
  workflow_call:
    inputs:
      systems:
        description: The systems to run, as a JSON array of `linux`, `macos` and `windows`.
        type: string
        required: true

# `issues: write` files a flaky test; a caller must grant it.
permissions:
  contents: read
  issues: write

jobs:
  contract:
    name: agy contract (${{ matrix.system }})
    runs-on: ${{ fromJSON('{"linux":"ubuntu-latest","macos":"macos-15","windows":"windows-latest"}')[matrix.system] }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        system: ${{ fromJSON(inputs.systems) }}
    defaults:
      run:
        shell: bash
    env:
      # One package and target list for every step, so cargo resolves features
      # once and builds the test binaries once.
      TEST_TARGETS: -p hide-agent-hooks -p hide-session -p hide-ai -p hide-kit --lib --bin hide-agent-hooks --test it
      # The installer needs Python 3.12; Windows names it python.
      PYTHON: ${{ matrix.system == 'windows' && 'python' || 'python3' }}
    steps:
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        if: runner.os == 'Windows'
        timeout-minutes: 5
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install cargo-nextest
        timeout-minutes: 3
        run: bash scripts/install-nextest.sh
      - name: Build the test binaries
        timeout-minutes: 25
        run: bash scripts/verify-cargo.sh nextest --profile ci $TEST_TARGETS --no-run
      - name: agy's hook block, trust, skills, conversations and Hide AI backend
        # Install and removal in a fixture home, the hook commands (`cmd /c`
        # on Windows), the conversation readers against agy's recorded files,
        # and, on Linux and macOS, the Hide AI backend against a stand-in agy
        # (`hide-ai/tests/it/text_clis.rs` is Unix only).
        timeout-minutes: 10
        run: bash scripts/verify-cargo.sh nextest --profile ci $TEST_TARGETS -E 'test(/antigravity|agy/)'
      - name: Install the pinned agy
        id: agy
        timeout-minutes: 5
        run: '"$PYTHON" scripts/install-agent-clis.py agy'
      - name: The real agy reads Hide's hook block
        timeout-minutes: 5
        env:
          HIDE_AGY_BINARY: ${{ steps.agy.outputs.agy }}
        run: bash scripts/verify-cargo.sh nextest --profile ci $TEST_TARGETS -E 'test(=agy_binary::the_real_agy_loads_hide_s_hook_block)' --run-ignored only --no-capture
      - name: Report flaky and failed tests
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci-flaky-report.py --suite rust --junit target/nextest/ci/junit*.xml

