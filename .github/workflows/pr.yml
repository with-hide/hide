# Every pull request, every merge queue group and every push to main runs this
# workflow, and nightly calls it; the single `verify` job is what branch
# protection and the merge queue require. Adding
# a lane means adding it to `scripts/ci-plan.py`'s LANES and to `verify`'s
# `needs`; the protection rule never changes.
#
# The `plan` job classifies the paths a pull request changes into the lanes it
# needs (`scripts/ci-plan.py`; docs/TESTING.md, "Which lanes a pull request
# runs", owns the rules). Each lane runs when the plan names it, and `verify`
# passes only when every planned lane succeeded and every other lane was
# skipped, so a lane whose `if:` is wrong fails `verify` rather than passing
# it. A push to main, a comparison that cannot be computed, and a path no rule
# claims plan every lane; main's full run is the net under a lane a pull
# request left out. Nightly owns agy and the journey directly, leaving their
# internal lanes out of its call; a lane it fails opens a `nightly-failure` issue, which a failed push run does not.
#
# A pull request whose last green run still stands reruns `policy` and any
# changed registered desktop unit tests: what it adds to main changed since that run
# only in these paths, and main changed none of the paths it changes that a
# lane reads. The plan job finds that run and the plan record each pull request run keeps as
# the `ci-plan` artifact, which is why it reads actions; a lookup, fetch or
# comparison that fails plans as usual.
#
# A draft pull request runs the `plan` job and `verify` only: the lanes wait
# for the pull request to be marked ready for review, and `verify` fails with
# "draft: lanes not run" until then. It must fail rather than be skipped: a
# skipped required check counts as passed, and `verify` waits on the lanes, so
# right after the pull request is marked ready the draft run's skipped `verify`
# would be the only check on that commit and the pull request could merge before
# the ready run's lanes start. A failed `verify` blocks it until that run ends.
#
# Each gate here has a local command in CONTRIBUTING.md under "CI gates".
#
# A merge queue group plans `policy`, `merge-rust` and `merge-web` and nothing
# else, the checks where two changes that each passed fail together without a
# conflict (`scripts/ci-plan.py`, MERGE_GROUP_LANES; CONTRIBUTING.md, Merging
# into main). No other run plans the last two.
#
# Runner placement is a capacity decision. This organization's plan runs 60
# jobs at once and five of them on macOS across every repository, and on
# 2026-09-28 one run held all five for 26 minutes, so a second pull request
# waited up to 70 minutes before its lanes started. A pull request therefore
# takes a macOS runner only when it changes a macOS path (`scripts/ci-plan.py`,
# MACOS_PATHS and MACOS_CODE: the macOS forms of `hide-platform` and the
# desktop host, the packaged macOS app's scripts and resources, hide-vt's Zig
# build and the CI that defines these jobs; operator decision
# 2026-11-01, docs/TESTING.md, Where the macOS runners went). Such a pull
# request runs the macOS jobs its paths plan: `desktop e2e`, `os
# contract (macos)`, and the macOS legs of `vt`, `holder restart`, `omp SDK`
# and `package` (`plan`'s `macos` output). Every other pull request, a web shell change
# included, runs none, and main's push run and the nightly run them all; a
# macOS-only failure there does not stop merges but is fixed before the next
# release (CONTRIBUTING.md, When main's push run fails).
# `vt`, `omp SDK` and `compile (macos)`, which need no screen, keychain or
# login session, run on the operator's Mac mini instead when the repository
# variable HIDE_MACOS_CI_RUNNER names it, except for a fork's pull request
# (`plan`'s `self-hosted-macos` output; docs/BUILD.md, The Mac mini CI runner).
# `nightly.yml` runs the macOS web `@platform` tests, the macOS mailbox lane
# and the performance lane, which no `pr.yml` run starts.
# Everything else runs on Linux: the Rust suite, the unit suites, the invariant
# checks, the whole web end-to-end, dealt out to six shards by `web-e2e.yml`,
# and the remote mailbox lane over private SSH (`remote-mailbox`, and on a
# Linux ARM64 runner `remote-mailbox-arm`).
# `nightly.yml` runs the web end-to-end's `@platform` tests on macOS, and the
# rest of the web end-to-end is the same code on every system, so the move of
# the web end-to-end costs no macOS coverage, only its delay. On Windows, `windows check`
# compiles the workspace and runs the daemon's and the app's suites there,
# beside the OS contract's Windows leg (issue #293), `windows e2e` runs the
# browser `@platform` tests, and `windows desktop` the Electron app's
# `@platform` tests (`desktop-e2e.yml`, the workflow the macOS `desktop e2e`
# lane calls too).
#
# Short jobs are merged because each job costs a runner start, a checkout and a
# place in the queue: one `checks` job runs the web shell's and the desktop
# app's typecheck, lint and unit suites, and `web-e2e.yml` fetches zsh in its
# build job and deals the shards from a fixed list. docs/TESTING.md counts the
# jobs of a run.
#
# A flaky test does not fail a lane. CI retries a failed test once, Playwright
# for the end-to-end suites and cargo-nextest for the Rust workspace; a test
# that passes the retry is flaky, the lane passes, and
# scripts/ci-flaky-report.py files it as an issue with a seven-day deadline
# (docs/TESTING.md, "Flaky tests"). A test that fails twice fails the lane.
#
# Every job and every long step has a timeout to bound a stalled required check.
name: verify

on:
  pull_request:
    # `ready_for_review` starts the run that plans and runs the lanes; `edited`
    # reruns the body's checks (`policy` alone when the last green run stands).
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: [main]
  merge_group:
  # nightly.yml runs every lane once a day, with agent checks owned there.
  workflow_call:
    inputs:
      nightly-agent-checks:
        description: Nightly owns agy and the complete journey in its direct jobs.
        type: boolean
        default: false
    # The development issues App's key (docs/TESTING.md, Flaky tests). A run
    # without it, such as a fork's, files no issue and passes as before.
    secrets:
      HIDE_ISSUES_APP_KEY:
        required: false

permissions:
  contents: read

# A new push to a pull request replaces that pull request's run; a body edit
# waits for it instead, since the lanes it would cancel are the ones its plan
# reuses. Main's runs
# are not cancelled once they start: each merge's full run is the net under the
# lanes a plan left out. GitHub keeps one pending run per group, so in a burst
# of merges a newer run replaces the pending one and checks their combined
# state. A called run takes its caller's name (`nightly`), so it never replaces
# a push run's place.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'edited' }}

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # This pull request's earlier runs and the plan records they kept.
      actions: read
    outputs:
      lanes: ${{ steps.plan.outputs.lanes }}
      full: ${{ steps.plan.outputs.full }}
      rust-packages: ${{ steps.plan.outputs.rust-packages }}
      # Whether this run takes a macOS runner: `true` for main's push run, the
      # nightly and a pull request that changes a macOS path
      # (`scripts/ci-plan.py`, MACOS_PATHS); otherwise the plan leaves the
      # macOS-only lanes out and the lanes below run without their macOS leg.
      macos: ${{ steps.plan.outputs.macos }}
      # Where `vt`, `omp SDK contract` and `compile (macos)` run their macOS
      # job: the repository variable HIDE_MACOS_CI_RUNNER, a JSON `runs-on`
      # value naming the Mac mini's CI runner (docs/BUILD.md, The CI runner
      # on the Mac mini), or empty for GitHub's hosted runner, which
      # each of those workflows names as its default. A pull request from
      # another repository never gets the variable, so a fork's code never
      # reaches the self-hosted runner; unsetting the variable turns the
      # runner off for every run.
      self-hosted-macos: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.HIDE_MACOS_CI_RUNNER || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          # A pull request checks out its merge commit, whose first parent is
          # the base it merges into; the plan compares the two, and fetches
          # the history it needs to compare with an earlier green run.
          fetch-depth: 2
      - name: Choose the lanes this change needs
        id: plan
        # The crate graph comes from `cargo metadata`, which needs no build.
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci-plan.py plan --event "$GITHUB_EVENT_NAME" --draft "${{ github.event.pull_request.draft || false }}" --nightly-agent-checks "${{ inputs.nightly-agent-checks || false }}" --record ci-plan.json
      # The commits this run's lanes checked, for the pull request's next run.
      # Without it the next run plans its lanes as usual, so a failed upload
      # leaves this run's plan standing.
      - name: Keep the plan record
        if: github.event_name == 'pull_request' && steps.plan.outputs.draft != 'true'
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/upload-artifact@v7
        with:
          name: ci-plan
          path: ci-plan.json
          if-no-files-found: error
          overwrite: true

  policy:
    name: policy checks
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.lanes), 'policy')
    runs-on: ubuntu-latest
    # About 4 minutes of checks plus the zsh install's 6-minute backstop,
    # with a margin; a cache hit installs in seconds.
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          # The merge commit and the base it merges into, for the paths a
          # pull request changes.
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install zsh
        # The invariant scripts are zsh; the image has bash.
        timeout-minutes: 6
        uses: ./.github/actions/apt-install
        with:
          packages: zsh
          minutes: 3
      # A merge group runs the structural checks below and not the script
      # suite, which takes about two minutes and checks the scripts each pull
      # request already ran it on; main's push run runs it on the merge.
      - name: Test the repository scripts, the lane plan included
        if: github.event_name != 'merge_group'
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: Structural checks
        run: |
          bash scripts/check-harness-ignore-anchor.sh
          bash scripts/check-capability-readers-off-lock.sh
          bash scripts/check-no-workstation-identity.sh
          bash scripts/check-worktree-removal-boundary.sh
          python3 scripts/check-core-touches-no-machine.py
          python3 scripts/check-ai-prompt-language.py
          python3 scripts/check-agent-screen-rules.py
          python3 scripts/check-device-kits-single-source.py
          bash scripts/check-agent-folders.sh

      # Reads the pull request's body, which no merge group carries, so a merge
      # group's `policy` leaves it out.
      - name: A pull request that changes a screen shows it
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"
          python3 scripts/check-pr-screenshots.py --pr-body "$RUNNER_TEMP/pr-body.md" --range HEAD^1..HEAD

  rust:
    name: rust workspace
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.lanes), 'rust')
    runs-on: ubuntu-latest
    # The job's usual time (14 to 18 minutes, 17m47s on #2197) plus the
    # shell install's 7-minute backstop, 25, with a minute of margin. The
    # install ends inside its own 4 minutes on a slow mirror and takes seconds
    # on a cache hit, so the mirror cannot take the job past this limit.
    timeout-minutes: 26
    permissions:
      contents: read
    env:
      FULL: ${{ needs.plan.outputs.full }}
      PACKAGES: ${{ needs.plan.outputs.rust-packages }}
    steps:
      - uses: actions/checkout@v7
      # hide-agent-hooks runs Hide's OpenCode plugin under Node in its tests
      # (`tests/it/opencode_plugin.rs`), and the pane holder's screen tests
      # draw on a headless xterm under Node; the version is pinned, not the
      # image's.
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The shells the real-shell tests below run in, installed first so a slow
      # Ubuntu mirror fails here, by name and inside 4 minutes, before any
      # test time is spent. The .deb files are cached, so a usual run does not
      # ask the mirror (.github/actions/apt-install).
      - name: Install the real shells
        if: ${{ env.FULL == 'true' || contains(fromJSON(env.PACKAGES), 'hide-core') || contains(fromJSON(env.PACKAGES), 'hide-host') || contains(fromJSON(env.PACKAGES), 'hide-node') }}
        timeout-minutes: 7
        uses: ./.github/actions/apt-install
        with:
          packages: zsh fish tcsh csh
          minutes: 4
      - name: Install the holder tests' xterm
        timeout-minutes: 3
        run: bash scripts/verify-web.sh install holder
      # Linux's one saver of the workspace set: it builds every member's tests,
      # the most of any Linux job (docs/BUILD.md, "CI's Rust caches").
      - uses: ./.github/actions/rust-cache
        with:
          set: workspace
          save: ${{ github.ref == 'refs/heads/main' }}
      # hide-vt's Zig inputs and caches, which the vt lane saves.
      - uses: ./.github/actions/vt-cache
        with:
          save: false
      # rustfmt and Clippy come with the version `rust-toolchain.toml` names,
      # which rustup installs on the job's first `rustc` or `cargo` call; the
      # image's own toolchain is never used. A full plan covers the whole
      # workspace; otherwise the plan names the changed crates and every crate
      # that depends on them.
      - name: Install cargo-hakari
        # The pinned release build, checked against its digest, so no compile.
        timeout-minutes: 3
        run: bash scripts/install-hakari.sh
      - name: Check the shared feature set
        # workspace-hack holds the features the manifests ask for and every
        # member that should depends on it; when it does not, each cargo
        # command that selects other members builds dependencies again
        # (docs/BUILD.md, "One feature set per dependency").
        run: bash scripts/verify-cargo.sh hakari
      - name: Check formatting and lint the planned crates
        run: |
          if [ "$FULL" = true ]; then
            bash scripts/verify-cargo.sh lint
          else
            mapfile -t packages < <(jq -r '.[] | "-p", .' <<<"$PACKAGES")
            (( ${#packages[@]} )) || { echo 'the plan chose the rust lane but no crate' >&2; exit 1; }
            bash scripts/verify-cargo.sh fmt-check
            bash scripts/verify-cargo.sh clippy "${packages[@]}" --all-targets -- -D warnings
          fi
      - name: Install cargo-nextest
        # The pinned release build, so no compile. `.config/nextest.toml` holds
        # the `ci` profile: one retry, and a JUnit report.
        timeout-minutes: 3
        run: bash scripts/install-nextest.sh
      - name: Test the planned crates
        # hide-ai drives its codex backend against a python fake app server.
        # nextest runs no doc test; the workspace has none that runs.
        run: |
          if [ "$FULL" = true ]; then
            bash scripts/verify-cargo.sh nextest --profile ci --workspace
          else
            mapfile -t packages < <(jq -r '.[] | "-p", .' <<<"$PACKAGES")
            (( ${#packages[@]} )) || { echo 'the plan chose the rust lane but no crate' >&2; exit 1; }
            bash scripts/verify-cargo.sh nextest --profile ci "${packages[@]}"
          fi
      - name: Shell integration and agent start in real shells
        # hide-host/src/shell_integration/real_shell_tests.rs: zsh, bash and
        # fish read the user's files in their order, zsh gives ZDOTDIR back,
        # and the mark comes after them. hide-core's
        # engine/own/shell_line.rs: zsh, bash and fish run the resume line
        # the core's own engine types after a reboot. hide-core's
        # engine/contract.rs: the core's own engine over pane holders started
        # from the built holder meets the engine contract.
        # hide-node's ssh/bootstrap_tests.rs: the one remote command a device's
        # ssh runs starts the start script in zsh, bash, fish, tcsh and BSD csh
        # login shells.
        if: ${{ !cancelled() && (env.FULL == 'true' || contains(fromJSON(env.PACKAGES), 'hide-core') || contains(fromJSON(env.PACKAGES), 'hide-host') || contains(fromJSON(env.PACKAGES), 'hide-node')) }}
        timeout-minutes: 15
        run: |
          export HIDE_TEST_ZSH_BIN=$(command -v zsh) HIDE_TEST_FISH_BIN=$(command -v fish) HIDE_TEST_BASH_BIN=$(command -v bash)
          export HIDE_TEST_TCSH_BIN=$(command -v tcsh) HIDE_TEST_CSH_BIN=$(command -v bsd-csh)
          bash scripts/verify-cargo.sh nextest --profile ci -p hide-node --lib -E 'test(=ssh::host::bootstrap::tests::the_remote_command_starts_the_script_in_every_login_shell)' --run-ignored only --no-capture
          bash scripts/verify-cargo.sh build -p hide-holder --bin hide-holder
          export HIDE_TEST_HOLDER_BIN=$PWD/target/debug/hide-holder
          bash scripts/verify-cargo.sh nextest --profile ci -p hide-host -p hide-core --lib -E 'test(/^shell_integration::real_shell_tests::/) | test(/^engine::own::shell_line::real_shell_tests::/) | test(/^engine::contract::/)' --run-ignored only --no-capture
      - name: Every gh command line on the oldest gh Hide supports
        # hide-host/src/gh.rs: each command line the node runs `gh` with
        # parses on `MINIMUM_VERSION` (hide-node-link/src/gh.rs), which
        # scripts/fetch-gh.sh downloads against its pinned digest; a proxy
        # that refuses every connection keeps every line off GitHub.
        if: ${{ !cancelled() && (env.FULL == 'true' || contains(fromJSON(env.PACKAGES), 'hide-host')) }}
        timeout-minutes: 10
        run: |
          gh_bin=$(bash scripts/fetch-gh.sh "$RUNNER_TEMP/gh-minimum")
          HIDE_TEST_GH_BIN=$gh_bin bash scripts/verify-cargo.sh nextest --profile ci -p hide-host --lib -E 'test(=gh::tests::every_command_line_parses_on_the_oldest_gh_hide_supports)' --run-ignored only --no-capture
      - name: Mint the development issues token
        # Development issues live in with-hide/hide-private (docs/TESTING.md,
        # Flaky tests); one App token reads this run here and files there. A run
        # without the App's key, such as a fork's, files nothing and stays green.
        id: issues-token
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.HIDE_ISSUES_APP_CLIENT_ID }}
          private-key: ${{ secrets.HIDE_ISSUES_APP_KEY }}
          owner: with-hide
          repositories: hide,hide-private
      - name: Report flaky and failed tests
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ steps.issues-token.outputs.token }}
        run: python3 scripts/ci-flaky-report.py --suite rust --junit target/nextest/ci/junit*.xml

  checks:
    name: web and desktop checks
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.lanes), 'checks')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      # The relay WebAssembly's binding tool, which the web scripts build with.
      - uses: ./.github/actions/relay-tools
        with:
          save: false
      - name: Install dependencies
        id: install
        run: bash scripts/verify-web.sh install
      - name: Web shell typecheck, lint, unit test, and build
        # build includes typecheck; run it once, before the other checks.
        run: |
          bash scripts/verify-web.sh web build
          bash scripts/verify-web.sh web lint
          bash scripts/verify-web.sh web test
      - name: Desktop app typecheck, lint, and unit test
        # The menu is built from the web registry, so the plan brings this
        # lane for a registry change too. It stands on its own, so it runs
        # whatever the step above answered, but not after a failed install.
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          bash scripts/verify-web.sh desktop typecheck
          bash scripts/verify-web.sh desktop lint
          bash scripts/verify-web.sh desktop test
      - name: iOS app host unit test
        # The app bundle assembler: its digest and content-policy checks.
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bash scripts/verify-web.sh mobile test

  # What differs on Windows (issue #293), as a required lane: the whole
  # workspace compiles for Windows, hided's pane bootstrap and end-to-end
  # tests pass there, `hide connect` starts and `hide stop` ends the hided
  # beside it (what the desktop app does first), the agent hook entries run
  # through PowerShell as Claude Code and Codex run them, the core's own
  # engine meets its contract in Windows PowerShell, and the web and desktop
  # unit suites. Warm-cache jobs took
  # 4-8 minutes on 2026-10-03; a cold run compiles the workspace from
  # nothing. The browser `@platform` tests are `windows-e2e` below, so a change
  # that needs the compile does not also wait for a browser, and the reverse.
  windows-check:
    name: windows check
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.lanes), 'windows-check')
    runs-on: windows-latest
    timeout-minutes: 50
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      # Every Rust test step below names these same packages and targets and
      # picks its tests with `-E`, so cargo resolves features once and the
      # test binaries are built once, in `Build the Windows test binaries`.
      # When each step named only its own package, each resolved features
      # differently and rebuilt the crates under it: hide-core compiled three
      # times and compiling took about 6 of the job's 11 minutes (2026-10-05).
      TEST_TARGETS: >-
        -p hided -p hide-host -p hide-node -p hide-kit -p hide-agent-hooks -p hide-core -p hide-ai
        -p hide-agent-adapter -p hide-desk -p hide-shell -p hide-session
        --lib --bin hide-agent-hooks --test it
    steps:
      - name: Keep line endings as committed
        # The runner converts to CRLF by default, which would make the unit
        # suites report line endings instead of code.
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      # Windows's one saver of the workspace set, the most any Windows job builds.
      - uses: ./.github/actions/rust-cache
        with:
          set: workspace
          save: ${{ github.ref == 'refs/heads/main' }}
      # hide-vt's Zig inputs and caches, which the vt lane saves.
      - uses: ./.github/actions/vt-cache
        with:
          save: false
      - name: Install cargo-nextest
        # The Rust tests below run under nextest's `ci` profile (one retry).
        timeout-minutes: 3
        run: bash scripts/install-nextest.sh
      - name: Compile the workspace for Windows
        run: bash scripts/verify-cargo.sh check --workspace --all-targets --keep-going --message-format short
      - name: Build the Windows test binaries
        id: tests
        # Built whatever the workspace check answered, so a compile error in
        # one target does not hide the tests that still build.
        if: ${{ !cancelled() }}
        timeout-minutes: 25
        run: bash scripts/verify-cargo.sh nextest --profile ci $TEST_TARGETS --no-run
      - name: hided's pane bootstrap, file opener, root identity, its roles, the device node's pane service, the CLI's daemon start and end-to-end tests
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        timeout-minutes: 25
        run: |
          bash scripts/verify-cargo.sh nextest --profile ci $TEST_TARGETS -E 'package(hided) & kind(lib) & (test(pane_auth) | test(opener) | test(open_command) | test(workspace_cli) | test(root_identity_is_the_one_the_node_reads) | test(/^role::/))'
          bash scripts/verify-cargo.sh nextest --profile ci $TEST_TARGETS -E 'binary_id(hided::it) & test(/^arguments::/)'
          bash scripts/verify-cargo.sh nextest --profile ci $TEST_TARGETS -E 'package(hide-node) & kind(lib)'
          bash scripts/verify-cargo.sh nextest --profile ci $TEST_TARGETS -E 'binary_id(hided::it) & test(/^opener_lifecycle::/)'
          bash scripts/verify-cargo.sh nextest --profile ci $TEST_TARGETS -E 'binary_id(hided::it) & test(/^connect_stop::/)'
          bash scripts/verify-cargo.sh nextest --profile ci $TEST_TARGETS -E 'binary_id(hided::it) & test(/^handshake::/)'
          bash scripts/verify-cargo.sh nextest --profile ci $TEST_TARGETS -E 'binary_id(hided::it) & test(/^mobile_relay::/)'
          bash scripts/verify-cargo.sh nextest --profile ci $TEST_TARGETS -E 'binary_id(hided::it) & test(/^agent_exec::/)'
      - name: A device's Herdr copy a server runs is kept, and its kit follows the device's home
        # The kit judges a copy's use by the files a process holds in it on
        # Windows, never by the image paths it could read, and finds its home
        # in USERPROFILE, never in the HOME OpenSSH sets beside it
        # (hide-host/src/kit.rs).
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        timeout-minutes: 10
        run: bash scripts/verify-cargo.sh nextest --profile ci $TEST_TARGETS -E 'package(hide-host) & kind(lib) & (test(=kit::tests::an_older_herdr_copy_stays_while_a_process_runs_it_and_goes_once_none_does) | test(=kit::tests::every_kit_location_follows_the_home_the_platform_names))'
      - name: Each agent's account folders, from its definition's [account]
        # `resolve`'s contract (hide-agent-adapter/tests/it/account.rs): a
        # folder is absolute only in Windows' forms, variable names compare
        # regardless of case, and each place joins with Windows' separator.
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        timeout-minutes: 10
        run: bash scripts/verify-cargo.sh nextest --profile ci $TEST_TARGETS -E 'binary_id(hide-agent-adapter::it) & test(/^account::/)'
      - name: A profile's account folder is private
        # PRD agent-profiles D-36: the node makes a profile's account folder
        # private, which Windows judges by the folder's access list, not a
        # mode (hide-host/src/profiles.rs), and reads a session only in an
        # account it registered, a folder or one of omp's named profiles,
        # spelled as Windows spells a path (hide-session/src/account.rs).
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        timeout-minutes: 10
        run: bash scripts/verify-cargo.sh nextest --profile ci $TEST_TARGETS -E 'package(hide-host) & kind(lib) & test(/^profiles::tests::/)'
      - name: A session is read only in registered accounts
        # Run even when the separate folder check failed, so a failed host
        # assertion cannot hide a session-reader portability gap.
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        timeout-minutes: 10
        run: bash scripts/verify-cargo.sh nextest --profile ci $TEST_TARGETS -E '(binary_id(hide-session::it) & test(/^session_account::/)) | (package(hide-session) & kind(lib) & test(/^account::/))'
      - name: Retiring Hide's old Home removes only what its marker lists
        # An old Windows Home held no link (every process of an ssh session
        # refuses a junction no administrator made), only the guide and the
        # import file, which the retirement removes by their content
        # (hide-host/src/home.rs).
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        timeout-minutes: 10
        run: bash scripts/verify-cargo.sh nextest --profile ci $TEST_TARGETS -E 'package(hide-host) & kind(lib) & test(/^home::tests::/)'
      - name: The weekly usage child's environment
        # The `/usage` child is started with a restricted environment, which
        # on Windows has to carry what Node and the CLI need to start, and the
        # reset time it prints is read through a tz database Windows lacks.
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        timeout-minutes: 10
        run: |
          bash scripts/verify-cargo.sh nextest --profile ci $TEST_TARGETS -E 'binary_id(hide-ai::it) & test(/^claude_cli::usage::/)'
          bash scripts/verify-cargo.sh nextest --profile ci $TEST_TARGETS -E 'package(hide-core) & kind(lib) & (test(zoneinfo::) | test(usage::tests))'
      - name: Native session original repository paths
        # Windows agents record native separators; the owning node must
        # answer catalog-compatible paths without certifying old history.
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        timeout-minutes: 10
        run: bash scripts/verify-cargo.sh nextest --profile ci $TEST_TARGETS -E 'package(hide-core) & kind(lib) & test(=links::store::ledger::tests::native_node_paths_identify_fresh_original_work_but_not_history_or_a_sibling)'
      - name: Letters and agent sleep on the state folder's durable files
        # The ledger opens from a real state folder, making a missing chain
        # through the platform's directory flushes, and a letter goes from
        # one registered agent to the other's inbox and back from disk; the
        # record of an agent the sleep closes saves through the same barrier.
        # Windows refused both before hide-platform flushed folders there.
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        timeout-minutes: 5
        run: bash scripts/verify-cargo.sh nextest --profile ci $TEST_TARGETS -E 'package(hide-core) & kind(lib) & (test(=delivery::ledger::tests::validated_startup_reestablishes_the_installed_version_without_repairing_corruption) | test(=delivery::ledger::tests::startup_bootstraps_private_sibling_state_and_preserves_refused_or_corrupt_bytes) | test(=runtime::delivery::tests::agents_register_and_a_letter_reaches_the_inbox_through_the_saved_ledger) | test(=runtime::tests::agent_sleep::a_dormant_intent_is_saved_through_the_state_folders_barrier) | test(=persistence::tests::a_save_makes_its_folders_chain_durable_once_until_the_folder_is_replaced) | test(=persistence::tests::an_archived_session_saves_through_the_folders_barrier_and_loads_back))'
      - name: A start upgrades the state folders released builds wrote
        # hide-core/src/node_migration/upgrade_tests.rs: each folder under
        # hide-core/tests/fixtures/release-state/ is copied private to the
        # account, as a core writes it, and must convert, name its devices
        # and load in every store; Windows judges privacy by the folder's
        # access list, not a file mode.
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        timeout-minutes: 5
        run: bash scripts/verify-cargo.sh nextest --profile ci $TEST_TARGETS -E 'package(hide-core) & kind(lib) & test(/^node_migration::upgrade_tests::/)'
      - name: Ending an agent closes its pane, and a stuck shell is answered
        # hide-core/src/coordination/end.rs (with-hide/hide-private#676): an
        # end closes the agent's pane after saving its conversation to the
        # state folder's archive, and takes it back when the close fails; a
        # spawn whose new shell never finishes starting answers why and closes
        # the tab it opened (with-hide/hide#2181).
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        timeout-minutes: 5
        run: bash scripts/verify-cargo.sh nextest --profile ci $TEST_TARGETS -E 'package(hide-core) & kind(lib) & (test(/^runtime::tests::agent_end::/) | test(=runtime::tests::remote_spawn::a_spawn_whose_shell_never_finishes_starting_says_why_closes_its_tab_and_starts_again))'
      - name: A device's agent versions reach the core
        # A helper answers the hook diagnosis from its own account's program
        # search, the same call on every system, and the core reads a pane on
        # a device by the version that device reported, so a letter held on a
        # possible draft there is released by a composer read like one on the
        # core's own machine (with-hide/hide-private#654).
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          bash scripts/verify-cargo.sh nextest --profile ci $TEST_TARGETS -E 'package(hide-host) & kind(lib) & test(=serve::tests::a_hook_diagnosis_answers_for_the_account_the_helper_runs_as)'
          bash scripts/verify-cargo.sh nextest --profile ci $TEST_TARGETS -E 'package(hide-core) & kind(lib) & (test(=runtime::delivery::tests::a_device_pane_is_read_by_the_version_its_own_machine_reported) | test(=runtime::delivery::tests::a_device_s_agent_versions_go_with_the_device))'
      - name: Agent sleep ends the agent's process tree
        # Claude Code, Codex and Antigravity sleep (and Reopen) by ending the
        # pane's foreground job through the node, which Windows refused as
        # unsupported until hide-platform ended the agent's process tree
        # there: a real agent and the tool it started end, and the end waits
        # for the shell to hold the terminal. Before that the quit key is
        # pressed again only on what the agent shows (with-hide/hide-private#37).
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        timeout-minutes: 5
        run: bash scripts/verify-cargo.sh nextest --profile ci $TEST_TARGETS -E 'package(hide-core) & kind(lib) & (test(=agent_sleep_engine::tests::an_agent_that_does_not_quit_on_its_keys_is_ended_with_what_it_started) | test(=agent_sleep_engine::tests::an_agent_that_asks_for_its_quit_key_again_gets_a_second_press) | test(=agent_sleep_engine::tests::an_agent_quitting_on_its_first_press_is_sent_no_second_one) | test(=agent_sleep_engine::tests::a_press_that_clears_a_draft_is_followed_by_the_quit))'
      - name: A letter wakes a sleeping agent through a refused wake
        # A Windows device's Claude asleep off screen was never woken by a
        # letter: its node could not hold the resume line for a pane no
        # screen attached (`pane_input_cancelled`, fixed by attaching it for
        # the input, the hide-node lib tests above), and the refused wake
        # failed its letter at once. A wake that typed nothing is asked again,
        # three wakes in all, before its letter fails and its sender is told
        # (with-hide/hide-private#660, #675).
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        timeout-minutes: 5
        run: bash scripts/verify-cargo.sh nextest --profile ci $TEST_TARGETS -E 'package(hide-core) & kind(lib) & (test(/^runtime::tests::mission_worker_sleep::a_letter_wake_/) | test(=agent_sleep_engine::tests::a_wake_whose_renewal_left_no_known_holder_fails_and_types_nothing) | test(=agent_sleep_engine::tests::only_a_refusal_that_passes_on_its_own_lets_a_wake_be_asked_again))'
      - name: Public repository read deadline
        # Execute the delayed native Git fixture, including Windows child
        # cleanup; compiling the public-boundary regression is not proof.
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        timeout-minutes: 5
        run: bash scripts/verify-cargo.sh nextest --profile ci $TEST_TARGETS -E 'binary_id(hide-host::it) & test(=worktrees::a_public_read_spends_one_deadline_on_discovery_metadata_and_measurement)'
      - name: Registration takes a confirmed drive folder and never a network share
        # A folder on a drive outside home is registered once confirmed, and a
        # network share never, written or reached through a link on a drive,
        # by hided and by a device's helper alike (PRD wsl-device B19, D-15).
        # Both forms exist only here, so the Linux rust lane compiles them out.
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          bash scripts/verify-cargo.sh nextest --profile ci $TEST_TARGETS -E 'package(hided) & kind(lib) & test(/^boundary::windows_tests::/)'
          bash scripts/verify-cargo.sh nextest --profile ci $TEST_TARGETS -E 'binary_id(hide-host::it) & test(=register::a_confirmed_link_to_a_network_share_is_refused_like_the_share)'
      - name: A checkout catches up to its fetched upstream and a new branch starts from origin
        # Real git repositories on this system: the node's fast-forward with
        # its refusals, and where a new worktree's branch starts.
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          bash scripts/verify-cargo.sh nextest --profile ci $TEST_TARGETS -E 'binary_id(hide-host::it) & test(/^branch_merge::.*(catch|upstream)/)'
          bash scripts/verify-cargo.sh nextest --profile ci $TEST_TARGETS -E 'package(hide-core) & kind(lib) & test(/worktree_control::tests::a_(new_branch_starts|local_base_with_unpushed)/)'
      - name: Agent folders from the one resolver and the callers that judge an override
        # hide_agent_adapter::AgentAdapter::home on Windows path forms (drive,
        # UNC and verbatim paths moving the folder; drive-relative and
        # root-relative ones refused), the core's environment report built
        # on it, and Desk's sign-in path. It stands on its own, so it runs
        # whatever the step above answered.
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        timeout-minutes: 10
        run: bash scripts/verify-cargo.sh nextest --profile ci $TEST_TARGETS -E '(package(hide-agent-adapter) & kind(lib) & test(/^home::/)) | (package(hide-core) & kind(lib) & test(/^environment::/)) | (package(hide-desk) & kind(lib) & test(/^codex::/))'
      - name: Install kit, its Windows command shim and its pieces in profile accounts
        # hide-kit/src/tests/profile_cases.rs runs here too: a profile
        # account's folder made private, its hook, skills and trust put in
        # and taken out, and a link in it followed nowhere outside it.
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        timeout-minutes: 10
        run: bash scripts/verify-cargo.sh nextest --profile ci $TEST_TARGETS -E 'package(hide-kit)'
      - name: Agent hooks, their Windows entries run through PowerShell
        # The hook file writer, the entries Claude Code, Codex, Grok and
        # Cursor run on Windows, OpenCode's plugin and Pi's and omp's
        # extension run in Node, the helper's stdin deadline, and how a
        # PowerShell or POSIX call is read (`hide-shell`). It stands on its
        # own, so it runs whatever the step above answered.
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        timeout-minutes: 15
        run: bash scripts/verify-cargo.sh nextest --profile ci $TEST_TARGETS -E '(package(hide-agent-hooks) & (kind(lib) | kind(bin) | test(/^(hook_deadline|windows_hook_command|windows_scripts)::/))) | (package(hide-shell) & kind(lib))'
      - name: Build the pane holder and fetch its pinned ConPTY runtime
        # For the core's own engine below: its panes run in holders started
        # from this build, on the ConPTY runtime contracts/conpty.json pins.
        id: holder
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        timeout-minutes: 15
        run: |
          bash scripts/verify-cargo.sh build -p hide-holder --bin hide-holder
          python scripts/fetch-conpty.py --out "$RUNNER_TEMP/holder-conpty"
      - name: The core's own engine in Windows PowerShell
        # hide-core/src/engine/contract.rs: the core's own engine over pane
        # holders meets the engine contract in Windows PowerShell.
        if: ${{ !cancelled() && steps.tests.outcome == 'success' && steps.holder.outcome == 'success' }}
        timeout-minutes: 10
        env:
          HIDE_TEST_HOLDER_BIN: ${{ github.workspace }}\target\debug\hide-holder.exe
          HIDE_HOLDER_CONPTY: ${{ runner.temp }}\holder-conpty
        run: bash scripts/verify-cargo.sh nextest --profile ci $TEST_TARGETS -E 'package(hide-core) & kind(lib) & test(/^engine::contract::/)' --run-ignored only --no-capture
      - name: Windows' own OpenSSH asks through Hide's askpass
        # hided/tests/it/system_ssh.rs (PRD system-ssh-device-link, B34): the
        # inbox ssh-keygen.exe reads a key's passphrase through `hide` as its
        # askpass, the same question ssh.exe asks at sign-in.
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        timeout-minutes: 5
        run: bash scripts/verify-cargo.sh nextest --profile ci $TEST_TARGETS -E 'binary_id(hided::it) & test(=system_ssh::windows_inbox_openssh_asks_through_hides_askpass)' --run-ignored only --no-capture
      - name: A core's stop and a device's removal end a dial through Windows' own ssh
        # hide-core/src/handle.rs (with-hide/hide-private#75): ssh.exe dials a
        # loopback listener that never sends the SSH greeting, and the core
        # ends that ssh, which a job object owns on Windows, when it stops or
        # the device is removed.
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        timeout-minutes: 5
        run: bash scripts/verify-cargo.sh nextest --profile ci $TEST_TARGETS -E 'package(hide-core) & kind(lib) & (test(=handle::tests::a_stopping_core_ends_a_dial_to_a_device_that_never_greets) | test(=handle::tests::removing_a_device_ends_its_dial_that_waits_for_a_greeting))' --no-capture
      - name: Attribute a native listening port to its working directory
        # Cleanup must refuse an unreadable in-use check. This unchanged core
        # contract exposes the native read reason that a browser error lacks.
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          status=0
          bash scripts/verify-cargo.sh nextest --profile ci $TEST_TARGETS -E 'package(hide-core) & kind(lib) & test(=ports::tests::a_real_listener_is_found_and_attributed_to_the_directory_it_runs_in)' --no-capture || status=$?
          bash scripts/verify-cargo.sh nextest --profile ci $TEST_TARGETS -E 'package(hide-core) & kind(lib) & test(=ports::tests::cleanup_keeps_a_checkout_in_use_when_a_listener_starts_through_another_spelling)' --no-capture || status=$?
          exit "$status"
      - uses: pnpm/action-setup@v6
        if: ${{ !cancelled() }}
        with:
          version: 10
      - uses: actions/setup-node@v4
        if: ${{ !cancelled() }}
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        id: web-deps
        if: ${{ !cancelled() }}
        run: bash scripts/verify-web.sh install --ignore-scripts
      # The relay WebAssembly's binding tool, which the web scripts build with.
      - uses: ./.github/actions/relay-tools
        with:
          save: false
      - name: Web shell unit suite
        if: ${{ !cancelled() && steps.web-deps.outcome == 'success' }}
        timeout-minutes: 10
        # Typecheck and lint are OS-independent and run in Linux `checks`.
        # Vitest stays here: its platform and process tests must run on Windows.
        run: bash scripts/verify-web.sh web test
      - name: Desktop app unit suite
        if: ${{ !cancelled() && steps.web-deps.outcome == 'success' }}
        timeout-minutes: 10
        run: bash scripts/verify-web.sh desktop test
      - name: Mint the development issues token
        # Development issues live in with-hide/hide-private (docs/TESTING.md,
        # Flaky tests); one App token reads this run here and files there. A run
        # without the App's key, such as a fork's, files nothing and stays green.
        id: issues-token
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.HIDE_ISSUES_APP_CLIENT_ID }}
          private-key: ${{ secrets.HIDE_ISSUES_APP_KEY }}
          owner: with-hide
          repositories: hide,hide-private
      - name: Report flaky and failed tests
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ steps.issues-token.outputs.token }}
        run: python3 scripts/ci-flaky-report.py --suite rust --junit target/nextest/ci/junit*.xml

  # The browser `@platform` tests on Windows, the same set the macOS lane
  # runs, against hided and the Windows pane holder.
  windows-e2e:
    name: windows e2e
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.lanes), 'windows-e2e')
    uses: ./.github/workflows/web-e2e.yml
    secrets:
      HIDE_ISSUES_APP_KEY: ${{ secrets.HIDE_ISSUES_APP_KEY }}
    permissions:
      contents: read
    with:
      lane: windows
      runner: windows-latest
      shards: 1
      grep: "@platform"

  # The web shell is the same code on every operating system, so the whole
  # suite runs once, on Linux, where runners are plentiful. What differs by
  # system is the daemon and the pane holders under it, and the `@platform` tests cover
  # that: they run in this suite on Linux, in `windows-e2e` on Windows and in
  # `nightly.yml` on macOS.
  web-e2e:
    name: web e2e
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.lanes), 'web-e2e')
    uses: ./.github/workflows/web-e2e.yml
    secrets:
      HIDE_ISSUES_APP_KEY: ${{ secrets.HIDE_ISSUES_APP_KEY }}
    permissions:
      contents: read
    with:
      lane: linux
      runner: ubuntu-latest
      # Median per test from twenty successful main runs, 2026-10-26..28:
      # 385 Linux tests total 3851.3 s; five shards plan at most 770.3 s,
      # six at most 641.9 s. Six is the smallest count within 720 s.
      # Test-work weights exclude setup/queues; the step still caps at 20 min.
      shards: 6

  # The remote mailbox crate-boundary lane (hided/tests/it/remote_delivery.rs,
  # docs/TESTING.md), in `remote-mailbox.yml`. It has its own job because it was
  # the tail of `web e2e (macOS)` (6.8 minutes of `@platform` tests, then 3.2 of
  # this lane after a 4.4-minute build of every CLI binary, 14.4 minutes in
  # all, the longest job of a run on 2026-10-05). It runs on Linux here: it
  # checks the device's node link over the system's ssh and sshd, its sign-in,
  # helper attestation and the durable mailbox, the same code on every system; what differs by system under it is
  # `os-contract`'s and `windows check`'s to prove. The fixture's macOS-only
  # branches (codesign of the staged binaries, BSD `ps` and `strip`) and the
  # Mac as the usual remote device are why `nightly.yml`
  # runs it on macOS too. It is planned for a change to the crates it builds
  # and tests (`MAILBOX_CRATES` in scripts/ci-plan.py).
  remote-mailbox:
    name: remote mailbox
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.lanes), 'remote-mailbox')
    uses: ./.github/workflows/remote-mailbox.yml
    secrets:
      HIDE_ISSUES_APP_KEY: ${{ secrets.HIDE_ISSUES_APP_KEY }}
    permissions:
      contents: read
    with:
      runner: ubuntu-latest

  # The same lane on a Linux arm64 runner (with-hide/hide-private#501): a
  # device whose kit a core of another platform takes from its release
  # (`contracts/device-kits.json`) is often an arm64 Linux machine, and the
  # core's own build connects to it here over the system ssh and runs its
  # panes in its holders. Nothing on this runner's processor is cached, so it
  # builds cold. It is planned for the device link's own crates, its device
  # test and the contract (`ARM_DEVICE_CRATES` in scripts/ci-plan.py).
  remote-mailbox-arm:
    name: remote mailbox arm64
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.lanes), 'remote-mailbox-arm')
    uses: ./.github/workflows/remote-mailbox.yml
    secrets:
      HIDE_ISSUES_APP_KEY: ${{ secrets.HIDE_ISSUES_APP_KEY }}
    permissions:
      contents: read
    with:
      runner: ubuntu-24.04-arm

  # The OS contract's Linux and Windows legs (see os-contract.yml), for any
  # change to what differs by system.
  os-contract:
    name: os contract
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.lanes), 'os-contract')
    uses: ./.github/workflows/os-contract.yml
    secrets:
      HIDE_ISSUES_APP_KEY: ${{ secrets.HIDE_ISSUES_APP_KEY }}
    with:
      systems: '["linux","windows"]'
    permissions:
      contents: read

  # Its macOS leg, for a pull request that changes `hide-platform`'s macOS
  # code or another macOS path, and every full plan of main's push run and
  # the nightly.
  os-contract-macos:
    name: os contract (macOS)
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.lanes), 'os-contract-macos')
    uses: ./.github/workflows/os-contract.yml
    secrets:
      HIDE_ISSUES_APP_KEY: ${{ secrets.HIDE_ISSUES_APP_KEY }}
    with:
      systems: '["macos"]'
    permissions:
      contents: read

  # The terminal parser on each system, for a change to hide-vt or the
  # scripts that prepare and check its Zig build (see vt.yml); its macOS leg
  # only when `plan` says the run takes macOS.
  vt:
    name: vt
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.lanes), 'vt')
    uses: ./.github/workflows/vt.yml
    secrets:
      HIDE_ISSUES_APP_KEY: ${{ secrets.HIDE_ISSUES_APP_KEY }}
    with:
      systems: ${{ needs.plan.outputs.macos == 'true' && '["linux","macos","windows"]' || '["linux","windows"]' }}
      macos-runner: ${{ needs.plan.outputs.self-hosted-macos }}
    permissions:
      contents: read

  # Every pinned agent CLI in a pane holder across a node restart, on each
  # system, for a change to the holder, the node's holder code, the pins or
  # the lane's scripts (see holder-restart.yml), its macOS leg only when
  # `plan` says the run takes macOS; the nightly runs it every night.
  holder-restart:
    name: holder restart
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.lanes), 'holder-restart')
    uses: ./.github/workflows/holder-restart.yml
    with:
      systems: ${{ needs.plan.outputs.macos == 'true' && '["linux","macos","windows"]' || '["linux","windows"]' }}
    permissions:
      contents: read

  # agy against stand-ins and its installed binary on Windows, for a change
  # to a crate that writes agy's files, reads its conversations or drives it
  # for Hide AI. `rust` runs the same agy tests on Linux; the nightly runs the
  # whole contract on all three systems.
  omp-contract:
    name: omp SDK contract
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.lanes), 'omp-contract')
    uses: ./.github/workflows/omp-contract.yml
    with:
      systems: ${{ needs.plan.outputs.macos == 'true' && '["linux","macos","windows"]' || '["linux","windows"]' }}
      macos-runner: ${{ needs.plan.outputs.self-hosted-macos }}
    permissions:
      contents: read

  agy-contract:
    name: agy contract
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.lanes), 'agy-contract')
    uses: ./.github/workflows/agy-contract.yml
    secrets:
      HIDE_ISSUES_APP_KEY: ${{ secrets.HIDE_ISSUES_APP_KEY }}
    with:
      systems: '["windows"]'
    permissions:
      contents: read

  # The agent journey on the compiled Claude and Codex stand-ins, keyless, on
  # Linux, and its process jobs, private files and pane commands on Windows,
  # for a change to the journey's code, the stand-ins or a crate's product
  # code, which every cell judges (scripts/ci-plan.py); the nightly and a
  # release run it on every system, with the fake model lane.
  agent-journey:
    name: agent journey
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.lanes), 'agent-journey')
    uses: ./.github/workflows/agent-journey.yml
    with:
      systems: '["linux","windows"]'
    permissions:
      contents: read

  # Every pinned agent CLI installed at its pin on Linux and Windows, for a
  # change to the pin table or an installer; the nightly's journey installs
  # them on macOS too, every night.
  agent-clis:
    name: agent CLIs
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.lanes), 'agent-clis')
    uses: ./.github/workflows/agent-clis.yml
    with:
      systems: '["linux","windows"]'
    permissions:
      contents: read

  # The Electron app on macOS, the system it is written against: the whole
  # suite, for a pull request that changes the desktop host or the web shell
  # and a macOS path, and in every full plan of main's push run and the
  # nightly, which is where every other change meets it.
  desktop-e2e:
    name: desktop e2e
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.lanes), 'desktop-e2e')
    uses: ./.github/workflows/desktop-e2e.yml
    secrets:
      HIDE_ISSUES_APP_KEY: ${{ secrets.HIDE_ISSUES_APP_KEY }}
    permissions:
      contents: read
    with:
      lane: macos
      runner: macos-15
      # Two shards: the suite is about 17 minutes of tests (1008 s recorded,
      # 2026-10-17) and one job ran it in 1048 to 1166 s of its 20-minute
      # step cap. Two plan about 504 s each, under half the cap, for one more
      # job of about 4.5 minutes of setup on the five macOS runners; a third
      # would hold three of the five for the same suite (docs/TESTING.md).
      shards: 1
      grep: "project-settings\\.spec|agent-handoff\\.spec"

  # The Electron app on Windows: the desktop tests tagged `@platform` (what
  # the host does differently there: `hide connect` starting hided, the
  # window's lifetime, the CLI's name and places, the wire path, the file
  # manager's reveal), for a change to the desktop app, the web code it
  # drives or what differs by system. About six minutes on a warm cache
  # (nightly, 2026-10-10). The window it draws is kept as the run's artifact.
  windows-desktop:
    name: windows desktop
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.lanes), 'windows-desktop')
    uses: ./.github/workflows/desktop-e2e.yml
    secrets:
      HIDE_ISSUES_APP_KEY: ${{ secrets.HIDE_ISSUES_APP_KEY }}
    permissions:
      contents: read
    with:
      lane: windows
      runner: windows-latest
      shards: 1
      grep: "@platform"
      keep-screenshots: true

  # A real WSL 2 distribution on the Windows runner, connected as a device
  # through `wsl.exe` (see wsl-device.yml), for a change to the crates the
  # WSL link crosses.
  windows-wsl:
    name: windows wsl
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.lanes), 'windows-wsl')
    uses: ./.github/workflows/wsl-device.yml
    secrets:
      HIDE_ISSUES_APP_KEY: ${{ secrets.HIDE_ISSUES_APP_KEY }}
    permissions:
      contents: read

  package:
    name: package
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.lanes), 'package')
    uses: ./.github/workflows/package.yml
    secrets:
      HIDE_ISSUES_APP_KEY: ${{ secrets.HIDE_ISSUES_APP_KEY }}
    permissions:
      contents: read
    with:
      # A pull request's package reports a version no release uses.
      version: 0.0.0-ci.${{ github.run_number }}
      include-macos: ${{ needs.plan.outputs.macos == 'true' }}
      macos-compile-runner: ${{ needs.plan.outputs.self-hosted-macos }}
      web-typechecked: ${{ contains(fromJSON(needs.plan.outputs.lanes), 'checks') }}
      # A pull request checks the package, not the optimizer; main's push run
      # and the nightly build what ships and save the release dependency set.
      quick-build: ${{ github.event_name == 'pull_request' }}

  # A merge queue group's Rust check: formatting and Clippy over the whole
  # workspace, without the tests the `rust` lane runs. It reads the workspace
  # dependency set main's `rust` lane saves and saves nothing.
  merge-rust:
    name: merge check rust
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.lanes), 'merge-rust')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust-cache
        with:
          set: workspace
          save: false
      - uses: ./.github/actions/vt-cache
        with:
          save: false
      - name: Check formatting and lint the workspace
        run: bash scripts/verify-cargo.sh lint

  # A merge queue group's web check: the web and desktop typecheck and the e2e
  # test size budgets, without the lint, unit tests and build `checks` runs.
  merge-web:
    name: merge check web
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.lanes), 'merge-web')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      # The relay WebAssembly's binding tool, which the web scripts build with.
      - uses: ./.github/actions/relay-tools
        with:
          save: false
      - name: Install dependencies
        run: bash scripts/verify-web.sh install
      - name: Web shell and desktop app typecheck
        run: |
          bash scripts/verify-web.sh web typecheck
          bash scripts/verify-web.sh desktop typecheck
      # Each package runs the web package's script from its own folder, where
      # it resolves TypeScript, as its `lint` script does.
      - name: Web end-to-end test size budget
        working-directory: web
        run: node ../web/scripts/check-e2e-test-size.mjs e2e
      - name: Desktop end-to-end test size budget
        working-directory: desktop
        run: node ../web/scripts/check-e2e-test-size.mjs e2e

  relay-protocol:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.lanes), 'relay-protocol')
    uses: ./.github/workflows/relay-protocol.yml
    secrets: inherit
    with:
      include-macos: ${{ needs.plan.outputs.macos == 'true' }}

  verify:
    name: verify
    permissions:
      contents: read
      actions: read
    needs: [plan, policy, rust, checks, relay-protocol, os-contract, os-contract-macos, vt, holder-restart, agy-contract, omp-contract, agent-journey, agent-clis, windows-check, windows-e2e, windows-desktop, windows-wsl, web-e2e, remote-mailbox, remote-mailbox-arm, desktop-e2e, package, merge-rust, merge-web]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts/ci-plan.py
            scripts/ci-flaky-report.py
          sparse-checkout-cone-mode: false
      - name: Every planned lane succeeded and every other lane was skipped
        # A planned lane that was skipped, cancelled or failed fails here, and
        # so does a lane that ran without being planned or a `needs` entry the
        # plan does not know.
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci-plan.py aggregate
      - name: Mint the development issues token
        # Development issues live in with-hide/hide-private (docs/TESTING.md,
        # Flaky tests); one App token reads this run here and files there. A run
        # without the App's key, such as a fork's, files nothing and stays green.
        id: issues-token
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.HIDE_ISSUES_APP_CLIENT_ID }}
          private-key: ${{ secrets.HIDE_ISSUES_APP_KEY }}
          owner: with-hide
          repositories: hide,hide-private
      - name: Connect test failures and passes across job reruns
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 4
        env:
          GH_TOKEN: ${{ steps.issues-token.outputs.token }}
        run: python3 scripts/ci-flaky-report.py --retry-history
