# The remote mailbox crate-boundary lane (hided/tests/it/remote_delivery.rs,
# docs/TESTING.md) as one reusable job: the candidate CLI binaries and the
# pane holder, a daemon and a device whose panes run on the core's own
# engine, and a loopback SSH server. A device is reached with the system
# `ssh` (PRD system-ssh-device-link), so the node contract, the mailbox, the
# sign-in journeys (hided/tests/it/system_ssh.rs) and a device's holder panes
# (hided/tests/it/device_own_engine.rs) run against the system's own `sshd`
# on loopback. `pr.yml` runs it on Linux for a change to the crates it
# builds, and `nightly.yml` on macOS, the system of the usual remote device:
# the fixture signs its staged binaries there.
name: remote mailbox lane

on:
  workflow_call:
    inputs:
      runner:
        description: The GitHub-hosted runner label.
        type: string
        required: true
      repeat:
        description: How many times the lane's tests run in the one job; 1 is the lane as `pr.yml` runs it.
        type: string
        default: '1'
      canary-fail-iteration:
        description: Declared so the job may read it; a pull request's and the nightly's call leave it empty and run no canary.
        type: string
        default: ''
    # The development issues App's key (docs/TESTING.md, Flaky tests). A run
    # without it, such as a fork's, files no issue and passes as before.
    secrets:
      HIDE_ISSUES_APP_KEY:
        required: false
  # A hand run on a branch repeats the lane to show a flaky test fixed
  # (docs/TESTING.md, Flaky tests): `gh workflow run remote-mailbox.yml
  # --ref <branch> -f repeat=10`.
  workflow_dispatch:
    inputs:
      runner:
        description: The GitHub-hosted runner label.
        type: string
        default: ubuntu-latest
      repeat:
        description: How many times the lane's tests run in the one job (nextest --stress-count).
        type: string
        default: '10'
      canary-fail-iteration:
        description: A 1-based stress iteration for the gate canary to fail, to show on a real runner that a failed iteration fails this job (docs/TESTING.md, The repeat lane); empty runs no canary.
        type: string
        default: ''

permissions:
  contents: read

jobs:
  mailbox:
    name: remote mailbox ${{ inputs.runner }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.repeat == '1' && 30 || 80 }}
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 5
      # Reads the workspace set another lane saves (docs/BUILD.md, "CI's Rust
      # caches"); on Linux the rust lane's build holds the 48 dependencies
      # hided's tests add to its daemon.
      - uses: ./.github/actions/rust-cache
        timeout-minutes: 5
        with:
          set: workspace
          save: false
      # hide-vt's Zig inputs and caches, which the vt lane saves: the pane
      # holder every pane runs in links hide-vt. The vt lane has no Linux arm64
      # leg, so this lane's arm64 run on main is that system's one saver, and
      # every other run reads what it saved (#2631).
      - uses: ./.github/actions/vt-cache
        timeout-minutes: 5
        with:
          save: ${{ github.ref == 'refs/heads/main' && runner.arch == 'ARM64' }}
      - name: Install zsh and the SSH server
        # The fixture starts every pane's shell from SHELL=/bin/zsh, which the
        # Linux image lacks, and a device's tests run against the system's
        # sshd. The mirror can stall, so the packages are cached and fetched
        # inside one time limit (.github/actions/apt-install). macOS has both.
        if: runner.os == 'Linux'
        timeout-minutes: 6
        uses: ./.github/actions/apt-install
        with:
          packages: zsh openssh-server
          minutes: 3
      - name: A default key and a password account for the sign-in journeys
        # hided/tests/it/system_ssh.rs signs in with a key ssh finds by itself
        # in the runner account's own ~/.ssh, and as a second account with a
        # password on a root sshd, which only a disposable runner may have.
        # `scripts/prepare-ssh-accounts.sh` names each command before it runs
        # it and stops one that overruns, because this step once timed out
        # here with no output at all and named none of its commands
        # (with-hide/hide-private#898). The step's limit stays as the
        # backstop for a hang the script cannot see; the script's own budget
        # is shorter, so it is what usually ends a stuck run.
        timeout-minutes: 3
        shell: bash
        run: bash scripts/prepare-ssh-accounts.sh
      - name: Install cargo-nextest
        timeout-minutes: 3
        run: bash scripts/install-nextest.sh
      - name: Build the CLI binaries
        # hided, hide, the agent hooks and the pane holder: the lane stages and
        # starts them all.
        timeout-minutes: 20
        run: bash scripts/verify-cargo.sh cli
      - name: Remote mailbox, node contract and a device's holder panes over the system ssh
        # device_own_engine (PRD engine-bundle-3-core-owns D-22, B35): a pane
        # keeps its process when the device's node ends with its link and a
        # new link's node finds it. The node contract's device links start
        # their holders from the built one too.
        timeout-minutes: ${{ inputs.repeat == '1' && 20 || 60 }}
        env:
          REPEAT: ${{ inputs.repeat }}
          # Empty on every ordinary run: the canary then passes like any other
          # test, and this lane's behavior does not depend on it.
          CANARY: ${{ inputs.canary-fail-iteration }}
        shell: bash
        run: |
          set -euo pipefail
          case "$REPEAT" in ''|*[!0-9]*|0) echo "repeat must be a positive number, not '$REPEAT'" >&2; exit 1 ;; esac
          # A canary iteration outside the run would fail nothing and prove
          # nothing, so a mistyped one stops the lane here. It must not be the
          # last iteration: that one failing is what nextest itself exits
          # nonzero for, so it would show the step's exit status and not the
          # check below, which is the gate this run exists to show.
          if [ -n "$CANARY" ]; then
            case "$CANARY" in ''|*[!0-9]*) echo "canary-fail-iteration must be a number, not '$CANARY'" >&2; exit 1 ;; esac
            if [ "$CANARY" -lt 1 ] || [ "$CANARY" -ge "$REPEAT" ] || [ "$REPEAT" -lt 2 ]; then
              echo "canary-fail-iteration $CANARY names no iteration to fail before the last: with repeat $REPEAT it must be 1 to $((REPEAT - 1))" >&2
              exit 1
            fi
          fi
          stress=()
          # A repetition shows a fix only if one failure fails the job, so no retry.
          if [ "$REPEAT" != 1 ]; then stress=(--stress-count "$REPEAT" --retries 0); fi
          # The gate canary runs beside the lane's own tests, so a hand run can
          # fail one iteration on purpose and show that this job ends red
          # (stress_gate_canary; docs/TESTING.md, The repeat lane).
          filter='test(/^(remote_delivery|node_contract|system_ssh|device_own_engine|pairing|stress_gate_canary)::/) & !test(protocol24)'
          # nextest ends 0 when only its last iteration passed, so its summary
          # is kept for the check below (`--stress-count` hides an earlier
          # failure in the exit status alone).
          log="$RUNNER_TEMP/nextest.log"
          status=0
          HIDE_TEST_HOLDER_BIN=$PWD/target/debug/hide-holder HIDE_TEST_STRESS_CANARY_FAIL_ITERATION="$CANARY" \
            bash scripts/verify-cargo.sh nextest --profile ci ${stress[@]+"${stress[@]}"} -p hided --test it -E "$filter" --run-ignored only 2>&1 \
            | tee "$log" || status=$?
          # What the password sshd did with a sign-in its client saw only as
          # `Connection closed`, kept only when this step failed
          # (with-hide/hide#2554). A log that was never written is said so: an
          # empty group would read as a server that refused nothing.
          if [ "$status" -ne 0 ]; then
            sshd_log=${HIDE_E2E_SSH_PASSWORD_SSHD_LOG:-}
            if [ -z "$sshd_log" ]; then
              echo "the password sshd's log was not named in this run"
            elif [ ! -f "$sshd_log" ]; then
              echo "the password sshd wrote no log at $sshd_log"
            else
              echo "::group::the password sshd's log for the failed run ($(wc -c < "$sshd_log") bytes)"
              tail -c 65536 "$sshd_log"
              echo "::endgroup::"
            fi
          fi
          exit "$status"
      - name: Another account's hide <path> on a device's bridge
        # hide-host/src/panes.rs: a plain shell's `hide <path>` is proved only
        # as a process of the node's own account, by the kernel's answer about
        # the stream's other end. The runner's passwordless sudo starts the one
        # process of another account (`nobody`) this needs.
        timeout-minutes: 5
        run: bash scripts/verify-cargo.sh nextest --profile ci -p hide-host --lib -E 'test(=panes::tests::another_account_s_open_is_refused_by_the_kernel_s_peer_check)' --run-ignored only
      - name: Mint the development issues token
        # Development issues live in this repository (docs/TESTING.md,
        # Flaky tests); the App's token reads this run and files them. A run
        # without the App's key, such as a fork's, files nothing and stays green.
        id: issues-token
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.HIDE_ISSUES_APP_CLIENT_ID }}
          private-key: ${{ secrets.HIDE_ISSUES_APP_KEY }}
          owner: with-hide
          repositories: hide
      - name: A repeated run that had a failed iteration fails here
        # `--stress-count N` exits 0 when its last iteration passes, so this
        # run's reports and its nextest log decide whether any iteration
        # failed (`scripts/check-stress-report.py`; docs/TESTING.md, The
        # repeat lane). The log is passed too: nextest's own summary is what
        # says how many iterations ran, without which a truncated run (fewer
        # iterations than the repeat asked for) would pass on its reports.
        if: ${{ !cancelled() && inputs.repeat != '1' }}
        timeout-minutes: 2
        run: |
          python3 scripts/check-stress-report.py --junit target/nextest/ci/junit*.xml \
            --summary "$RUNNER_TEMP/nextest.log" --repeat "${{ inputs.repeat }}"
      - name: Report flaky and failed tests
        id: flaky
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ steps.issues-token.outputs.token }}
        run: python3 scripts/ci-flaky-report.py --suite rust --junit target/nextest/ci/junit*.xml
      - name: Keep the lane's run directory
        # The daemon's output and both machines' Logs records behind a failed
        # run, without the staged binaries, the copies of them the install
        # places in each account's helper and bin folders, and the fixture's
        # SSH keys. A flaky run is kept too: its first attempt's logs are the
        # evidence its issue needs (docs/TESTING.md, Flaky tests).
        if: ${{ failure() || steps.flaky.outputs.flaky == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: hide-remote-mailbox-logs-${{ inputs.runner }}-attempt-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            agents/runs/rd-*
            !agents/runs/rd-*/cli/**
            !agents/runs/rd-*/*/*/.ssh/**
            !agents/runs/rd-*/*/*/helper/**
            !agents/runs/rd-*/*/*/bin/**
          if-no-files-found: ignore
      - name: Summarize the stalled device connection
        if: ${{ failure() || steps.flaky.outputs.flaky == 'true' }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          # Only the final bounded diagnostic records, never fixture keys,
          # state, environment, or conversation contents.
          for path in sorted(Path('agents/runs').glob('rd-*/logs-local/core.jsonl'))[:100]:
              with path.open('rb') as stream:
                  stream.seek(0, 2)
                  stream.seek(max(0, stream.tell() - 32768))
                  tail = stream.read(32768).decode('utf-8', errors='replace')
              rows = []
              for line in tail.splitlines():
                  try:
                      row = json.loads(line)
                  except ValueError:
                      continue
                  if row.get('kind') in ('host.establish_stage', 'host.upload_stage'):
                      rows.append({key: row[key] for key in ('kind', 'stage', 'phase', 'upload_id', 'package', 'bytes', 'elapsed_ms') if key in row})
              print(json.dumps({'fixture': path.parts[2], 'connection': rows[-16:]}))
          PY
