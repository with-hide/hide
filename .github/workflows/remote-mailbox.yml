# The remote mailbox crate-boundary lane (hided/tests/it/remote_delivery.rs,
# docs/TESTING.md) as one reusable job: the candidate CLI binaries and the
# pane holder, a daemon and a device whose panes run on the core's own
# engine, and a loopback SSH server. A device is reached with the system
# `ssh` (PRD system-ssh-device-link), so the node contract, the mailbox, the
# sign-in journeys (hided/tests/it/system_ssh.rs) and a device's holder panes
# (hided/tests/it/device_own_engine.rs) run against the system's own `sshd`
# on loopback. `pr.yml` runs it on Linux for a change to the crates it
# builds, and `nightly.yml` on macOS, the system of the usual remote device:
# the fixture signs its staged binaries there.
name: remote mailbox lane

on:
  workflow_call:
    inputs:
      runner:
        description: The GitHub-hosted runner label.
        type: string
        required: true
      repeat:
        description: How many times the lane's tests run in the one job; 1 is the lane as `pr.yml` runs it.
        type: string
        default: '1'
    # The development issues App's key (docs/TESTING.md, Flaky tests). A run
    # without it, such as a fork's, files no issue and passes as before.
    secrets:
      HIDE_ISSUES_APP_KEY:
        required: false
  # A hand run on a branch repeats the lane to show a flaky test fixed
  # (docs/TESTING.md, Flaky tests): `gh workflow run remote-mailbox.yml
  # --ref <branch> -f repeat=10`.
  workflow_dispatch:
    inputs:
      runner:
        description: The GitHub-hosted runner label.
        type: string
        default: ubuntu-latest
      repeat:
        description: How many times the lane's tests run in the one job (nextest --stress-count).
        type: string
        default: '10'

permissions:
  contents: read

jobs:
  mailbox:
    name: remote mailbox ${{ inputs.runner }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.repeat == '1' && 30 || 80 }}
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 5
      # Reads the workspace set another lane saves (docs/BUILD.md, "CI's Rust
      # caches"); on Linux the rust lane's build holds the 48 dependencies
      # hided's tests add to its daemon.
      - uses: ./.github/actions/rust-cache
        timeout-minutes: 5
        with:
          set: workspace
          save: false
      # hide-vt's Zig inputs and caches, which the vt lane saves: the pane
      # holder every pane runs in links hide-vt.
      - uses: ./.github/actions/vt-cache
        timeout-minutes: 5
        with:
          save: false
      - name: Install zsh and the SSH server
        # The fixture starts every pane's shell from SHELL=/bin/zsh, which the
        # Linux image lacks, and a device's tests run against the system's
        # sshd. The mirror can stall, so the packages are cached and fetched
        # inside one time limit (.github/actions/apt-install). macOS has both.
        if: runner.os == 'Linux'
        timeout-minutes: 6
        uses: ./.github/actions/apt-install
        with:
          packages: zsh openssh-server
          minutes: 3
      - name: A default key and a password account for the sign-in journeys
        # hided/tests/it/system_ssh.rs signs in with a key ssh finds by itself
        # in the runner account's own ~/.ssh, and as a second account with a
        # password on a root sshd, which only a disposable runner may have.
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          [ -f ~/.ssh/id_ed25519 ] || ssh-keygen -q -t ed25519 -N '' -f ~/.ssh/id_ed25519
          echo "HIDE_E2E_SSH_DEFAULT_KEY=$HOME/.ssh/id_ed25519.pub" >> "$GITHUB_ENV"
          account=hidepw
          password=$(openssl rand -hex 16)
          echo "::add-mask::$password"
          if [ "$RUNNER_OS" = Linux ]; then
            sudo useradd -m -s /bin/sh "$account"
            echo "$account:$password" | sudo chpasswd
            sudo mkdir -p /run/sshd
          else
            sudo sysadminctl -addUser "$account" -password "$password" -home "/Users/$account" -shell /bin/sh
            sudo createhomedir -c -u "$account" >/dev/null
          fi
          config="$RUNNER_TEMP/password-sshd"
          mkdir -p "$config"
          ssh-keygen -q -t ed25519 -N '' -f "$config/host"
          printf '%s\n' \
            "ListenAddress 127.0.0.1:2222" "HostKey $config/host" "PidFile $config/sshd.pid" \
            "PasswordAuthentication yes" "KbdInteractiveAuthentication no" "PubkeyAuthentication no" \
            "UsePAM yes" > "$config/sshd_config"
          sudo chown root "$config/host" "$config/sshd_config"
          sudo /usr/sbin/sshd -f "$config/sshd_config" -E "$config/sshd.log"
          echo "HIDE_E2E_SSH_PASSWORD=$account:$password:2222" >> "$GITHUB_ENV"
      - name: Install cargo-nextest
        timeout-minutes: 3
        run: bash scripts/install-nextest.sh
      - name: Build the CLI binaries
        # hided, hide, the agent hooks and the pane holder: the lane stages and
        # starts them all.
        timeout-minutes: 20
        run: bash scripts/verify-cargo.sh cli
      - name: Remote mailbox, node contract and a device's holder panes over the system ssh
        # device_own_engine (PRD engine-bundle-3-core-owns D-22, B35): a pane
        # keeps its process when the device's node ends with its link and a
        # new link's node finds it. The node contract's device links start
        # their holders from the built one too.
        timeout-minutes: ${{ inputs.repeat == '1' && 20 || 60 }}
        env:
          REPEAT: ${{ inputs.repeat }}
        run: |
          case "$REPEAT" in ''|*[!0-9]*|0) echo "repeat must be a positive number, not '$REPEAT'" >&2; exit 1 ;; esac
          stress=()
          # A repetition shows a fix only if one failure fails the job, so no retry.
          if [ "$REPEAT" != 1 ]; then stress=(--stress-count "$REPEAT" --retries 0); fi
          HIDE_TEST_HOLDER_BIN=$PWD/target/debug/hide-holder bash scripts/verify-cargo.sh nextest --profile ci ${stress[@]+"${stress[@]}"} -p hided --test it -E 'test(/^(remote_delivery|node_contract|system_ssh|device_own_engine)::/) & !test(protocol24)' --run-ignored only
      - name: Another account's hide <path> on a device's bridge
        # hide-host/src/panes.rs: a plain shell's `hide <path>` is proved only
        # as a process of the node's own account, by the kernel's answer about
        # the stream's other end. The runner's passwordless sudo starts the one
        # process of another account (`nobody`) this needs.
        timeout-minutes: 5
        run: bash scripts/verify-cargo.sh nextest --profile ci -p hide-host --lib -E 'test(=panes::tests::another_account_s_open_is_refused_by_the_kernel_s_peer_check)' --run-ignored only
      - name: Mint the development issues token
        # Development issues live in with-hide/hide-private (docs/TESTING.md,
        # Flaky tests); one App token reads this run here and files there. A run
        # without the App's key, such as a fork's, files nothing and stays green.
        id: issues-token
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.HIDE_ISSUES_APP_CLIENT_ID }}
          private-key: ${{ secrets.HIDE_ISSUES_APP_KEY }}
          owner: with-hide
          repositories: hide,hide-private
      - name: Report flaky and failed tests
        id: flaky
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ steps.issues-token.outputs.token }}
        run: python3 scripts/ci-flaky-report.py --suite rust --junit target/nextest/ci/junit*.xml
      - name: Keep the lane's run directory
        # The daemon's output and both machines' Logs records behind a failed
        # run, without the staged binaries, the copies of them the install
        # places in each account's helper and bin folders, and the fixture's
        # SSH keys. A flaky run is kept too: its first attempt's logs are the
        # evidence its issue needs (docs/TESTING.md, Flaky tests).
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: hide-remote-mailbox-logs-${{ inputs.runner }}-attempt-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            agents/runs/rd-*
            !agents/runs/rd-*/cli/**
            !agents/runs/rd-*/*/*/.ssh/**
            !agents/runs/rd-*/*/*/helper/**
            !agents/runs/rd-*/*/*/bin/**
          if-no-files-found: ignore
      - name: Summarize the stalled device connection
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          # Only the final bounded diagnostic records, never fixture keys,
          # state, environment, or conversation contents.
          for path in sorted(Path('agents/runs').glob('rd-*/logs-local/core.jsonl'))[:100]:
              with path.open('rb') as stream:
                  stream.seek(0, 2)
                  stream.seek(max(0, stream.tell() - 32768))
                  tail = stream.read(32768).decode('utf-8', errors='replace')
              rows = []
              for line in tail.splitlines():
                  try:
                      row = json.loads(line)
                  except ValueError:
                      continue
                  if row.get('kind') in ('host.establish_stage', 'host.upload_stage'):
                      rows.append({key: row[key] for key in ('kind', 'stage', 'phase', 'upload_id', 'package', 'bytes', 'elapsed_ms') if key in row})
              print(json.dumps({'fixture': path.parts[2], 'connection': rows[-16:]}))
          PY
