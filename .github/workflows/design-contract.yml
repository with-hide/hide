name: Design contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request replaces that pull request's run; main's runs
# and other pull requests' runs are never cancelled.
concurrency:
  group: design-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static-design:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check public tokens, contrast and bundled agent marks
        run: |
          node scripts/check-design-contract.mjs
          node --test scripts/tests/token-contrast.test.mjs
