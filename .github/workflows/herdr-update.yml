name: herdr pin update

# GitHub delivers no event across repository boundaries, so an upstream Herdr
# release cannot trigger this. It polls instead, daily, and can be run by hand.
# Herdr has shipped stable releases on consecutive days (v0.9.4 on 2026-10-13,
# v0.9.5 on 2026-10-14); a weekly poll left the pin a week behind one of them.
#
# This repository is public, so GitHub disables a scheduled workflow after 60
# days with no repository activity. If this job stops appearing, re-enable it
# in the Actions tab rather than looking for a bug here.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  # The preview watch below opens an issue; the contribution gate lets
  # github-actions[bot] through.
  issues: write

concurrency:
  group: herdr-pin-update
  cancel-in-progress: false

jobs:
  propose:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Resolve the newest stable Herdr release
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The releases/latest endpoint excludes prereleases, which is what
          # keeps the preview-* tags out of this proposal.
          latest_tag=$(gh api repos/herdrdev/herdr/releases/latest --jq .tag_name)
          latest=${latest_tag#v}
          pinned_tag=$(jq -er .tag contracts/herdr-bundle.json)
          pinned=$(jq -er .version contracts/herdr-bundle.json)
          pinned_protocol=$(jq -er .protocol contracts/herdr-api.schema.json)
          echo "pinned_protocol=$pinned_protocol" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "latest_tag=$latest_tag" >> "$GITHUB_OUTPUT"
          echo "pinned=$pinned" >> "$GITHUB_OUTPUT"
          # A preview pin reports "0.8.2-preview.<date>-<sha>": newer than the
          # 0.8.2 stable it was cut after, older than a 0.8.3 stable. Comparing
          # only the numeric prefix, and proposing only a strictly newer
          # stable, is what stops a daily proposal to move back to 0.8.2.
          pinned_numeric=${pinned%%-*}
          highest=$(printf '%s\n%s\n' "$pinned_numeric" "$latest" | sort -V | tail -n 1)
          if [ "$latest_tag" = "$pinned_tag" ] || [ "$highest" = "$pinned_numeric" ]; then
            echo "needs_bump=false" >> "$GITHUB_OUTPUT"
          else
            echo "needs_bump=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Record a tick that found nothing
        if: steps.upstream.outputs.needs_bump == 'false'
        run: |
          set -euo pipefail
          # A poll that found no release is an outcome, not a silent success.
          echo "herdr.pin.current pinned=${{ steps.upstream.outputs.pinned }}" >&2
          echo "Herdr pin is current at ${{ steps.upstream.outputs.pinned }}; nothing proposed." \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Stop when a proposal is already open
        id: existing
        if: steps.upstream.outputs.needs_bump == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="herdr-bump/v${{ steps.upstream.outputs.latest }}"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          # The schedule fires again long before a bump gets reviewed, so the
          # second run must find the first one's PR instead of duplicating it.
          open=$(gh pr list --head "$branch" --state open --json number --jq 'length')
          if [ "$open" != "0" ]; then
            echo "herdr.pin.proposal_open branch=$branch" >&2
            echo "A bump PR for v${{ steps.upstream.outputs.latest }} is already open." \
              >> "$GITHUB_STEP_SUMMARY"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Move the pin, regenerate the contract and keep the verified binary
        if: steps.existing.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          zsh scripts/bump-herdr.sh --repo herdrdev/herdr "${{ steps.upstream.outputs.latest_tag }}" \
            --keep-binary "$RUNNER_TEMP/herdr" | tee "$RUNNER_TEMP/bump.json"

      - name: Check the API schema against the candidate CLI
        if: steps.existing.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          # Only the schema half is portable. The snapshot, protocol and
          # server-version checks need a live Herdr session and stay local.
          zsh scripts/check-herdr-contract.sh --herdr-bin "$RUNNER_TEMP/herdr" --schema-only

      - name: Confirm the pin has one source
        if: steps.existing.outputs.proceed == 'true'
        run: zsh scripts/check-herdr-pin-single-source.sh

      # The suite runs Hide's OpenCode plugin under Node (`hide-agent-hooks/tests/it/opencode_plugin.rs`).
      - uses: actions/setup-node@v4
        if: steps.existing.outputs.proceed == 'true'
        with:
          node-version: 22

      - name: Install cargo-nextest
        if: steps.existing.outputs.proceed == 'true'
        # The suite runs as every other Rust lane does: nextest's `ci`
        # profile retries a failed test once (docs/TESTING.md, "Flaky tests").
        # Under plain `cargo test` one timing-bound unit test failing on a
        # loaded runner (2026-10-16, a_read_after_a_failure_ends_the_wait_as_a_timeout)
        # stopped the proposal with nothing about Herdr in it.
        timeout-minutes: 3
        run: bash scripts/install-nextest.sh

      - name: Run the Rust suite against the candidate
        if: steps.existing.outputs.proceed == 'true'
        run: bash scripts/verify-cargo.sh nextest --profile ci --workspace

      - name: Open the pull request
        if: steps.existing.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="${{ steps.existing.outputs.branch }}"
          latest="${{ steps.upstream.outputs.latest }}"
          pinned="${{ steps.upstream.outputs.pinned }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          # The branch may exist from a run that pushed it and then failed to
          # open the pull request (2026-10-16: Actions had no permission to
          # create one). This job is the only writer of herdr-bump/*, and a
          # branch without an open PR is its own earlier output, so the push
          # replaces it rather than stopping on non-fast-forward.
          # The documents are the ones the bump rewrote, as it reports them:
          # a second list here once left AGENTS.md and contracts/README.md
          # quoting the old pin.
          mapfile -t documents < <(jq -er '.documents[].document' "$RUNNER_TEMP/bump.json")
          git add contracts/herdr-bundle.json contracts/herdr-api.schema.json "${documents[@]}"
          git commit -m "build: move the bundled Herdr pin to v${latest}"
          git push --force --set-upstream origin "$branch"
          # Hide speaks exactly the pin's protocol (docs/HERDR_VERSIONS.md), so
          # a release on a new one holds the screen of every operator who
          # updates Herdr before Hide ships this pin. That bump says so in its
          # title, label and first line, and is merged and released promptly.
          from_protocol="${{ steps.upstream.outputs.pinned_protocol }}"
          to_protocol=$(jq -er .protocol "$RUNNER_TEMP/bump.json")
          title="build: move the bundled Herdr pin to v${latest}"
          label_args=()
          protocol_note=""
          if [ "$to_protocol" != "$from_protocol" ]; then
            title="${title} on Herdr protocol ${to_protocol}"
            gh label create herdr-protocol --color B60205 \
              --description "Moves Hide to a new Herdr protocol; release it promptly" 2>/dev/null || true
            label_args=(--label herdr-protocol)
            protocol_note="**This release moves Herdr's protocol from ${from_protocol} to ${to_protocol}.** An operator who updates Herdr before Hide ships this pin sees Hide's held screen until then, so merge and release this promptly (docs/HERDR_VERSIONS.md, When Herdr releases)."
            echo "herdr.pin.protocol_change from=${from_protocol} to=${to_protocol}" >&2
          fi
          cat > "$RUNNER_TEMP/pr-body.md" <<BODY
          ${protocol_note}

          Moves the pinned Herdr runtime from v${pinned} to v${latest}.

          The asset was downloaded, its reported version and SHA-256 verified, the
          contract regenerated from the schema that binary reports, and the manifest
          plus every document quoting the pin updated from that one source.

          Checks that ran here:

          - \`check-herdr-contract.sh --schema-only\` against the v${latest} CLI
          - \`check-herdr-pin-single-source.sh\`
          - \`cargo test\` over the workspace

          What this does not prove, and why this is not merged automatically:

          The core carries behavior assumptions about a specific Herdr build - that
          \`pane.close\` removes an emptied tab without a separate event
          (\`session_sync/coordinator.rs\`), that \`terminal.scroll\` publishes no new attach frame on
          its own (\`live.rs\`), and the tab reorder ordering a live server was observed
          to answer with (\`runtime.rs\`). Every test covering those feeds fixtures this
          repository wrote, so a green suite says the code is self-consistent, not that
          v${latest} still behaves that way.

          Before merging, run \`scripts/check-herdr-contract.sh\` in full against a live
          v${latest} server and exercise the tab, scroll and reorder paths.
          BODY
          gh pr create \
            --title "$title" \
            "${label_args[@]}" \
            --body-file "$RUNNER_TEMP/pr-body.md"
          echo "Opened a bump proposal for v${latest}." >> "$GITHUB_STEP_SUMMARY"

  # A protocol change can reach a preview before a stable release, so the
  # newest preview's protocol is read daily: one that differs from the pin's opens one issue, which is the
  # warning to prepare the bump before operators can update into the held
  # screen. Nothing is pinned or proposed here.
  watch-preview:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Read the newest preview's protocol
        id: preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(gh api repos/herdrdev/herdr/releases --jq '[.[] | select(.prerelease)][0].tag_name')
          pinned_protocol=$(jq -er .protocol contracts/herdr-api.schema.json)
          # The dry run downloads and verifies the assets and reads the protocol
          # the binary answers in its schema; it writes nothing.
          protocol=$(zsh scripts/bump-herdr.sh --repo herdrdev/herdr "$tag" --dry-run | jq -er .protocol)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "protocol=$protocol" >> "$GITHUB_OUTPUT"
          echo "pinned_protocol=$pinned_protocol" >> "$GITHUB_OUTPUT"
          echo "herdr.preview.protocol tag=$tag protocol=$protocol pinned_protocol=$pinned_protocol" >&2
          echo "Newest Herdr preview $tag speaks protocol $protocol; the pin speaks $pinned_protocol." >> "$GITHUB_STEP_SUMMARY"

      - name: Open one issue for a preview on another protocol
        if: steps.preview.outputs.protocol != steps.preview.outputs.pinned_protocol
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          protocol="${{ steps.preview.outputs.protocol }}"
          pinned_protocol="${{ steps.preview.outputs.pinned_protocol }}"
          tag="${{ steps.preview.outputs.tag }}"
          title="Herdr previews speak protocol ${protocol}; the pin speaks ${pinned_protocol}"
          # One issue per protocol: the daily run finds the open one by title
          # rather than opening another.
          open=$(gh issue list --state open --search "in:title \"${title}\"" --json title --jq "[.[] | select(.title == \"${title}\")] | length")
          if [ "$open" != "0" ]; then
            echo "An issue for preview protocol ${protocol} is already open." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          cat > "$RUNNER_TEMP/issue.md" <<BODY
          Herdr's newest preview, [${tag}](https://github.com/herdrdev/herdr/releases/tag/${tag}), answers protocol ${protocol} in \`herdr api schema --json\`; Hide's pin speaks ${pinned_protocol}.

          Hide speaks exactly the pin's protocol, so once a stable Herdr ships protocol ${protocol}, every operator who updates Herdr before Hide sees the held screen until Hide ships that pin (docs/HERDR_VERSIONS.md).

          To prepare: try the preview with \`zsh scripts/bump-herdr.sh ${tag}\` on a branch and run the suites, so the stable bump the pin update workflow proposes can merge and release the same day.
          Close this once the pin speaks protocol ${protocol}.
          BODY
          gh issue create --title "$title" --body-file "$RUNNER_TEMP/issue.md"
          echo "Opened an issue for preview protocol ${protocol}." >> "$GITHUB_STEP_SUMMARY"
