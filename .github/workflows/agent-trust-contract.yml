# The real Claude Code and Codex read the folder trust Hide records for a
# worktree it made, on every system (docs/agent-hooks.md, Folder trust for
# the worktrees Hide makes).
#
# Each leg installs the pinned Claude Code and Codex from npm into the
# runner, then runs the two real-binary checks in a throwaway home: Codex's
# app-server loads a worktree's own settings once Hide trusted it and stops
# once Hide took the trust out (`hide-agent-hooks/tests/it/codex_binary.rs`),
# and Claude Code in a pane of the pinned Herdr starts at its prompt in the
# worktree Hide trusted and asks its question in another
# (`herdr-core/src/agent_start/real_agent_trust_tests.rs`). The format,
# preservation and removal tests run on every pull request in `rust` and
# `windows check`; this registry install runs only in `nightly.yml`, so a
# network failure that is not Hide's never holds a pull request.
#
# The versions are the ones the checks were written against; move them with
# the trust question and the format they check.
name: agent trust contract

on:
  workflow_call:
    inputs:
      systems:
        description: The systems to run, as a JSON array of `linux`, `macos` and `windows`.
        type: string
        required: true
    # The development issues App's key (docs/TESTING.md, Flaky tests). A run
    # without it, such as a fork's, files no issue and passes as before.
    secrets:
      HIDE_ISSUES_APP_KEY:
        required: false

permissions:
  contents: read

jobs:
  contract:
    name: agent trust contract (${{ matrix.system }})
    runs-on: ${{ fromJSON('{"linux":"ubuntu-latest","macos":"macos-15","windows":"windows-latest"}')[matrix.system] }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        system: ${{ fromJSON(inputs.systems) }}
    defaults:
      run:
        shell: bash
    env:
      # One package and target list for every step, so cargo resolves features
      # once and builds the test binaries once.
      TEST_TARGETS: -p hide-agent-hooks -p herdr-core --lib --test it
    steps:
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          save-if: false
      - name: Install zsh on Linux
        # The Herdr fetch script is zsh; the Linux image has none.
        if: ${{ matrix.system == 'linux' }}
        timeout-minutes: 3
        run: sudo apt-get install -y --no-install-recommends zsh
      - name: Install cargo-nextest
        timeout-minutes: 3
        run: bash scripts/install-nextest.sh
      - name: Build the test binaries
        timeout-minutes: 25
        run: bash scripts/verify-cargo.sh nextest --profile ci $TEST_TARGETS --no-run
      - name: Install Claude Code and Codex
        # At the versions contracts/agent-clis.json pins; the outputs are each
        # program's path (Codex's `.cmd` shim on Windows, Claude Code's native
        # binary on every system).
        id: agents
        timeout-minutes: 5
        run: python3 scripts/install-agent-clis.py claude codex
      - name: Fetch the pinned Herdr runtime
        id: herdr
        timeout-minutes: 5
        # Assigned first, so a failed fetch fails this step rather than
        # handing the next one an empty path.
        run: |
          case "$RUNNER_OS" in
            Windows) bin=$(pwsh -NoProfile -File scripts/fetch-herdr-runtime.ps1 | tr -d '\r') ;;
            Linux) bin=$(zsh scripts/fetch-herdr-runtime.sh --platform linux-x86_64) ;;
            *) bin=$(zsh scripts/fetch-herdr-runtime.sh --platform macos-aarch64) ;;
          esac
          echo "bin=$bin" >> "$GITHUB_OUTPUT"
      - name: The real Codex and Claude Code read the trust Hide records
        timeout-minutes: 10
        env:
          HIDE_CODEX_BINARY: ${{ steps.agents.outputs.codex }}
          HIDE_TEST_CLAUDE_BIN: ${{ steps.agents.outputs.claude }}
          HIDE_E2E_HERDR_BIN: ${{ steps.herdr.outputs.bin }}
        run: bash scripts/verify-cargo.sh nextest --profile ci $TEST_TARGETS -E 'test(/^codex_binary::/) | test(/^agent_start::real_agent_trust_tests::/)' --run-ignored only --no-capture
      - name: Mint the development issues token
        # Development issues live in with-hide/hide-private (docs/TESTING.md,
        # Flaky tests); one App token reads this run here and files there. A run
        # without the App's key, such as a fork's, files nothing and stays green.
        id: issues-token
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.HIDE_ISSUES_APP_ID }}
          private-key: ${{ secrets.HIDE_ISSUES_APP_KEY }}
          owner: with-hide
          repositories: hide,hide-private
      - name: Report flaky and failed tests
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ steps.issues-token.outputs.token }}
        run: python3 scripts/ci-flaky-report.py --suite rust --junit target/nextest/ci/junit*.xml
