[package]
name = "hide-screen-rules"
version = "0.1.0"
edition = "2024"
publish = false

# No workspace-hack: the pane holder links this crate to read its own grid,
# and the holder carries its few dependencies only (.config/hakari.toml).
[dependencies]
regex = "=1.13.1"
serde = { version = "=1.0.229", features = ["derive"] }

[dev-dependencies]
toml = "=1.1.8"
