[package]
name = "hide-relay-ios"
version = "0.1.0"
edition = "2024"
publish = false

# The iOS app links the static library; the rlib is for this crate's tests on the machine that builds it.
[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
hide-relay-protocol = { path = "../hide-relay-protocol" }
