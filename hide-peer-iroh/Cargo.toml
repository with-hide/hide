[package]
name = "hide-peer-iroh"
version = "0.1.0"
edition = "2024"
publish = false

# The one crate that links iroh and noq (PRD device-connect-iroh D-63,
# D-64): an iroh endpoint as a `hide_peer::PeerTransport`. It keeps no
# product state; keys, grants and the rule for which connection stays are
# `hide-peer`'s.
#
# The versions are exact, with no default features: a new minor is taken in
# a pull request of its own that runs the network gate.
# `scripts/check-iroh-stays-behind-the-seam.py` refuses any other member
# that depends on this crate's transport dependencies.

[dependencies]
# A connection's path changes are a stream (`Connection::paths_stream`).
futures-util = "=0.3.34"
hide-peer = { path = "../hide-peer" }
hide-peer-protocol = { path = "../hide-peer-protocol" }
iroh = { version = "=1.5.0", default-features = false, features = ["tls-ring"] }
iroh-mdns-address-lookup = "=0.6.1"
noq = { version = "=1.5.0", default-features = false }
# iroh's own HTTP client, with the features iroh asks of it: one request to
# the relay's host, for the reason this machine is not attached (B34).
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider"] }
tokio = { version = "=1.54.1", features = ["io-util", "macros", "rt", "sync", "time"] }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
tempfile = "=3.27.0"
tokio = { version = "=1.54.1", features = ["net", "rt-multi-thread"] }
