[package]
name = "herdr-core"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "herdr_core"

[dependencies]
hide-agent-adapter = { path = "../hide-agent-adapter" }
anyhow = "=1.0.104"
hide-agent-hooks = { path = "../hide-agent-hooks" }
hide-kit = { path = "../hide-kit" }
hide-ai = { path = "../hide-ai" }
hide-herdr-client = { path = "../hide-herdr-client" }
hide-host = { path = "../hide-host" }
hide-node-link = { path = "../hide-node-link" }
hide-memory = { path = "../hide-memory" }
hide-platform = { path = "../hide-platform" }
hide-project = { path = "../hide-project" }
hide-session = { path = "../hide-session" }
base64 = "=0.23.1"
cap-std = "=4.0.3"
jiff = { version = "=0.2.38", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo", "tzdb-concatenated", "tzdb-bundle-platform"] }
libc = "=0.2.190"
percent-encoding = "=2.3.2"
regress = "=0.12.0"
regex = "=1.13.1"
rusqlite = { version = "=0.32.1", features = ["bundled"] }
schemars = { version = "=0.8.22", features = ["preserve_order"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["raw_value"] }
sha2 = "=0.10.9"
tokio = { version = "=1.53.3", features = ["io-util", "net", "rt-multi-thread", "sync", "time"] }
tempfile = "=3.27.0"
unicode-normalization = "=0.1.25"
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[build-dependencies]
serde_json = "=1.0.154"
typify = "=0.8.0"

[dev-dependencies]
hide-node = { path = "../hide-node" }
hex = "=0.4.3"
md5 = "=0.8.1"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
