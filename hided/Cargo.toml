[package]
name = "hided"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "hided"
path = "src/bin/hided.rs"

[[bin]]
name = "hide"
path = "src/bin/hide.rs"

[dependencies]
hide-agent-adapter = { path = "../hide-agent-adapter" }
herdr-core = { path = "../herdr-core" }
hide-host = { path = "../hide-host" }
hide-node = { path = "../hide-node" }
hide-node-link = { path = "../hide-node-link" }
hide-platform = { path = "../hide-platform" }
hide-kit = { path = "../hide-kit" }
hide-herdr-client = { path = "../hide-herdr-client" }
hide-session = { path = "../hide-session" }
axum = { version = "=0.8.9", features = ["ws"] }
tokio = { version = "=1.53.2", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
jiff = { version = "=0.2.38", default-features = false, features = ["std"] }
hex = "=0.4.3"
getrandom = "=0.2.16"
libc = "=0.2.190"
base64 = "=0.23.1"
subtle = "=2.6.1"
cap-std = "=4.0.3"
percent-encoding = "=2.3.2"
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["connect"] }
futures-util = "=0.3.34"
# Web Push: VAPID signing and RFC 8291 encryption (ring), and the POST to the
# push service (ureq over rustls). Both are already in the build through
# hide-memory and herdr-core.
ring = "=0.17.14"
ureq = { version = "=3.4.2", default-features = false, features = ["rustls"] }
# A device pane's command stream arrives as bytes over its node link and is
# served as HTTP in process (`server::serve_link_connection`); axum already
# builds both.
hyper = { version = "=1.12.0", features = ["http1", "server"] }
hyper-util = { version = "=0.1.21", features = ["service", "tokio"] }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
tempfile = "=3.27.0"
md5 = "=0.8.1"
rusqlite = { version = "=0.32.1", features = ["bundled"] }
anyhow = "=1.0.104"
hide-agent-hooks = { path = "../hide-agent-hooks" }
# The core's Memory store a journey seeds, keyed by the Project it reads.
hide-memory = { path = "../hide-memory" }
hide-project = { path = "../hide-project" }
# The loopback SSH server of the device link's tests (tests/support).
russh = { version = "=0.64.1", default-features = false, features = ["ring", "rsa"] }
http-body-util = "=0.1.5"
hyper = { version = "=1.12.0", features = ["client", "http1", "server"] }
hyper-util = { version = "=0.1.21", features = ["client-legacy", "http1", "service", "tokio"] }
tower = "=0.5.3"
