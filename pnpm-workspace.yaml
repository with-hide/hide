packages:
  - web
  - desktop
  - mobile
  # The pane holder's screen tests draw its fragments on an xterm of their own.
  - hide-holder/tests/xterm

# Build scripts run only for esbuild. pnpm 10 (CI) reads `onlyBuiltDependencies`
# and pnpm 11 and later read `allowBuilds`, refusing an install that leaves a
# package unnamed there, so the two lists say the same thing. Both are read at
# the workspace root, not from a member package.json. `electron` needs none: it
# downloads its runtime on first launch. `electron-winstaller` (pulled in by
# electron-builder's Squirrel target, which the package script does not build)
# stays off, as pnpm 10 has always left it.
allowBuilds:
  electron-winstaller: false
  esbuild: true

onlyBuiltDependencies:
  - esbuild
