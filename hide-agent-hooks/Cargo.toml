[package]
name = "hide-agent-hooks"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "hide_agent_hooks"

[[bin]]
name = "hide-agent-hooks"
path = "src/bin/hide-agent-hooks.rs"

[dependencies]
base64 = "=0.23.1"
hide-agent-adapter = { path = "../hide-agent-adapter" }
# Hide AI's tool-free folder for agy, whose trust this crate records.
hide-ai = { path = "../hide-ai" }
hide-herdr-client = { path = "../hide-herdr-client" }
hide-memory = { path = "../hide-memory" }
hide-platform = { path = "../hide-platform" }
hide-project = { path = "../hide-project" }
hide-shell = { path = "../hide-shell" }
# Gitignore-style matching of the guardrails' protected paths.
ignore = "=0.4.33"
serde = { version = "=1.0.229", features = ["derive"] }
# Keep key order and borrow exact source spans while editing owned entries.
serde_json = { version = "=1.0.151", features = ["preserve_order", "raw_value"] }
# Hashes the OpenCode plugin's body, so an edit by the operator is told from Hide's own text.
sha2 = "=0.10.9"
# Edits Grok's folder trust (`trusted_folders.toml`) keeping the rest of the file.
toml_edit = "=0.25.17"
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.190"

[dev-dependencies]
rusqlite = { version = "=0.32.1", features = ["bundled"] }
tempfile = "=3.27.0"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
