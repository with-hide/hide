# cargo-hakari keeps `workspace-hack`, a crate every member depends on that
# turns on, for each third-party crate, the union of the features any member
# asks of it. Without it a dependency's features depend on which members a
# cargo command selects (`-p`, `--workspace`, `--bins`), and each set built
# the dependency and everything above it once more: about half of a debug
# target. docs/BUILD.md, "One feature set per dependency", owns the reasons
# and the commands; CI fails when the crate is out of date.
hakari-package = "workspace-hack"
dep-format-version = "4"
# The v2 and v3 resolvers are the same to hakari; the workspace uses v3.
resolver = "2"
# The systems this workspace is built and packaged for.
platforms = [
    "aarch64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]
# Versions are written as semver ranges, not the exact pins the members use:
# Cargo.lock decides the version either way, and a range leaves this crate
# unchanged by the patch and minor bumps Dependabot proposes each week.

# The operating-system layer stays off the shared feature set: the OS
# contract lanes build and test exactly that crate, which would otherwise
# compile tokio, hyper and schemars for nothing. The terminal
# parser stays off it for the same reason: the vt lane builds it alone. The
# pane holder that links it, and the protocol it speaks, stay off it too: a
# holder runs for as long as its pane and carries its few dependencies only,
# the screen rules it will evaluate among them.
# Their own dependencies still count toward everyone else's features.
[final-excludes]
# The relay protocol also builds for browsers; the native workspace feature
# union includes OS-only crates which cannot enter that WASM module.
workspace-members = ["hide-platform", "hide-vt", "hide-holder", "hide-holder-protocol", "hide-screen-rules", "hide-relay-protocol", "hide-relay-ios"]
