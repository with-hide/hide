# cargo-nextest, which CI runs the Rust suite with (scripts/verify-cargo.sh
# nextest). The `ci` profile retries a failed test once: a test that passes the
# retry is flaky, the run passes, and scripts/ci-flaky-report.py files it from
# the JUnit report. A test that fails twice fails the lane. The signed-in agy
# turn below is the one test it does not retry. The default profile retries
# nothing, so a flaky test fails where it is written.
# docs/TESTING.md, "Flaky tests", owns the policy.
#
# A nextest older than 0.9.145 on macOS lets a test inherit the output pipe of
# a test started beside it and reports the other as LEAK; CI installs the pin
# in scripts/install-nextest.sh, and an older local nextest warns here.
nextest-version = { recommended = "0.9.145" }

[profile.ci]
retries = 1
# Run every test, so one run reports every flaky test and every failure.
fail-fast = false
# A test still running after two periods is ended and fails with its name, so
# a hang is retried and reported like any other failure instead of holding the
# lane until a step or job limit cancels it with no test named. It is a hang
# guard, not a deadline: in the green runs of 2026-10-05 (about 100 jobs
# across every Rust lane) the slowest test took 21 s and none but the one
# below reached 60 s. Two hung attempts (with nextest's 10 s grace each) end
# within 260 s, inside the shortest step limit that runs nextest (5 minutes).
slow-timeout = { period = "60s", terminate-after = 2 }

[profile.ci.junit]
path = "junit.xml"

# Temporary boundary observations, including a passing first attempt.
[[profile.ci.overrides]]
filter = 'binary_id(hide-agent-hooks::it) & test(/^windows_hook_command::agys_windows_(session|guard)_/)'
success-output = "immediate"

# The remote mailbox test drives two Herdr servers over SSH. It took 38 to
# 63 s on the macOS runner in 19 green runs, and 36.7 s on the Linux runner
# once the fixture's SSH server set TCP_NODELAY (one run, so the guard is sized
# from the macOS spread); before that its install alone passed the product's
# 120 s bound. It is ended at 240 s, and two hung attempts still end inside its
# step's 10-minute limit.
[[profile.ci.overrides]]
filter = 'binary_id(hided::it) & test(/^remote_delivery::/)'
slow-timeout = { period = "60s", terminate-after = 4 }

# The remote-core journeys (hided/tests/it/remote_core.rs) start two hided
# and two Herdr servers over SSH; several wait out a 30 to 60 s bound of the
# product on purpose (a node's link returning, a screen held while its core
# is away), so the default guard would end a healthy journey at 120 s on a
# loaded runner. They get the remote mailbox's 240 s, and two hung attempts
# still end inside their step's 10-minute limit.
[[profile.ci.overrides]]
filter = 'binary_id(hided::it) & test(/^remote_core::/)'
slow-timeout = { period = "60s", terminate-after = 4 }

# The signed-in agy turn (hide-agent-hooks/tests/it/agy_binary.rs) waits on
# a real model on the CI key's free tier, which took 10 to 68 s in the
# green runs of 2026-10-16 and more than 120 s on a macOS
# runner in run 38892775919. It gets 240 s, and its own bounds (agy's print
# timeout, the capture) end inside that, so a slow turn fails with what agy
# said instead of being ended with nothing reported.
# It is not retried: a retry spends the key's daily requests again, and once
# they are spent a retry reports Not measured and passes, which would turn a
# real first failure into a flaky pass. A passing turn's output is shown, so
# its Not measured warning reaches the job log even without --no-capture.
[[profile.ci.overrides]]
filter = 'binary_id(hide-agent-hooks::it) & test(=agy_binary::a_signed_in_agy_turn_fires_hide_s_hooks)'
slow-timeout = { period = "60s", terminate-after = 4 }
retries = 0
success-output = "immediate"

# The core-move journeys (hided/tests/it/core_move.rs) run the remote-core
# shape and wait out the move's own bounds (a 30 s link, a 60 s pending
# lease), so they get the same guard.
[[profile.ci.overrides]]
filter = 'binary_id(hided::it) & test(/^core_move::/)'
slow-timeout = { period = "60s", terminate-after = 4 }
