// Read by the Capacitor library too (its build.gradle takes these when the root project defines them), so the app and
// the library build against one set of versions.
ext {
    // Android 9: the oldest system whose Keystore can require an unlocked device for a key (PairingStore).
    minSdkVersion = 28
    compileSdkVersion = 36
    targetSdkVersion = 36
    androidxActivityVersion = '1.11.0'
    androidxAppCompatVersion = '1.7.1'
    androidxCoordinatorLayoutVersion = '1.3.0'
    androidxCoreVersion = '1.17.0'
    androidxFragmentVersion = '1.8.9'
    androidxWebkitVersion = '1.14.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.3.0'
    androidxTestRunnerVersion = '1.7.0'
    androidxEspressoCoreVersion = '3.7.0'
    cordovaAndroidVersion = '14.0.1'
    codeScannerVersion = '16.1.0'
    firebaseMessagingVersion = '26.0.1'
    orgJsonVersion = '20250517'
}
