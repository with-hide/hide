import groovy.json.JsonSlurper

apply plugin: 'com.android.application'

// The app's own version, separate from the iOS app's (mobile/package.json): mobile/android/version.json.
def appVersion = new JsonSlurper().parse(rootProject.file('version.json')).version
if (!(appVersion ==~ /^[0-9]+\.[0-9]+\.[0-9]+$/)) {
    throw new GradleException("mobile/android/version.json must hold a version shaped X.Y.Z, not ${appVersion}")
}
// The store's version code: a release passes the Unix minute of its run (`-PhideVersionCode`, build-android.sh release),
// which rises with every run and is never written into the repository; a debug build is 1.
def versionCodeArgument = project.findProperty('hideVersionCode')
if (versionCodeArgument != null && !(versionCodeArgument ==~ /^[1-9][0-9]{0,9}$/ && (versionCodeArgument as long) <= 2100000000L)) {
    throw new GradleException("hideVersionCode must be a whole number from 1 to 2100000000, not ${versionCodeArgument}")
}
def appVersionCode = versionCodeArgument == null ? 1 : versionCodeArgument as int

android {
    namespace = "me.grab.hide.android"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "me.grab.hide.android"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    buildFeatures {
        buildConfig = true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    androidResources {
        // Capacitor's pattern: aapt's default without `<dir>_*`, which would drop a bundle folder whose name starts with `_`.
        ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
    }
    sourceSets {
        // The notice sealer both kinds of tests encrypt with, as hided does.
        test.java.srcDirs += 'src/sharedTest/java'
        androidTest.java.srcDirs += 'src/sharedTest/java'
    }
    testOptions {
        unitTests.returnDefaultValues = false
        unitTests.all {
            // The iOS app's notice words, which NoticeWordsTest holds the Android table equal to.
            systemProperty 'hide.iosNoticeWords', rootProject.file('../ios/App/HidePushCore/Sources/HidePushCore/NoticeWords.swift').path
        }
    }
}

// The whole list of what the app links: Capacitor's library, the AndroidX parts the shell calls, Google's code scanner
// and Firebase Cloud Messaging (no analytics, no advertising id). mobile/scripts/check-versions.mjs holds this list too,
// so a new dependency is a change to both, and the app does not apply `capacitor.build.gradle`, the file through which
// `cap sync` would link an npm plugin. The JVM tests read JSON with the reference org.json, which a phone has built in
// (android.jar's copy is a stub).
dependencies {
    implementation project(':capacitor-android')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    implementation "com.google.android.gms:play-services-code-scanner:$codeScannerVersion"
    implementation "com.google.firebase:firebase-messaging:$firebaseMessagingVersion"
    testImplementation "junit:junit:$junitVersion"
    testImplementation "org.json:json:$orgJsonVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test:runner:$androidxTestRunnerVersion"
}
