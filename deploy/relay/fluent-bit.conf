[SERVICE]
    Flush 5
    Grace 5
    Log_Level error
    Parsers_File /opt/hide-relay/current/parsers.conf
    HTTP_Server On
    HTTP_Listen 127.0.0.1
    HTTP_Port 2020
    Health_Check On
    HC_Errors_Count 0
    HC_Retry_Failure_Count 0
    HC_Period 300
    scheduler.base 5
    scheduler.cap 30

[INPUT]
    Name systemd
    Tag hide-relay
    Path /var/log/journal/@MACHINE_ID@.hide-relay
    Systemd_Filter _SYSTEMD_UNIT=hide-relay.service
    DB /var/lib/hide-relay-logs/cursor.db
    Read_From_Tail Off
    Max_Entries 100
    Mem_Buf_Limit 8M
    storage.type memory

[FILTER]
    Name parser
    Match hide-relay
    Key_Name MESSAGE
    Parser relay_json
    Reserve_Data Off
    Preserve_Key Off

# Unparseable messages have no event and are dropped. Only categorical alerts
# leave the VM; no room identifiers, sizes or arbitrary fields are uploaded.
[FILTER]
    Name grep
    Match hide-relay
    Regex event ^(cap_exceeded|server_failed)$

[FILTER]
    Name record_modifier
    Match hide-relay
    Allowlist_Key event

[OUTPUT]
    Name stackdriver
    Match hide-relay
    Resource gce_instance
    Export_To_Project_Id @PROJECT_ID@
    Retry_Limit 3
