[package]
name = "hide-memory"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
hide-ai = { path = "../hide-ai" }
hide-platform = { path = "../hide-platform" }
hide-project = { path = "../hide-project" }
regex = "=1.13.1"
ring = "=0.17.14"
rusqlite = { version = "=0.32.1", features = ["bundled", "hooks"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
unicode-normalization = "=0.1.25"
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
tempfile = "=3.27.0"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
