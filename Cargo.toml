[workspace]
members = [
    "hide-agent-adapter",
    "herdr-core",
    "hide-herdr-client",
    "hide-host",
    "hide-kit",
    "hide-agent-hooks",
    "hide-ai",
    "hide-memory",
    "hide-node",
    "hide-node-link",
    "hide-platform",
    "hide-project",
    "hide-session",
    "hide-shell",
    "hided",
    "workspace-hack",
]
resolver = "3"

[profile.release]
lto = "thin"
# Sixteen units, not one: a clean release build is 15-30% faster on every
# system for 6-17% larger binaries and about 5 MiB more resident hided, with
# no slower key echo or CPU. See `The release profile` in docs/BUILD.md.
codegen-units = 16
strip = "symbols"

[profile.dev]
# An agent worktree is built a few times and discarded, so an incremental
# cache never repays what it costs; what it does instead is grow one cache
# per worktree. See `Build Output Belongs To Its Worktree` in AGENTS.md.
incremental = false
# No debug info, for the workspace's crates and every dependency: it was most
# of a debug build's size (65% of a dependency's objects, half of herdr-core's
# even at line tables only), and on macOS line tables also keep every linked
# object file beside the test binaries. A panic still names its file and
# line; a backtrace names functions only. docs/BUILD.md, "Debug builds carry
# no debug info", owns the measurement and how to turn it back on locally.
debug = false

# A device's node is installed over SSH with each file's SHA-256 taken
# here first, and a development daemon installs its own debug build, whose
# `hided` and `hide` are about 140 MB each. Unoptimized, the digest alone
# took longer than the remote mailbox lane waits for a ready device.
[profile.dev.package.sha2]
opt-level = 3
