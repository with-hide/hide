# The [screen] rules are Herdr v0.9.5's agent detection manifest for this agent
# (https://github.com/herdrdev/herdr, commit 2ecf19a, src/detect/manifests/letta.toml).
# Copyright 2025 herdr contributors. Licensed under the Apache License,
# Version 2.0; see NOTICE at the repository root.
# Changed by Hide: the manifest's id and aliases became this file's identity
# and its version, engine and rules moved under [screen], unchanged; its
# alias with a space is left out, since a program is a plain file name.
schema = 1
id = "letta"
name = "Letta Code"
executables = ["letta", "letta-code"]
hooks = "none"

[screen]
version = "2026.08.24.1"
min_engine_version = 3
updated_at = "2026-08-24T00:00:00Z"

[[screen.rules]]
id = "osc_progress_blocked"
state = "blocked"
priority = 1400
region = "osc_progress"
visible_blocker = true
regex = ['^4;3(?:;|$)']

[[screen.rules]]
id = "osc_title_blocked"
state = "blocked"
priority = 1300
region = "osc_title"
visible_blocker = true
regex = ['^\[ [!.] \] Action Required(?: \| |$)']

[[screen.rules]]
id = "command_approval"
state = "blocked"
priority = 1200
region = "bottom_non_empty_lines(20)"
visible_blocker = true
contains = ["Run this command?", "Enter to select · Esc to cancel"]

[[screen.rules]]
id = "osc_title_working"
state = "working"
priority = 900
region = "osc_title"
visible_working = true
regex = ['(?:^| )[⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏](?: |$)']

[[screen.rules]]
id = "active_status"
state = "working"
priority = 850
region = "bottom_non_empty_lines(8)"
visible_working = true
line_regex = ['^\s*(?:\S+\s+)+is(?: \S+)*… \((?:esc to interrupt(?: · .*)?|interrupting)\)\s*$']

[[screen.rules]]
id = "running_tool"
state = "working"
priority = 800
region = "bottom_non_empty_lines(8)"
visible_working = true
line_regex = ['^\s*(?:└\s*)?Running\.\.\.\s*(?:\(.*\))?$']

[[screen.rules]]
id = "profile_selector"
state = "unknown"
priority = 700
region = "bottom_non_empty_lines(12)"
contains = ["Create a new agent (--new)", "Enter select · Esc exit"]

[[screen.rules]]
id = "composer_input"
state = "unknown"
priority = 150
region = "bottom_non_empty_lines(8)"
line_regex = ['^\s*›\s+\S.*$']
not = [
  { line_regex = ['^\s*›\s+Try\s+"'] },
]

[[screen.rules]]
id = "composer_idle"
state = "idle"
priority = 100
region = "bottom_non_empty_lines(8)"
visible_idle = true
any = [
  { line_regex = ['^\s*›\s*$'] },
  { line_regex = ['^\s*›\s+Try\s+"'] },
]
not = [
  { line_regex = ['^\s*(?:\S+\s+)+is(?: \S+)*… \((?:esc to interrupt(?: · .*)?|interrupting)\)\s*$'] },
  { line_regex = ['^\s*(?:└\s*)?Running\.\.\.\s*(?:\(.*\))?$'] },
]

[[screen.rules]]
id = "no_live_state_evidence"
state = "unknown"
priority = 0
region = "whole_recent"
regex = ['(?s)^.*$']
