# The [screen] rules are Herdr v0.9.5's agent detection manifest for this agent
# (https://github.com/herdrdev/herdr, commit 2ecf19a, src/detect/manifests/cline.toml).
# Copyright 2025 herdr contributors. Licensed under the Apache License,
# Version 2.0; see NOTICE at the repository root.
# Changed by Hide: the manifest's id and aliases became this file's identity
# and its version, engine and rules moved under [screen], unchanged.
schema = 1
id = "cline"
name = "Cline"
executables = ["cline", ".cline"]
hooks = "none"

[screen]
version = "2026.09.11.1"
min_engine_version = 1
updated_at = "2026-09-11T00:00:00Z"

[[screen.rules]]
id = "tool_permission"
state = "blocked"
priority = 300
region = "whole_recent"
visible_blocker = true
any = [
  { contains = ["let cline use this tool"] },
  { contains = ["[act mode]", "execute command?", "yes"] },
  { contains = ["[act mode]", "use this tool?", "yes"] },
  { contains = ["[plan mode]", "execute command?", "yes"] },
  { contains = ["[plan mode]", "use this tool?", "yes"] },
]

[[screen.rules]]
id = "inline_tool_permission"
state = "blocked"
priority = 300
region = "bottom_non_empty_lines(16)"
visible_blocker = true
contains = ["Cline needs permission", "Approve tool call?", "[y] Approve", "[n] Deny"]

[[screen.rules]]
id = "inline_question"
state = "blocked"
priority = 300
region = "bottom_non_empty_lines(24)"
visible_blocker = true
line_regex = ['^\s*Cline is asking a question\s*$', '^\s*>\s+\S']
contains = ["(Tab)", "Shift+Tab"]

[[screen.rules]]
id = "active_turn"
state = "working"
priority = 200
region = "bottom_non_empty_lines(20)"
visible_working = true
any = [
  { line_regex = ['^\s*[\x{2801}-\x{28FF}]\s+\S'] },
  { contains = ["Thinking... (esc to cancel)"] },
]

[[screen.rules]]
id = "composer_idle"
state = "idle"
priority = 100
region = "bottom_non_empty_lines(12)"
visible_idle = true
line_regex = ['^\s*❯(?:\s.*)?$']
contains = ["─", "(Tab)", "Shift+Tab"]

[[screen.rules]]
id = "default_cline_working"
state = "working"
priority = -10
region = "whole_recent"
visible_working = true
regex = ['(?s).+']
