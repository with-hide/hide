# The [screen] rules are Herdr v0.9.5's agent detection manifest for this agent
# (https://github.com/herdrdev/herdr, commit 2ecf19a, src/detect/manifests/pi.toml).
# Copyright 2025 herdr contributors. Licensed under the Apache License,
# Version 2.0; see NOTICE at the repository root.
# Changed by Hide: the manifest's id and aliases became this file's identity
# and its version, engine and rules moved under [screen], unchanged.
schema = 1
id = "pi"
name = "Pi"
executables = ["pi"]
packages = ["@earendil-works/pi-coding-agent"]
home = "~/.pi/agent"
hooks = "pi"

[resume]
session = ["--session", "{session}"]

# Where an account's folders are (docs/ARCHITECTURE.md, Agent profiles and
# accounts).
[account]
by = "folder"

[account.login]
at = "login"
any = ["/*/key", "/*/env", "/*/access", "/*/refresh"]

[account.vars]
PI_CODING_AGENT_DIR = { default = "~/.pi/agent", profile = "{account}" }

[account.paths]
hooks = false
hook_trust = false
plugins = "{PI_CODING_AGENT_DIR}/extensions"
skills = "shared"
folder_trust = "{PI_CODING_AGENT_DIR}/trust.json"
folder_trust_format = "pi"
sessions = "{PI_CODING_AGENT_DIR}/sessions"
login = "{PI_CODING_AGENT_DIR}/auth.json"
state = "{PI_CODING_AGENT_DIR}"
usage = false
mcp = "{PI_CODING_AGENT_DIR}/mcp.json"
mcp_format = "pi"

[account.forbid]
vars = ["PI_CODING_AGENT_SESSION_DIR"]

[screen]
version = "2026.11.26.1"
min_engine_version = 1
updated_at = "2026-11-26T00:00:00Z"

# Pi 1.0.4's question whether to trust a folder, drawn at its first start in
# a folder whose project files it would load. Read as idle, a brief typed
# there was taken by it, its Enter picking "Trust" (measured 2026-11-26,
# tests/fixtures/screens/pi/blocked-trust-folder.txt); read as this
# question, the start waits for the operator's answer. Only the dialog at
# the foot of the screen counts: its title and its "Do not trust" choice each
# a whole line, and its key line the last text above its closing rule. A
# conversation that quotes the dialog has Pi's composer and status lines
# under it (tests/fixtures/screens/pi/working-quotes-trust-folder.txt), and a
# narrow pane wraps the dialog over more lines
# (tests/fixtures/screens/pi/blocked-trust-folder-narrow.txt).
[[screen.rules]]
id = "trust_folder"
state = "blocked"
asks = "folder_trust"
priority = 950
region = "bottom_non_empty_lines(24)"
visible_blocker = true
all = [
  { line_regex = ['^\s*Trust project folder\?\s*$'] },
  { line_regex = ['^\s*(→\s*)?Do not trust\s*$'] },
  { regex = ['↑↓ navigate\s+enter select[^\n]*\n[─\s]*\z'] },
]

[[screen.rules]]
id = "working_literal"
state = "working"
priority = 100
region = "whole_recent"
visible_working = true
any = [
  { contains = ["Working..."] },
  { line_regex = ['^[⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏] Working$'] },
]

[[screen.rules]]
id = "working_border"
state = "working"
priority = 100
region = "bottom_non_empty_lines(12)"
visible_working = true
any = [
  { line_regex = ['^── [⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏] Working ─+$'] },
  { line_regex = ['^[⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏] Working$'] },
]

# How a running session changes its model and its thinking level
# (docs/ARCHITECTURE.md, A session's model and effort), each checked in a
# terminal of Pi 1.0.4 on 2026-11-26; the levels are the ones it names for a
# word it does not know.
[switch]
model = "/model {model}"
effort = "/thinking {effort}"
efforts = ["off", "low", "medium", "high", "xhigh", "max"]
