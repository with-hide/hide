# The [screen] rules are Herdr v0.9.5's agent detection manifest for this agent
# (https://github.com/herdrdev/herdr, commit 2ecf19a, src/detect/manifests/grok.toml).
# Copyright 2025 herdr contributors. Licensed under the Apache License,
# Version 2.0; see NOTICE at the repository root.
# Changed by Hide: the manifest's id and aliases became this file's identity
# and its version, engine and rules moved under [screen], unchanged.
schema = 1
id = "grok"
name = "Grok"
executables = ["grok"]
packages = ["@xai-official/grok"]
home = "~/.grok"
hooks = "grok"

[resume]
session = ["--resume", "{session}"]

# Where an account's folders are (docs/ARCHITECTURE.md, Agent profiles and
# accounts).
[account]
by = "folder"

[account.login]
at = "login"
any = ["/*/key", "/*/access_token", "/*/refresh_token"]

[account.vars]
GROK_HOME = { default = "~/.grok", profile = "{account}" }

[account.paths]
hooks = "{GROK_HOME}/hooks/hide.json"
hook_trust = false
plugins = false
skills = "shared"
folder_trust = "{GROK_HOME}/trusted_folders.toml"
folder_trust_format = "grok"
sessions = "{GROK_HOME}/sessions"
login = "{GROK_HOME}/auth.json"
state = "{GROK_HOME}"
usage = false
mcp = "{GROK_HOME}/config.toml"
mcp_format = "grok"
[screen]
version = "2026.10.05.1"
min_engine_version = 3
updated_at = "2026-10-05T00:00:00Z"

[[screen.rules]]
id = "osc_title_blocked"
state = "blocked"
priority = 1300
region = "osc_title"
visible_blocker = true
contains = ["Action Required"]

[[screen.rules]]
id = "option_dialog_blocked"
state = "blocked"
priority = 1200
region = "whole_recent"
visible_blocker = true
line_regex = ['^\s*┃\s+[0-9a-z]+\s+\([●○]\)\s']

[[screen.rules]]
id = "permission_hints_blocked"
state = "blocked"
priority = 1190
region = "bottom_non_empty_lines(2)"
visible_blocker = true
contains = [":select", "ctrl+o:yolo", "ctrl+c:cancel"]

[[screen.rules]]
id = "question_dialog_hints_blocked"
state = "blocked"
priority = 1185
region = "bottom_non_empty_lines(2)"
visible_blocker = true
contains = ["tab:scrollback", "shift+x:dismiss"]

# Pre-0.2.x permission UI kept for older Grok Build releases.
[[screen.rules]]
id = "permission_scope_selector"
state = "blocked"
priority = 1180
region = "whole_recent"
visible_blocker = true
contains = ["yes, proceed", "no, reject"]
any = [
  { contains = ["use ← → to choose permission whitelist scope"] },
  { contains = ["←/→:scope"] },
]

# Background commands, monitors, and subagents left running after Grok returns
# to its prompt do not count as working, matching Claude and agy (#1217, #4735).

[[screen.rules]]
id = "osc_progress_working"
state = "working"
priority = 1150
region = "osc_progress"
visible_working = true
regex = ['^4;1;-1$']

[[screen.rules]]
id = "osc_title_idle"
state = "idle"
priority = 1100
region = "osc_title"
visible_idle = true
regex = ['(?:^| - )grok$']
not = [
  { regex = ['[\x{2800}-\x{28FF}]'] },
]

# Title items are configurable; omitting "grok" does not imply activity.
# Require a spinner, with OSC progress covering titles that omit it.
[[screen.rules]]
id = "osc_title_working"
state = "working"
priority = 1000
region = "osc_title"
visible_working = true
regex = ['(?:^|\s)[\x{2801}-\x{28FF}](?:\s|$)']

[[screen.rules]]
id = "osc_progress_idle"
state = "idle"
priority = 950
region = "osc_progress"
visible_idle = true
regex = ['^4;0;0$']

# Visible activity outranks idle OSC signals: disabling title updates can
# leave the startup "grok" title unchanged throughout a turn.
[[screen.rules]]
id = "spinner_status_working"
state = "working"
priority = 1160
region = "whole_recent"
visible_working = true
line_regex = ['^\s*[\x{2801}-\x{28FF}]\s.*\[stop\]\s*$']

[[screen.rules]]
id = "esc_cancel_hints_working"
state = "working"
priority = 1155
region = "bottom_non_empty_lines(2)"
visible_working = true
contains = ["ctrl+.:shortcuts"]
any = [
  { contains = ["esc:cancel"] },
  { contains = ["ctrl+c:cancel"] },
]

# Pre-0.2.x working chrome kept for older Grok Build releases.
[[screen.rules]]
id = "waiting_tool_working"
state = "working"
priority = 1140
region = "whole_recent"
visible_working = true
any = [
  { all = [{ contains = ["ctrl+c:cancel", "ctrl+enter:interject"] }, { contains = ["waiting"] }] },
  { line_regex = ['^\s*[\x{2801}-\x{28FF}]\s+(Run|Read|Search|List)\b'] },
]

[[screen.rules]]
id = "prompt_hints_idle"
state = "idle"
priority = 100
region = "bottom_non_empty_lines(2)"
visible_idle = true
contains = ["ctrl+.:shortcuts"]
not = [
  { contains = ["esc:cancel"] },
  { contains = ["ctrl+c:cancel"] },
]

# The keys that answer this agent's own question and approval screens from
# the phone, checked in a real pane of Grok Build 1.0.92 (docs/ARCHITECTURE.md,
# The mobile companion); a kind not named here is answered in the terminal.
# A plan's letters act wherever the highlight is. `s` (request changes) leaves
# the plan open with the prompt focused, so the reply the phone sends next is
# the change; `q` would quit plan mode and drop the plan. A question takes down
# and enter, but its highlighted row is shown by colour alone, so it is answered
# in the terminal.
[answer]
plan_approval = { approve = ["a"], keep_planning = ["s"] }

# How a running session changes its model and its effort (docs/ARCHITECTURE.md,
# A session's model and effort), checked in a terminal of Grok 1.0.92 on
# 2026-11-26: `/model <model> [window] [effort]` is its one command, and a
# model alone keeps the effort; the efforts are the ones it names for a word
# it does not know.
[switch]
model = "/model {model}"
effort = "/model {model} {effort}"
efforts = ["low", "medium", "high", "xhigh"]
