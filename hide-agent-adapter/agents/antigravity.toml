# The [screen] rules are Herdr v0.9.5's agent detection manifest for this agent
# (https://github.com/herdrdev/herdr, commit 2ecf19a, src/detect/manifests/antigravity.toml).
# Copyright 2025 herdr contributors. Licensed under the Apache License,
# Version 2.0; see NOTICE at the repository root.
# Changed by Hide: the manifest's id and aliases became this file's identity
# and its version, engine and rules moved under [screen], unchanged.
# Added by Hide: `asks = "folder_trust"` on the rule of its question whether
# to trust a folder, which no evaluator reads (docs/agent-hooks.md, Folder
# trust for the folders Hide starts agents in).
schema = 1
id = "antigravity"
name = "Antigravity"
executables = ["agy"]
packages = []
aliases = ["agy", "antigravity-cli", "antigravity_cli"]
home = "~/.gemini/config"
hooks = "agy"

[resume]
session = ["--conversation", "{session}"]

# Where the account's folders are (docs/ARCHITECTURE.md, Agent profiles and
# accounts): agy has no variable that moves them.
[account]
by = "none"
reason = "agy has no variable that moves its folder; only a different HOME does"

[account.paths]
hooks = "~/.gemini/config/hooks.json"
hook_trust = false
plugins = false
skills = "~/.gemini/config/skills"
folder_trust = "~/.gemini/antigravity-cli/settings.json"
folder_trust_format = "agy"
sessions = "~/.gemini/antigravity-cli/brain"
login = false
state = "~/.gemini/config"
usage = false
mcp = "~/.gemini/config/mcp_config.json"
mcp_format = "agy"
[screen]
version = "2026.10.05.1"
min_engine_version = 1
updated_at = "2026-10-05T00:00:00Z"

[[screen.rules]]
id = "permission_prompt"
state = "blocked"
priority = 300
region = "bottom_non_empty_lines(2)"
visible_blocker = true
contains = ["navigate", "tab amend"]

[[screen.rules]]
id = "question_prompt"
state = "blocked"
priority = 290
region = "bottom_non_empty_lines(2)"
visible_blocker = true
contains = ["navigate", "esc skip"]

[[screen.rules]]
id = "trust_prompt"
state = "blocked"
asks = "folder_trust"
priority = 280
region = "bottom_non_empty_lines(8)"
visible_blocker = true
contains = ["do you trust the contents of this project?", "yes, i trust this folder", "enter confirm"]

# Pre-1.1.28 permission dialog.
[[screen.rules]]
id = "legacy_permission_prompt"
state = "blocked"
priority = 270
region = "whole_recent"
visible_blocker = true
contains = ["requesting permission for:"]
any = [
  { contains = ["do you want to proceed?"] },
  { contains = ["tab amend", "edit command"] },
]

[[screen.rules]]
id = "esc_cancel_footer_working"
state = "working"
priority = 110
region = "bottom_non_empty_lines(2)"
visible_working = true
regex = ['(?m)^\s*─{3,}\s*esc to cancel\b']

[[screen.rules]]
id = "spinner_working"
state = "working"
priority = 100
region = "bottom_non_empty_lines(12)"
visible_working = true
line_regex = ['^\s*[\u2801-\u28FF]+\s+\S']

# The keys that answer this agent's own question and approval screens from
# the phone, each checked in a real pane of Antigravity CLI 1.5.14 (docs/ARCHITECTURE.md,
# The mobile companion); a kind not named here is answered in the terminal.
# The keys other than esc and a letter count from the highlighted row, so each
# is typed only while the screen draws `marker` before the row `row` names there.
[answer]
marker = ">"
question = { down = "down", pick = "enter", row = "{n}." }
# No row: agy marks no end under the command it asks for, so a command of more lines could not be
# told from one, and its permission is answered in the terminal.
permission = { allow = ["enter"], deny = ["down", "down", "down", "enter"] }

# How a running session changes its model and its effort (docs/ARCHITECTURE.md,
# A session's model and effort), each checked in a terminal of agy 1.5.18 on
# 2026-11-26; the efforts are the ones it names for a word it does not know.
[switch]
model = "/model {model}"
effort = "/effort {effort}"
efforts = ["low", "medium", "high", "xhigh", "max"]
