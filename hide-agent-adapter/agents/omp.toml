schema = 1
id = "omp"
name = "omp"
executables = ["omp"]
packages = ["@oh-my-pi/pi-coding-agent"]
home = "~/.omp/agent"
hooks = "omp"

[resume]
session = ["--resume", "{session}"]

# Where an account's folders are (docs/ARCHITECTURE.md, Agent profiles and
# accounts): omp's own profiles, ~/.omp/profiles/<name>/agent.
[account]
by = "name"

[account.vars]
OMP_PROFILE = { profile = "{account}" }

[account.paths]
hooks = false
hook_trust = false
plugins = { default = "~/.omp/agent/extensions", profile = "~/.omp/profiles/{account}/agent/extensions" }
skills = "shared"
folder_trust = false
sessions = { default = "~/.omp/agent/sessions", profile = "~/.omp/profiles/{account}/agent/sessions" }
login = { default = "~/.omp/agent/agent.db", profile = "~/.omp/profiles/{account}/agent/agent.db" }
state = { default = "~/.omp/agent", profile = "~/.omp/profiles/{account}/agent" }
usage = false
mcp = { default = "~/.omp/agent/mcp.json", profile = "~/.omp/profiles/{account}/agent/mcp.json" }
mcp_format = "claude"

[account.forbid]
vars = ["PI_CODING_AGENT_DIR", "PI_PROFILE", "PI_CONFIG_DIR"]

# The keys that answer this agent's own question and approval screens from
# the phone, each checked in a real pane of oh-my-pi (docs/ARCHITECTURE.md,
# The mobile companion); a kind not named here is answered in the terminal.
# The keys other than esc and a letter count from the highlighted row, so each
# is typed only while the screen draws `marker` before the row `row` names there.
# Its rows are not numbered: a question's rows are its choices, so a question is
# answered from the phone; a plan's and a permission's rows are fixed words with
# no place to count by, so those are answered in the terminal.
[answer]
marker = "❯"
question = { down = "down", pick = "enter", row = "○ {label}" }
plan_approval = { approve = ["enter"], keep_planning = ["down", "down", "down", "enter"] }
permission = { allow = ["enter"], deny = ["esc"] }

# The commands Desk keeps out of this agent's own command list
# (docs/ARCHITECTURE.md, Desk's commands): move, wt and ssh take Desk's session to another
# folder, tree or machine, plugins and force change what the agent loads or runs,
# and session delete removes the session Desk resumes.
[desk]
left_out = ["move", "wt", "ssh", "plugins", "force", "session delete"]

# How a running session changes its thinking level (docs/ARCHITECTURE.md, A
# session's model and effort), checked in a terminal of omp 18.7.0 on 2026-11-26.
# Its `/model` opens a picker and takes no model as a word (one is sent to the
# model as a prompt), so its model is changed in that picker only.
[switch]
effort = "/effort {effort}"
efforts = ["off", "auto", "low", "medium", "high", "xhigh", "max"]

# Esc aborts the turn under way, as in Pi.
[interrupt]
keys = ["esc"]
