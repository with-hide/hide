# The [screen] rules are Herdr v0.9.5's agent detection manifest for this agent
# (https://github.com/herdrdev/herdr, commit 2ecf19a, src/detect/manifests/codex.toml).
# Copyright 2025 herdr contributors. Licensed under the Apache License,
# Version 2.0; see NOTICE at the repository root.
# Changed by Hide: the manifest's id and aliases became this file's identity
# and its version, engine and rules moved under [screen], unchanged but for
# the rules marked as added by Hide.
schema = 1
id = "codex"
name = "Codex"
executables = ["codex"]
packages = ["@openai/codex"]
home = "~/.codex"
hooks = "codex"

[resume]
session = ["resume", "{session}"]

# Where an account's folders are (docs/ARCHITECTURE.md, Agent profiles and
# accounts).
[account]
by = "folder"

[account.login]
at = "login"
any = ["/OPENAI_API_KEY", "/tokens/access_token"]

[account.vars]
CODEX_HOME = { default = "~/.codex", profile = "{account}", isolated_home = true }

[account.paths]
hooks = "{CODEX_HOME}/hooks.json"
hook_trust = "{CODEX_HOME}/config.toml"
plugins = false
skills = "shared"
folder_trust = "{CODEX_HOME}/config.toml"
sessions = "{CODEX_HOME}/sessions"
login = "{CODEX_HOME}/auth.json"
state = "{CODEX_HOME}"
usage = "{CODEX_HOME}/archived_sessions"

[account.forbid]
vars = ["CODEX_SQLITE_HOME"]

[screen]
version = "2026.11.08.1"
min_engine_version = 3
updated_at = "2026-11-08T00:00:00Z"

[[screen.rules]]
id = "osc_title_blocked"
state = "blocked"
priority = 1100
region = "osc_title"
visible_blocker = true
contains = ["Action Required"]

[[screen.rules]]
id = "osc_title_working"
state = "working"
priority = 1050
region = "osc_title"
visible_working = true
regex = ['(?:^| )[⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏](?: |$)']

[[screen.rules]]
id = "transcript_viewer"
state = "unknown"
priority = 1000
region = "after_last_prompt_marker"
skip_state_update = true
contains = ["↑/↓ to scroll", "pgup/pgdn to", "home/end to jump", "q to quit"]
any = [
  { contains = ["esc to edit prev"] },
  { contains = ["esc/← to edit prev"] },
]

[[screen.rules]]
id = "trust_directory"
state = "blocked"
priority = 950
region = "top_non_empty_lines(20)"
visible_blocker = true
all = [
  { any = [
    { regex = ['\A> You are in [^\r\n]+(?:\r?\n|$)'] },
    { contains = ["Folder access"] },
  ] },
  { any = [
    { regex = ['(?s)Do\s+you\s+trust\s+the\s+contents\s+of\s+this\s+directory\?'] },
    { all = [
      { contains = ["Trust this folder?", "Codex can read, edit, and run files here"] },
      { any = [
        { contains = ["Trust and continue"] },
        { contains = ["enter continue"] },
      ] },
    ] },
  ] },
]

# Added by Hide: Codex's startup review of hooks it does not trust yet
# (codex-rs/tui/src/startup_hooks_review.rs, the same words from 0.160.0 to
# 0.167.0), which takes a typed line as its own keys
# (with-hide/hide-private#661).
[[screen.rules]]
id = "startup_hooks_review"
state = "blocked"
priority = 950
region = "top_non_empty_lines(20)"
visible_blocker = true
all = [
  { contains = ["Hooks need review"] },
  { any = [
    { contains = ["Trust all and continue"] },
    { contains = ["Continue without trusting"] },
  ] },
]

[[screen.rules]]
id = "startup_update"
state = "blocked"
priority = 950
region = "bottom_non_empty_lines(20)"
visible_blocker = true
# Keep the legacy dialog; the shared picker (0.159+) has a different heading
# and footer. Choices can scroll out of a short viewport, but both gates must
# remain visible. The passive update history notice has neither picker footer.
any = [
  { all = [
    { contains = ["Update available!", "Update now"] },
    { regex = ['Skip\s+until\s+next\s+version', 'Press enter to continue\s*\z'] },
  ] },
  { all = [
    { regex = ['(?m)^\s*Update\s+available\s+·'] },
    { regex = ['enter\s+continue\s+·\s+esc\s+skip\s*\z'] },
  ] },
]

# Added by Hide: a numbered list of choices drawn in place of the composer
# (codex-rs/tui/src/bottom_pane/list_selection_view.rs, `build_rows`, the same
# from 0.160.0 to 0.167.0), which every Codex menu that picks by number uses:
# the Windows sandbox setup and its failure menu, the permissions and model
# pickers. It takes a typed digit as its choice and Enter as its answer, so it
# is a question whatever its words (with-hide/hide-private#717). Read by its
# shape: the last `›` line is the selected row `› N. `, which the list keeps
# however short the pane, and no `›` line follows it, which tells it from a
# sent message above the composer. A draft in the composer that begins with
# `1. ` has the same shape and reads as a question until it is sent.
[[screen.rules]]
id = "numbered_choice"
state = "blocked"
priority = 900
region = "whole_recent"
visible_blocker = true
regex = ['(?m)^› [0-9]+\. [^\n]*(?:\n[^›\n][^\n]*|\n)*\z']

[[screen.rules]]
id = "live_strong_blocker"
state = "blocked"
priority = 900
region = "after_last_prompt_marker"
visible_blocker = true
any = [
  { contains = ["press enter to confirm or esc to cancel"] },
  { contains = ["enter to submit answer"] },
  { contains = ["enter to submit all"] },
  { contains = ["allow command?"] },
  { contains = ["All Results", "Filesystem Only", "Plugins"] },
]

[[screen.rules]]
id = "weak_blocker"
state = "blocked"
priority = 600
region = "whole_recent_without_current_prompt_marker"
# Sparkles can replace the space after ›. A later response marker makes that prompt stale.
not = [{ regex = ['(?m)^›[⠁⠂⠄⠈⠐⠠⡀⢀][^\n]*(?:\n(?:[^•■✗✓\n][^\n]*)?)*\z'] }]
any = [
  { contains = ["[y/n]"] },
  { contains = ["yes (y)"] },
  { contains = ["do you want to"], any = [{ contains = ["yes"] }, { contains = ["❯"] }] },
  { contains = ["would you like to"], any = [{ contains = ["yes"] }, { contains = ["❯"] }] },
]

[[screen.rules]]
id = "screen_working_fallback"
state = "working"
priority = 500
region = "before_current_prompt_marker"
visible_working = true
# Support animated and reduced-motion status, including dynamic activity labels.
# The interrupt hint can be remapped, unbound, or hidden, and queued inputs can
# sit below the status. Require the live timer suffix with no later response.
any = [{ contains = [" to interrupt)"] }, { contains = ["s)"] }]
regex = ['(?m)^(?:[•◦][ \t]+)?[^\s›•◦■✗✓─][^\r\n]* \((?:[0-9]+[hm] )*[0-9]+s(?: • [^\r\n]+? to interrupt)?\)(?: · [^\r\n]*)?(?:\r?\n(?:[^•◦›■✗✓─\r\n][^\r\n]*|•[ \t]+(?:Queued\s+follow-up\s+inputs|Messages\s+to\s+be\s+submitted\s+after\s+next\s+tool\s+call(?:\s+\(press\s+[^\r\n]+?\s+to\s+interrupt\s+and\s+send\s+immediately\))?|Messages\s+to\s+be\s+submitted\s+at\s+end\s+of\s+turn)|›[⠁⠂⠄⠈⠐⠠⡀⢀][^\r\n]*)?)*\s*\z']
# A failed reconnect keeps its final elapsed timer but is no longer working.
not = [{ line_regex = ['^(?:[•◦][ \t]+)?Reconnect failed — check the endpoint, then relaunch \([0-9hms ]+\)$'] }]

[[screen.rules]]
id = "osc_title_idle"
state = "idle"
priority = 100
region = "osc_title"
visible_idle = true
regex = ['\S']
not = [
  { regex = ['(?:^| )[⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏](?: |$)'] },
  { contains = ["Action Required"] },
]
