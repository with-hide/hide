# The [screen] rules are Herdr v0.9.5's agent detection manifest for this agent
# (https://github.com/herdrdev/herdr, commit 2ecf19a, src/detect/manifests/qodercli.toml).
# Copyright 2025 herdr contributors. Licensed under the Apache License,
# Version 2.0; see NOTICE at the repository root.
# Changed by Hide: the manifest's id and aliases became this file's identity
# and its version, engine and rules moved under [screen], unchanged.
# [resume] last: docs.qoder.com/cli/sessions, "Use -c (--continue) to directly continue the most recent session for the current project".
schema = 1
id = "qodercli"
name = "Qoder CLI"
executables = ["qodercli", "qoderclicn", "qoder", "qodercn"]
hooks = "none"

[resume]
last = ["--continue"]

[screen]
version = "2026.06.10.1"
min_engine_version = 1
updated_at = "2026-06-10T00:00:00Z"

[[screen.rules]]
id = "confirmation_or_input_blocker"
state = "blocked"
priority = 300
region = "whole_recent"
visible_blocker = true
any = [
  { contains = ["waiting for user confirmation"], any = [{ contains = ["yes"] }, { contains = ["no"] }, { contains = ["allow"] }, { contains = ["reject"] }] },
  { contains = ["awaiting approval"], any = [{ contains = ["allow"] }, { contains = ["reject"] }] },
  { contains = ["permission required"] },
  { contains = ["allow once or always?"] },
  { contains = ["asking user"] },
  { contains = ["enter your response"] },
  { contains = ["review your answers:"] },
  { contains = ["shell awaiting input"] },
]

[[screen.rules]]
id = "cancel_hint_working"
state = "working"
priority = 100
region = "whole_recent"
visible_working = true
contains = ["(esc to cancel,"]

[[screen.rules]]
id = "spinner_working"
state = "working"
priority = 90
region = "whole_recent"
visible_working = true
line_regex = ['^\s*[\u2800-\u28FF]\s+.*\p{Alphabetic}']
