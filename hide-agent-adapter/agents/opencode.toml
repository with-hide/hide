# The [screen] rules are Herdr v0.9.5's agent detection manifest for this agent
# (https://github.com/herdrdev/herdr, commit 2ecf19a, src/detect/manifests/opencode.toml).
# Copyright 2025 herdr contributors. Licensed under the Apache License,
# Version 2.0; see NOTICE at the repository root.
# Changed by Hide: the manifest's id and aliases became this file's identity
# and its version, engine and rules moved under [screen], unchanged, and
# Hide added the model_line_idle rule, which [start] ready names.
schema = 1
id = "opencode"
name = "OpenCode"
executables = ["opencode"]
packages = ["opencode-ai"]
home = "~/.config/opencode"
hooks = "opencode"

# OpenCode 2.0.29 reads keys and draws its composer before its model
# loads, and refuses the Enter that submits a line until the model's line
# shows under the composer (2.0 to 4.7 s after its start on macOS).
[start]
ready = "model_line_idle"

[resume]
session = ["-s", "{session}"]

# Where an account's folders are (docs/ARCHITECTURE.md, Agent profiles and
# accounts): OpenCode moves only with all three XDG folders.
[account]
by = "folder"

[account.vars]
XDG_CONFIG_HOME = { default = "~/.config", profile = "{account}/config" }
XDG_DATA_HOME = { default = "~/.local/share", profile = "{account}/data" }
XDG_STATE_HOME = { default = "~/.local/state", profile = "{account}/state" }

[account.paths]
hooks = false
hook_trust = false
plugins = "{XDG_CONFIG_HOME}/opencode/plugins"
skills = "shared"
folder_trust = false
sessions = "{XDG_DATA_HOME}/opencode/opencode.db"
login = false
state = "{XDG_CONFIG_HOME}/opencode"
usage = false

[account.forbid]
vars = ["OPENCODE_CONFIG_DIR", "OPENCODE_DB"]

[screen]
version = "2026.11.05.1"
min_engine_version = 1
updated_at = "2026-11-05T00:00:00Z"

[[screen.rules]]
id = "permission_required"
state = "blocked"
priority = 300
region = "whole_recent"
visible_blocker = true
any = [
  { contains = ["△ Permission required"] },
  { contains = ["esc dismiss"], any = [{ contains = ["enter confirm"] }, { contains = ["enter submit"] }, { contains = ["enter toggle"] }], all = [{ any = [{ contains = ["↑↓ select"] }, { contains = ["⇆ tab"] }] }] },
]

[[screen.rules]]
id = "interrupt_hint_working"
state = "working"
priority = 110
region = "whole_recent"
visible_working = true
any = [
  { contains = ["esc to interrupt"] },
  { contains = ["ctrl+c to interrupt"] },
  { contains = ["press esc to interrupt"] },
  { line_regex = ['(?i).*opencode.*esc (again to )?interrupt'] },
]

[[screen.rules]]
id = "progress_bar_working"
state = "working"
priority = 100
region = "whole_recent"
visible_working = true
regex = ['(■|⬝){4,}']

# The composer's last line names the agent and the model it sends to
# (`Build · <model> <provider>`), drawn only once the model has loaded.
[[screen.rules]]
id = "model_line_idle"
state = "idle"
priority = 10
region = "whole_recent"
regex = ['┃ +\S[^\n]* · \S[^\n]*\n *╹▀']
