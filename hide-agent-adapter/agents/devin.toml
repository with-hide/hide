# The [screen] rules are Herdr v0.9.5's agent detection manifest for this agent
# (https://github.com/herdrdev/herdr, commit 2ecf19a, src/detect/manifests/devin.toml).
# Copyright 2025 herdr contributors. Licensed under the Apache License,
# Version 2.0; see NOTICE at the repository root.
# Changed by Hide: the manifest's id and aliases became this file's identity
# and its version, engine and rules moved under [screen], unchanged; its
# alias with a space is left out, since a program is a plain file name.
schema = 1
id = "devin"
name = "Devin"
executables = ["devin", "devin-cli"]
hooks = "none"

[screen]
version = "2026.06.15.1"
min_engine_version = 1
updated_at = "2026-06-15T00:00:00Z"

[[screen.rules]]
id = "workspace_trust_prompt"
state = "blocked"
priority = 300
region = "bottom_non_empty_lines(8)"
visible_blocker = true
contains = [
  "do you trust the authors of this directory?",
  "with untrusted content.",
  "yes, trust ",
]

[[screen.rules]]
id = "permission_prompt"
state = "blocked"
priority = 290
region = "bottom_non_empty_lines(8)"
visible_blocker = true
contains = ["approve once", "select", "confirm", "esc cancel"]

[[screen.rules]]
id = "running_tools_footer"
state = "working"
priority = 200
region = "bottom_non_empty_lines(8)"
visible_working = true
contains = ["running tools", "esc to interrupt"]
not = [
  { contains = ["approve once", "esc cancel"] },
]

[[screen.rules]]
id = "guide_while_working"
state = "working"
priority = 190
region = "bottom_non_empty_lines(6)"
visible_working = true
contains = ["guide devin while it works"]
not = [
  { contains = ["approve once", "esc cancel"] },
]

[[screen.rules]]
id = "tool_reading_timeout"
state = "working"
priority = 180
region = "bottom_non_empty_lines(8)"
visible_working = true
contains = ["reading shell ", "timeout:"]
not = [
  { contains = ["approve once", "esc cancel"] },
]

[[screen.rules]]
id = "welcome_prompt_footer"
state = "idle"
priority = 120
region = "bottom_non_empty_lines(8)"
visible_idle = true
contains = ["ask devin to build", "features, fix bugs", "your code"]
line_regex = ['^\s*❭ Ask Devin to build']
not = [
  { contains = ["approve once", "esc cancel"] },
  { contains = ["running tools", "esc to interrupt"] },
  { contains = ["guide devin while it works"] },
]

[[screen.rules]]
id = "live_prompt_footer"
state = "idle"
priority = 100
region = "bottom_non_empty_lines(6)"
visible_idle = true
contains = ["context:"]
line_regex = ['^\s*❭']
not = [
  { contains = ["approve once", "esc cancel"] },
  { contains = ["running tools", "esc to interrupt"] },
  { contains = ["guide devin while it works"] },
]
