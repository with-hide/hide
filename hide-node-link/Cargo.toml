[package]
name = "hide-node-link"
version = "0.1.0"
edition = "2024"
publish = false

# The contract between the core and a node: the `NodeLink` trait and the
# shapes that cross it. Nothing here touches a machine (PRD core-host-node
# D-21), so the core depends on it without reaching one. The session and
# kit request shapes are still defined by `hide-session` and `hide-kit`, and
# the Project identity by `hide-project`, used
# here for their types only, as are the hook diagnosis of `hide-agent-hooks`
# and the provider answers of `hide-ai`.
# `hide-platform` is here for path spelling between machines and pure
# validation of Herdr session names.

[dependencies]
hide-agent-adapter = { path = "../hide-agent-adapter" }
hide-agent-hooks = { path = "../hide-agent-hooks" }
hide-ai = { path = "../hide-ai" }
hide-herdr-client = { path = "../hide-herdr-client" }
hide-kit = { path = "../hide-kit" }
hide-platform = { path = "../hide-platform" }
hide-project = { path = "../hide-project" }
hide-session = { path = "../hide-session" }
base64 = "=0.23.1"
libc = "=0.2.190"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["raw_value"] }
sha2 = "=0.10.9"
workspace-hack = { version = "0.1", path = "../workspace-hack" }
