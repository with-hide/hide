[package]
name = "hide-session"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
hide-agent-adapter = { path = "../hide-agent-adapter" }
libc = "=0.2.190"
anyhow = "=1.0.104"
hide-platform = { path = "../hide-platform" }
hide-project = { path = "../hide-project" }
hide-shell = { path = "../hide-shell" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
md5 = "=0.8.1"
memchr = "=2.8.3"
prost = "=0.14.4"
percent-encoding = "=2.3.2"
rusqlite = { version = "=0.32.1", features = ["bundled", "hooks", "limits"] }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
tempfile = "=3.27.0"
