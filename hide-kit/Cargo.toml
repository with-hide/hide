[package]
name = "hide-kit"
version = "0.1.0"
edition = "2024"
publish = false

# The one list of what Hide installs on a machine - the hide command, the
# Claude Code and Codex hooks - and how
# each is installed, judged and removed. hided runs it for this Mac and the
# device node (`hided node serve`) runs the same code on a device, so the
# two machines get the same kit (PRD device-parity D-09, D-10).

[dependencies]
hide-agent-adapter = { path = "../hide-agent-adapter" }
hide-agent-hooks = { path = "../hide-agent-hooks" }
hide-herdr-client = { path = "../hide-herdr-client" }
hide-platform = { path = "../hide-platform" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
tempfile = "=3.27.0"
